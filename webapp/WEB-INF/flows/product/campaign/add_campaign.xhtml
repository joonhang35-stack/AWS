<p:confirmDialog id="idConfirmStartCampaignDialog" header="Start Campaign Confirmation" widgetVar="varConfirmStartCampaignDialog" message="Confirm to start the campaign?" closable="false">
	<h:form>
		<p:growl id="msg"/>
		<p:commandButton value="#{msg['common.button.label.yes']}" actionListener="#{campaignBean.startSelectedCampaign}" update=":idAddCampaignForm" oncomplete="varConfirmStartCampaignDialog.hide()"/>
		<p:commandButton value="#{msg['common.button.label.no']}" oncomplete="varConfirmStartCampaignDialog.hide()" global="false"/>
	</h:form>
</p:confirmDialog>

<p:confirmDialog id="idConfirmStopCampaignDialog" header="Stop Campaign Confirmation" widgetVar="varConfirmStopCampaignDialog" message="Confirm to stop the campaign?" closable="false">
	<h:form>
		<p:growl id="msg"/>
		<p:commandButton value="#{msg['common.button.label.yes']}" actionListener="#{campaignBean.stopSelectedCampaign}" update=":idAddCampaignForm" oncomplete="varConfirmStopCampaignDialog.hide()"/>
		<p:commandButton value="#{msg['common.button.label.no']}" oncomplete="varConfirmStopCampaignDialog.hide()" global="false"/>
	</h:form>
</p:confirmDialog>

<!-- DIALOG - SELECT TOUR PACKAGE -->
<p:dialog id="idAssignTourPkgListDialog" header="Tour Package List" widgetVar="varAssignTourPkgListDialog" modal="true"

    hideEffect="fade" showEffect="fade" closable="false"
    width="950" height="700">
    
    <h:form id="idAssignTourPkgListForm">
        <ui:include src="select_assign_tour_pkg_list.xhtml" />
    </h:form>
</p:dialog>

<p:confirmDialog id="idDelAssignedTourDialog" header="Delete Selected Tour" widgetVar="varDelAssignedTourDialog" message="Are you sure want to delete this record?" closable="false">
	<h:form>
		<p:growl id="msg"/>
		<p:commandButton value="#{msg['common.button.label.yes']}" actionListener="#{campaignBean.deleteSelectedTour}" update=":idAddCampaignForm" oncomplete="varDelAssignedTourDialog.hide()"/>
		<p:commandButton value="#{msg['common.button.label.no']}" oncomplete="varDelAssignedTourDialog.hide()" global="false"/>
	</h:form>
</p:confirmDialog>

<!-- DIALOG - ADD COUNTRY TAB -->
<p:dialog id="idAddCampaignCountryTabDialog" header="Add Country Tab"

<!-- DIALOG - DELETE CAMPAIGN COUNTRY -->
<p:confirmDialog id="idDelCampaignCountryDialog" header="Delete Country" widgetVar="varDelCampaignCountryDialog" message="Are you sure to delete this record?" closable="false">

		<p:commandButton value="#{msg['common.button.label.no']}" oncomplete="varDelCampaignCountryDialog.hide()" global="false"/>
	</h:form>
