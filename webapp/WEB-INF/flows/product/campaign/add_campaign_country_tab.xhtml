<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<style>
	.disabled {
		background : grey !important;
		color : white;
		cursor : auto;
		pointer-events : none;
	}
</style>
<p:panelGrid>
	<p:row>
		<p:column>
			<h:outputLabel for="idName">Name <span class="required">*</span></h:outputLabel> 
		</p:column>
		<p:column>
			<p:inputText id="idName" label="Name" value="#{campaignBean.campaignCountryVO.name}" required="true"/>
		</p:column>
	</p:row>
	
</p:panelGrid>

<h:panelGrid columns="2">
	<p:commandButton value="#{msg['common.button.label.save']}" actionListener="#{campaignBean.addCampaignCountry}" update="@form,:idAddCampaignForm"/>
	<p:commandButton value="#{msg['common.button.label.cancel']}" oncomplete="varAddCampaignCountryTabDialog.hide();"/>
</h:panelGrid>
</ui:composition>
