<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:zsg="http://www.bcs.com/zsg/jsf"
	xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">
	
<p:panelGrid>
	<p:row>
		<p:column>
			<h:outputLabel>Cabin Type <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<h:selectOneMenu id="idCabinType" label="Cabin Type" value="#{tourPkgBean.tourCabinVO.cruiseCabinCd}" required="true">
				<f:selectItem itemLabel="Select One" />
				<f:selectItems value="#{tourPkgBean.cabinList}" var="vo" itemValue="#{vo.code}" itemLabel="#{vo.description}" />
			</h:selectOneMenu>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Cabin Allotment <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idCabinAllotment" label="Cabin Allotment" value="#{tourPkgBean.tourCabinVO.cabinAllotment}"
				required="true" maxlength="3">
				<pe:keyFilter regEx="/[\d]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Max Pax/Cabin <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idPaxCabin" label="Max Pax/Cabin" value="#{tourPkgBean.tourCabinVO.paxPerCabin}" required="true" maxlength="3">
				<pe:keyFilter regEx="/[\d]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Adult 1st/2nd <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idPriceTwn" label="Price 1st/2nd" value="#{tourPkgBean.tourCabinVO.priceTwn}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
				<p:ajax event="blur" listener="#{tourPkgBean.handlePriceTwnInput}" process="@this,idCabinType" update="idPriceSgl,idPriceInf" global="false"/>
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Adult 3rd <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idPrice3" label="Price 3rd" value="#{tourPkgBean.tourCabinVO.price3}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Adult 4th <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idPrice4" label="Price 4th" value="#{tourPkgBean.tourCabinVO.price4}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Adult Single <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idPriceSgl" label="Price Single" value="#{tourPkgBean.tourCabinVO.priceSgl}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Child 3rd <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idPrice3Chd" value="#{tourPkgBean.tourCabinVO.price3Chd}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Child 4th <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idPrice4Chd" value="#{tourPkgBean.tourCabinVO.price4Chd}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Price Infant <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText id="idPriceInf" label="Price Infant" value="#{tourPkgBean.tourCabinVO.priceInf}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Discount Level 1</h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText value="#{tourPkgBean.tourCabinVO.discountLvl1}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
			</p:inputText>
		</p:column>
		<p:column>
			<h:outputLabel>Pax</h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText value="#{tourPkgBean.tourCabinVO.discountLvl1Pax}" required="true" maxlength="3">
				<pe:keyFilter regEx="/[\d]/" />
			</p:inputText>
		</p:column>
	</p:row>
	<p:row>
		<p:column>
			<h:outputLabel>Discount Level 2</h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText value="#{tourPkgBean.tourCabinVO.discountLvl2}" required="true" maxlength="10">
				<f:convertNumber pattern="#,##0.00" />
				<pe:keyFilter regEx="/[\d\.\s,]/" />
			</p:inputText>
		</p:column>
		<p:column>
			<h:outputLabel>Pax</h:outputLabel>
		</p:column>
		<p:column>
			<p:inputText value="#{tourPkgBean.tourCabinVO.discountLvl2Pax}" required="true" maxlength="3">
				<pe:keyFilter regEx="/[\d]/" />
			</p:inputText>
		</p:column>
	</p:row>
</p:panelGrid>
<h:panelGrid columns="2" style="width:1px; margin-top:10px;">
	<p:commandButton value="#{msg['common.button.label.save']}"
		actionListener="#{tourPkgBean.saveTourCabin}"
		update="@form,:idAddTourDepForm:idTourCabinListTable,:idEditTourDepForm:idTourCabinListTable"
		rendered="#{empty tourPkgBean.tourCabinVO.uuid}" />
	<p:commandButton value="#{msg['common.button.label.save']}"
		actionListener="#{tourPkgBean.saveTourCabin}"
		update="@form,:idAddTourDepForm:idTourCabinListTable,:idEditTourDepForm:idTourCabinListTable"
		oncomplete="varAddCruiseCabinDialog.hide()"
		rendered="#{not empty tourPkgBean.tourCabinVO.uuid}" />
	<p:commandButton value="#{msg['common.button.label.cancel']}"
		actionListener="#{tourPkgBean.resetTourCabinForm}"
		oncomplete="varAddCruiseCabinDialog.hide()"
		process="@this">
		<pe:resetEditableValues for="idAddCruiseCabinForm" />
	</p:commandButton>
</h:panelGrid>
</ui:composition>
