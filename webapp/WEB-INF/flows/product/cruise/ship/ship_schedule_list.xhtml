<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<p:growl id="msg"/>

<h:panelGrid columns="2" style="width:1px;">
	<p:inputText id="idScheduleSearch" label="Search Schedule" value="#{cruiseBean.scheduleSearch}"/>
	<p:commandButton value="Search" actionListener="#{cruiseBean.cruiseSchedule}" update="@form"/>
</h:panelGrid>

<h:panelGrid columns="2" style="width:1px;">
	<p:commandButton value="Add" oncomplete="varAddCruiseScheduleDialog.show()" update=":idAddCruiseScheduleDialog" immediate="true"/>
	<p:commandButton value="Cancel" actionListener="#{cruiseBean.resetForm}" oncomplete="varCruiseSchedulesDialog.hide()" process="@this" update="@form"/>
</h:panelGrid>
<div style="height:400px;overflow:auto;">
	<p:panel id="idShowScheduleList" >
		<c:if test="#{empty cruiseBean.cruiseScheduleList}">
			<p:panel>
				Cruise schedule is empty, please add it.
			</p:panel>
		</c:if>
		
		<c:forEach items="#{cruiseBean.cruiseScheduleList}" var="vo">
			<p:panelGrid style="margin-top:5px;">
				<p:row>
					<p:column style="background:#98ade7;"><h:outputText value="#{vo.desc}"/></p:column>
					<p:column style="width:50px; background:#98ade7; text-align:right;">
						<p:commandLink styleClass="ui-icon ui-icon-plus" actionListener="#{cruiseBean.setCruiseScheduleVO(vo)}" oncomplete="varAddCruiseScheduleItemDialog.show()" update=":idAddCruiseScheduleItemDialog" style="float:left;"/>
						<p:commandLink styleClass="ui-icon ui-icon-pencil" actionListener="#{cruiseBean.populateScheduleChargeList(vo)}" oncomplete="varEditCruiseScheduleDialog.show()" style="float:left;" update="@form, :idEditCruiseScheduleDialog"/>
						<p:commandLink styleClass="ui-icon ui-icon-close" actionListener="#{cruiseBean.setCruiseScheduleVO(vo)}" oncomplete="varDelCruiseScheduleDialog.show()" style="float:left;"/>
					</p:column>
				</p:row>
			</p:panelGrid>
			<p:dataTable value="#{vo.cruiseScheduleItemList}" var="itemVO" style="margin-bottom:5px;">
				<p:column style="width:30px">
					<p:commandLink styleClass="ui-icon ui-icon-pencil" actionListener="#{cruiseBean.handleCruiseScheduleItemSelect(itemVO)}" update=":idEditCruiseScheduleItemDialog" oncomplete="varEditCruiseScheduleItemDialog.show()"/>
				</p:column>
				<p:column style="width:30px">
					<p:commandLink styleClass="ui-icon ui-icon-close" actionListener="#{cruiseBean.setCruiseScheduleItemVO(itemVO)}" oncomplete="varDelCruiseScheduleItemDialog.show()" style="float:left;"/>
				</p:column>
				<p:column headerText="Type" style="width:80px"><h:outputText value="#{itemVO.typeCd}"/></p:column>
				<p:column headerText="Cruise Code" style="width:80px"><h:outputText value="#{itemVO.flightCd}"/></p:column>
				<p:column headerText="From" style="width:80px"><h:outputText value="#{itemVO.fromAirportCd}"/></p:column>
				<p:column headerText="To" style="width:80px"><h:outputText value="#{itemVO.toAirportCd}"/></p:column>
				<p:column headerText="ETD" style="width:80px"><h:outputText value="#{itemVO.etd}"/></p:column>
				<p:column headerText="ETA" style="width:80px">
					<h:outputText value="#{itemVO.eta}" rendered="#{not itemVO.isNextDay}"/>
					<h:outputText value="#{itemVO.eta}+1" rendered="#{itemVO.isNextDay}"/>
				</p:column>
				<p:column headerText="Remarks" style="width:200px"><h:outputText value="#{itemVO.remarks}"/></p:column>
			</p:dataTable>
		</c:forEach>
	</p:panel>
</div>
<h:panelGrid columns="2" style="width:1px;">
	<p:commandButton value="Add" oncomplete="varAddCruiseScheduleDialog.show()" update=":idAddCruiseScheduleDialog" immediate="true"/>
	<p:commandButton value="Cancel" actionListener="#{cruiseBean.resetForm}" oncomplete="varCruiseSchedulesDialog.hide()" process="@this" update="@form"/>
</h:panelGrid>

</ui:composition>
