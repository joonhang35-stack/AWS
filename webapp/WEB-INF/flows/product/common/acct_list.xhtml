<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<p:dataTable value="#{tourPkgBean.acctViewList}" var="vo" paginator="true" rows="10" 
	paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
	rowsPerPageTemplate="5, 10, 15" rowKey="#{vo.id}" selectionMode="single">
	<p:ajax event="rowSelect" listener="#{tourPkgBean.handleAcctSelect}" update=":idAddTourThemeForm:idAcct" oncomplete="varAcctListDialog.hide()"/>
	
	<p:column headerText="Account" sortBy="#{vo.code}" filterBy="#{vo.code}">
		<h:outputText value="#{vo.code}" rendered="#{empty vo.subCode}"/>
		<h:outputText value="#{vo.code}-#{vo.subCode}" rendered="#{not empty vo.subCode}"/>
	</p:column>
	<p:column headerText="Description" sortBy="#{vo.desc}" filterBy="#{vo.desc}">
		<h:outputText value="#{vo.desc}" rendered="#{empty vo.subDesc}"/>
		<h:outputText value="#{vo.desc}, #{vo.subDesc}" rendered="#{not empty vo.subDesc}"/>
	</p:column>
</p:dataTable>
	<h:panelGrid columns="1">
		<p:commandButton value="#{msg['common.button.label.cancel']}" onclick="varAcctListDialog.hide()"/>
	</h:panelGrid>
</ui:composition>
