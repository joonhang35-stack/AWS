<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<p:growl id="msg"/>

<script type="text/javascript">
	function onValidation(xhr, status, args) {
		if (args.validationFailed) {
			varTourRemarksDialog.show();
		} else {
			varTourRemarksDialog.hide();
		}
	}
</script>

<p:panelGrid>
	<p:row>
		<p:column>
			<h:outputLabel for="idRemarks">Remark <span class="required">*</span></h:outputLabel>
		</p:column>
		<p:column>
			<p:inputTextarea id="idRemarks" rows="10" cols="50" value="#{tourPkgBean.tourRemarksVO.remarksDetails}" required="true"></p:inputTextarea>
     </p:column>
	</p:row>
</p:panelGrid>

<h:panelGrid columns="2" style="width: 10px;">
	<p:commandButton value="#{msg['common.button.label.save']}" actionListener="#{tourPkgBean.addRemarks}" update="@form,:idAddTourDepForm:idRemarksListPanel,:idEditTourDepForm:idRemarksListPanel" rendered="#{tourPkgBean.remarksAdd}"/>
	<p:commandButton value="#{msg['common.button.label.update']}" actionListener="#{tourPkgBean.updateRemarks}" update="@form,:idAddTourDepForm:idRemarksListTable,:idEditTourDepForm:idRemarksListTable" oncomplete="onValidation(xhr, status, args)" rendered="#{not tourPkgBean.remarksAdd}"/>
	<p:commandButton value="#{msg['common.button.label.cancel']}" actionListener="#{tourPkgBean.resetRemarksForm}" update="@form" process="@this" oncomplete="varTourRemarksDialog.hide()" global="false">
		<pe:resetEditableValues for="idTourRemarksForm"/>
	</p:commandButton>
</h:panelGrid>

</ui:composition>
