<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<script type="text/javascript">
	function onTourMiceValidation(xhr, status, args) {
		if (!args.validationFailed) {
			varEditTourMICEDialog.hide()
		}
	}
</script>
<p:growl id="msg"/>
<p:panelGrid>
	<p:row rendered="#{empty tourPkgBean.searchParamVO.obj2}">
		<p:column><h:outputLabel for="idTourCat1">Category: <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
			<h:selectOneMenu id="idTourCat1" value="#{tourPkgBean.tourPkgVO.idTourCat}" effect="fade" required="true">
				<f:selectItem itemLabel="Select One"/>
				<f:selectItems value="#{tourPkgBean.tourCatViewList}" var="vo" itemLabel="#{vo.desc}" itemValue="#{vo.id}"/>
			</h:selectOneMenu>
		</p:column>
	</p:row>
	<p:row>
		<p:column style="width:150px"><h:outputLabel>Number of <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
			<p:inputText label="Days" value="#{tourPkgBean.tourPkgVO.numDays}" required="true" maxlength="2" style="width:50px"><pe:keyFilter regEx="/[\d]/"/></p:inputText> Days&nbsp;&nbsp;&nbsp;&nbsp;
			<p:inputText label="Nights" value="#{tourPkgBean.tourPkgVO.numNights}" required="true" maxlength="2" style="width:50px"><pe:keyFilter regEx="/[\d]/"/></p:inputText> Nights
		</p:column>
	</p:row>
	<p:row>
		<p:column><h:outputLabel for="idTourCd">Tour Code <span class="required">*</span></h:outputLabel></p:column>
		<p:column colspan="2"><p:inputText id="idTourCd" value="#{tourPkgBean.tourDepVO.code}" maxlength="30" required="true"/> <span style="font-style:italic; font-size:9px; color:#333333;">max: 30 char</span></p:column>
	</p:row>
	<p:row>
		<p:column><h:outputLabel for="idTourDesc">Tour Description <span class="required">*</span></h:outputLabel></p:column>
		<p:column colspan="2">
			<p:inputText id="idTourDesc" value="#{tourPkgBean.tourPkgVO.nameZh}" maxlength="50" style="width:300px;" required="true"/>
			<h:inputHidden value="#{tourPkgBean.tourPkgVO.nameEn}"></h:inputHidden>
		</p:column>
	</p:row>
	<p:row>
		<p:column><h:outputLabel for="idDtDep">Departure <span class="required">*</span></h:outputLabel></p:column>
		<p:column colspan="2"><p:calendar id="idDtDep" value="#{tourPkgBean.tourDepVO.dtDep}" pattern="dd-MMM-yyyy" required="true" navigator="true" showButtonPanel="true"/> <span style="font-style:italic; font-size:9px; color:#333333;">(dd-MMM-yyyy)</span></p:column>
	</p:row> 
	<p:row>
		<p:column><h:outputLabel for="idAirline">Airline <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
			<h:selectOneMenu id="idAirline" label="Airline" value="#{tourPkgBean.tourDepVO.idAirline}" effect="fade" required="true">
				<f:selectItem itemLabel="Select One"/>
				<f:selectItems value="#{tourPkgBean.airlineList}" var="vo" itemValue="#{vo.id}" itemLabel="#{vo.code}"/>
			</h:selectOneMenu>
		</p:column>
	</p:row>
	<p:row>
		<p:column><p:commandButton value="Region" oncomplete="varRegionDialog.show()" update=":idRegionDialog"/></p:column>
		<p:column>
			<p:dataTable id="idRegionList" value="#{tourPkgBean.tourPkgVO.regionList}" var="vo">
				<!--p:column headerText="Edit" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-pencil" actionListener="#{tourPkgBean.setRegionVO(vo)}" oncomplete="varRegionDialog.show()" process="@this"/>
				</p:column-->
				<p:column headerText="Delete" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-close" actionListener="#{tourPkgBean.delRegion(vo)}" update=":idAddTourMICEForm:idRegionList,:idEditTourMICEForm:idRegionList" process="@this"/>
				</p:column>
				<p:column headerText="Region">
					<h:outputText value="#{vo.regionname}"/>
				</p:column>
			</p:dataTable>
		</p:column>
		<!--p:column><h:outputLabel for="idRegion">Region <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
			<h:selectOneMenu id="idRegion" label="Region" value="#{tourPkgBean.tourPkgVO.idRegion}" effect="fade" required="true">
				<f:selectItem itemLabel="Select One"/>
				<f:selectItems value="#{tourPkgBean.regionList}" var="vo" itemValue="#{vo.id}" itemLabel="#{vo.regionname}"/>
				<p:ajax listener="#{tourPkgBean.handleRegionSelect}" event="change" update="idCountry"/>
			</h:selectOneMenu>
		</p:column-->
	</p:row>
	<p:row>
		<p:column><p:commandButton value="Country" oncomplete="varCountryDialog.show()" update=":idCountryDialog"/></p:column>
		<p:column>
			<p:dataTable id="idCountryList" value="#{tourPkgBean.tourPkgVO.countryList}" var="vo">
				<!--p:column headerText="Edit" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-pencil" actionListener="#{tourPkgBean.setCountryVO(vo)}" oncomplete="varCountryDialog.show()" process="@this"/>
				</p:column-->
				<p:column headerText="Delete" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-close" actionListener="#{tourPkgBean.delCountry(vo)}" update=":idAddTourMICEForm:idCountryList,:idEditTourMICEForm:idCountryList" process="@this"/>
				</p:column>
				<p:column headerText="Country">
					<h:outputText value="#{vo.country}"/>
				</p:column>
			</p:dataTable>
		</p:column>
		<!--p:column><h:outputLabel for="idCountry">Country <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
			<h:selectOneMenu id="idCountry" label="Country" value="#{tourPkgBean.tourPkgVO.idCountry}" effect="fade" required="true">
				<f:selectItems value="#{tourPkgBean.countryList}" var="vo" itemValue="#{vo.id}" itemLabel="#{vo.country}"/>
			</h:selectOneMenu>
		</p:column-->
	</p:row>
	<p:row>
		<p:column><h:outputLabel for="idRemarks">Tour Remarks</h:outputLabel></p:column>
		<p:column colspan="2"><p:inputTextarea label="Tour Remarks" id="idRemarks" value="#{tourPkgBean.tourDepVO.invRemarks}" rows="5" style="width:300px"/></p:column>
	</p:row>
</p:panelGrid>
<h:panelGrid columns="2" style="width:1px">
	<p:commandButton value="#{msg['common.button.label.save']}" actionListener="#{tourPkgBean.addTourMICE}" update="@form,:idTourPkgForm" rendered="#{empty tourPkgBean.tourPkgVO.id and not sessionInfoBean.employeeVO.department.contains('sale')}"/>
	<p:commandButton value="#{msg['common.button.label.update']}" actionListener="#{tourPkgBean.updTourMICE}" update="@form,:idTourPkgForm" oncomplete="onTourMiceValidation(xhr, status, args)" rendered="#{not empty tourPkgBean.tourPkgVO.id and not sessionInfoBean.employeeVO.department.contains('sale')}"/>
	<p:commandButton value="#{msg['common.button.label.cancel']}" actionListener="#{tourPkgBean.resetForm}" oncomplete="varAddTourMICEDialog.hide(),varEditTourMICEDialog.hide()" process="@this" update="@form">
		<pe:resetEditableValues for="idAddTourMICEForm,idEditTourMICEForm"/>
	</p:commandButton>
</h:panelGrid>
</ui:composition>
