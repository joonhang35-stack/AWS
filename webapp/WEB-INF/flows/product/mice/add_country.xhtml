<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<p:growl id="msg"/>
<p:panelGrid>
	<p:row>
		<p:column>
			<h:selectOneMenu value="#{tourPkgBean.countryVO.id}">
				<f:selectItems value="#{tourPkgBean.countryList}" var="vo" itemLabel="#{vo.country}" itemValue="#{vo.id}"/>
			</h:selectOneMenu>
		</p:column>
	</p:row>
</p:panelGrid>
<h:panelGrid columns="2" style="width:1px">
	<p:commandButton value="#{msg['common.button.label.save']}" actionListener="#{tourPkgBean.addCountry}" update="@form,:idAddTourMICEForm:idCountryList,:idEditTourMICEForm:idCountryList" rendered="#{empty tourPkgBean.countryVO.id}"/>
	<p:commandButton value="#{msg['common.button.label.update']}" actionListener="#{tourPkgBean.resetCountryForm}" update="@form,:idAddTourMICEForm:idCountryList,:idEditTourMICEForm:idCountryList" oncomplete="varCountryDialog.hide()" rendered="#{not empty tourPkgBean.countryVO.id}"/>
	<p:commandButton value="#{msg['common.button.label.cancel']}" actionListener="#{tourPkgBean.resetCountryForm}" oncomplete="varCountryDialog.hide()" process="@this" update="@form">
		<pe:resetEditableValues for="idCountryForm"/>
	</p:commandButton>
</h:panelGrid>
</ui:composition>
