<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<p:growl id="msg"/>
<p:panelGrid>
	<p:row>
		<p:column>
			<p:fileUpload id="idTourItinery" fileUploadListener="#{tourPkgBean.handleFileUpload}" mode="advanced" auto="true" sizeLimit="#{bterp:globalConfigValue('GLOBAL', 'PATH_PDF_FILE_SIZE')}" allowTypes="/(\.|\/)(pdf)$/" description="*.pdf" update="msg,:idAddTourDepForm:idShowTourItineries,:idEditTourDepForm:idShowTourItineries" oncomplete="varAddCustItineryDialog.hide(),varAddAgentItineryDialog.hide()"/>
		</p:column>
	</p:row>
</p:panelGrid>
<h:panelGrid columns="2" style="width:1px;">
	<p:commandButton value="#{msg['common.button.label.cancel']}" actionListener="#{tourPkgBean.resetTourItineryForm}" oncomplete="varAddCustItineryDialog.hide(),varAddAgentItineryDialog.hide()" process="@this" update="@form">
		<pe:resetEditableValues for="idAddCustItineryForm,idAddAgentItineryForm"/>
	</p:commandButton>
</h:panelGrid>
</ui:composition>
