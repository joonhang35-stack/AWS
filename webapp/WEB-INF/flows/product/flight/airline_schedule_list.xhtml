<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<p:growl id="msg"/>

<h:panelGrid columns="2" style="width:1px;">
	<p:inputText id="idScheduleSearch" label="Search Schedule" value="#{airlineBean.scheduleSearch}" onkeypress="if (event.keyCode == 13) { return false; }"/>
	<p:commandButton value="Search" actionListener="#{airlineBean.searchSchedule}" update="@form"/>
</h:panelGrid>

<h:panelGrid columns="2" style="width:1px;">
	<p:commandButton value="Add" actionListener="#{airlineBean.onAddAirlineSchedule}" oncomplete="varAddAirlineScheduleDialog.show()" update=":idAddAirlineScheduleDialog" immediate="true"/>
	<p:commandButton value="Cancel" actionListener="#{airlineBean.resetForm}" oncomplete="varAirlineSchedulesDialog.hide()" process="@this" update="@form"/>
</h:panelGrid>
<div style="height:400px;overflow:auto;">
	<p:panel id="idShowScheduleList" >
		<c:if test="#{empty airlineBean.airlineScheduleList}">
			<p:panel>
				Airline schedule is empty, please add it.
			</p:panel>
		</c:if>
		
		<c:forEach items="#{airlineBean.airlineScheduleList}" var="vo">
			<p:panelGrid style="margin-top:5px;">
				<p:row>
					<p:column style="background:#{config['table.header.color']};"><h:outputText value="#{vo.desc}"/></p:column>
					<p:column style="width:50px; background:#{config['table.header.color']}; text-align:right;">
						<p:commandLink styleClass="ui-icon ui-icon-plus" actionListener="#{airlineBean.setAirlineScheduleVO(vo)}" oncomplete="varAddAirlineScheduleItemDialog.show()" update=":idAddAirlineScheduleItemDialog" style="float:left;"/>
						<p:commandLink styleClass="ui-icon ui-icon-pencil" actionListener="#{airlineBean.populateScheduleChargeList(vo)}" oncomplete="varEditAirlineScheduleDialog.show()" style="float:left;" update="@form, :idEditAirlineScheduleDialog"/>
						<p:commandLink styleClass="ui-icon ui-icon-close" actionListener="#{airlineBean.setAirlineScheduleVO(vo)}" oncomplete="varDelAirlineScheduleDialog.show()" style="float:left;"/>
					</p:column>
				</p:row>
			</p:panelGrid>
			<p:dataTable value="#{vo.airlineScheduleItemList}" var="itemVO" style="margin-bottom:5px;">
				<p:column style="width:30px">
					<p:commandLink styleClass="ui-icon ui-icon-pencil" actionListener="#{airlineBean.handleAirlineScheduleItemSelect(itemVO)}" update=":idEditAirlineScheduleItemDialog" oncomplete="varEditAirlineScheduleItemDialog.show()"/>
				</p:column>
				<p:column style="width:30px">
					<p:commandLink styleClass="ui-icon ui-icon-close" actionListener="#{airlineBean.setAirlineScheduleItemVO(itemVO)}" oncomplete="varDelAirlineScheduleItemDialog.show()" style="float:left;"/>
				</p:column>
				<p:column headerText="Type" style="width:80px"><h:outputText value="#{itemVO.typeCd}"/></p:column>
				<p:column headerText="Flight Code" style="width:80px"><h:outputText value="#{itemVO.flightCd}"/></p:column>
				<p:column headerText="From" style="width:80px"><h:outputText value="#{itemVO.fromAirportCd}"/></p:column>
				<p:column headerText="To" style="width:80px"><h:outputText value="#{itemVO.toAirportCd}"/></p:column>
				<p:column headerText="ETD" style="width:80px"><h:outputText value="#{itemVO.etd}"/></p:column>
				<p:column headerText="ETA" style="width:80px">
					<h:outputText value="#{itemVO.eta}" rendered="#{not itemVO.isNextDay}"/>
					<h:outputText value="#{itemVO.eta}+1" rendered="#{itemVO.isNextDay}"/>
				</p:column>
				<p:column headerText="Remarks" style="width:200px"><h:outputText value="#{itemVO.remarks}"/></p:column>
			</p:dataTable>
		</c:forEach>
	</p:panel>
</div>
<h:panelGrid columns="2" style="width:1px;">
	<p:commandButton value="Add" oncomplete="varAddAirlineScheduleDialog.show()" update=":idAddAirlineScheduleDialog" immediate="true"/>
	<p:commandButton value="Cancel" actionListener="#{airlineBean.resetForm}" oncomplete="varAirlineSchedulesDialog.hide()" process="@this" update="@form"/>
</h:panelGrid>

</ui:composition>
