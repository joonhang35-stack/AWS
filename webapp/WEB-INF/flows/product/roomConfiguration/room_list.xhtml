<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
				template="/WEB-INF/views/layouts/main.xhtml">

<ui:define name="content">
<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var filters = document.querySelectorAll('input.ui-column-filter');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    });
</script>
<p:panel header="Room Configuration" toggleable="true" toggleSpeed="500">
	<h:form id="idTourRoomConfigForm">
		<h:panelGrid columns="2" style="width:1px;">
			<p:commandButton value="Add" actionListener="#{roomConfigBean.addNewRoomConfig}" oncomplete="varAddRoomConfigDialog.show()" update=":idAddRoomConfigDialog" immediate="true"/>
		</h:panelGrid>
		
 		<p:dataTable id="idRoomConfigList" value="#{roomConfigBean.tourRoomConfigViewList}" var="vo" paginator="true" rows="20" 
			paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
			rowsPerPageTemplate="20, 30, 50" filterEvent="enter">
			
			<p:column headerText="Edit" style="width:50px; text-align:center;">
				<p:commandButton icon="ui-icon-pencil" actionListener="#{roomConfigBean.handleRoomConfigSelect(vo)}" update=":idEditRoomConfigDialog" oncomplete="varEditRoomConfigDialog.show()"/>
			</p:column>
			<p:column headerText="Delete" style="width:50px; text-align:center;">
				<p:commandButton icon="ui-icon-close" actionListener="#{roomConfigBean.handleRoomConfigSelect(vo)}" oncomplete="varDelRoomConfigDialog.show()"/>
			</p:column>
			
			<p:column headerText="Description" sortBy="#{vo.description}" filterBy="#{vo.description}" filterMatchMode="contains">
				<h:outputText value="#{vo.description}"/>
			</p:column>
			
			<p:column headerText="Tour Fare" styleClass="txt_center" sortBy="#{vo.tourFare}" filterBy="#{vo.tourFare}" filterMatchMode="contains">
				<ui:repeat value="#{vo.tourFare.split(',')}" var="tourFare">
			       <h:outputText value="#{tourFare}"/><br/>
			    </ui:repeat>
			</p:column>
			
			<p:column headerText="Group" sortBy="#{vo.codeDesc}" filterBy="#{vo.codeDesc}" filterMatchMode="contains">
				<h:outputText value="#{vo.codeDesc}"/>
			</p:column>
		</p:dataTable>
		
		<h:panelGrid columns="2" style="width:1px;">
			<p:commandButton value="Add" oncomplete="varAddRoomConfigDialog.show()" update=":idAddRoomConfigDialog" immediate="true"/>
		</h:panelGrid>
	</h:form>
</p:panel>

<!--
	DIALOG - ADD CATEGORY
-->
<p:dialog id="idAddRoomConfigDialog" widgetVar="varAddRoomConfigDialog" modal="true" resizable="false" dynamic="true" draggable="true" 
	hideEffect="fade" showEffect="fade" closable="false">
	<f:facet name="header">
		<h:outputFormat value="Add Room Configuration" />
	</f:facet>
	
	<h:form id="idAddRoomConfigForm">
		<ui:include src="add_room_config.xhtml" />
	</h:form>
</p:dialog>

<!--
	DIALOG - EDIT CATEGORY
-->
<p:dialog id="idEditRoomConfigDialog" widgetVar="varEditRoomConfigDialog" modal="true" resizable="false" dynamic="true" draggable="true" 
	hideEffect="fade" showEffect="fade" closable="false">
	<f:facet name="header">
		<h:outputFormat value="Edit Room Configuration" />
	</f:facet>
	
	<h:form id="idEditRoomConfigForm">
		<ui:include src="add_room_config.xhtml" />
	</h:form>
</p:dialog>
	
<!--
	DIALOG - DELETE CATEGORY
-->
<p:confirmDialog widgetVar="varDelRoomConfigDialog" message="Are you sure want to delete this record?">
	<h:form>
		<p:growl id="msg"/>
		<p:commandButton value="#{msg['common.button.label.yes']}" actionListener="#{roomConfigBean.delRoomConfig}" update="@form,:idTourRoomConfigForm" oncomplete="varDelRoomConfigDialog.hide()"/>
		<p:commandButton value="#{msg['common.button.label.no']}" actionListener="#{roomConfigBean.resetForm}" oncomplete="varDelRoomConfigDialog.hide()"/>
	</h:form>
</p:confirmDialog>
</ui:define>
</ui:composition>
