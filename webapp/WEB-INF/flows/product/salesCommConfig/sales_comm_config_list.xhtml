<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
				template="/WEB-INF/views/layouts/main.xhtml">

<ui:define name="content">
<p:panel header="Sales Commission Configuration" toggleable="true" toggleSpeed="500">
	<h:form id="idForm">
		<p:panelGrid columns="2" style="width:1px;">
			<p:commandButton value="#{msg['common.label.action.add']}" actionListener="#{salesCommConfigBean.handleAddSalesCommConfig}" 
				oncomplete="varSalesCommConfigDialog.show()" update=":idSalesCommConfigDialog"/>
		</p:panelGrid>
		
		<p:dataTable id="idSalesCommConfigList" value="#{salesCommConfigBean.salesCommConfigList}" var="configVO" paginator="true" rows="20" 
			paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
			rowsPerPageTemplate="20, 30, 50" filterEvent="enter">
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" headerText="Edit" style="width:50px"/>
					<p:column rowspan="2" headerText="Delete" style="width:50px"/>
					<p:column rowspan="2" headerText="Group Name" style="width:150px" sortBy="#{configVO.groupName}" filterBy="#{configVO.groupName}" filterMatchMode="contains"/>
					<p:column rowspan="2" headerText="Department" style="width:100px" sortBy="#{configVO.department}" filterBy="#{configVO.department}" filterMatchMode="contains"/>
					<p:column rowspan="2" headerText="Details" style="width:100px" sortBy="#{configVO.fareRangeDetail}"/>
					<p:column rowspan="2" headerText="Remarks" sortBy="#{configVO.remarks}" filterBy="#{configVO.remarks}" filterMatchMode="contains"/>
					<p:column rowspan="2" headerText="Updated Date" style="width: 80px;" sortBy="#{configVO.updatedDate}"
						filterBy="#{salesCommConfigBean.dateFormat(configVO.updatedDate, 'dd-MMM-yyyy HH:mm:ss')}"/>
					<p:column rowspan="2" headerText="Updated By" style="width: 80px;" sortBy="#{configVO.updatedBy}" filterBy="#{configVO.updatedBy}" filterMatchMode="contains"/>
				</p:row>
			</p:columnGroup>
			<p:column styleClass="txt_center">
				<p:commandButton icon="ui-icon-pencil" actionListener="#{salesCommConfigBean.handleSalesCommConfigSelect(configVO)}" update=":idSalesCommConfigForm" oncomplete="varSalesCommConfigDialog.show()"/>
			</p:column>
			<p:column styleClass="txt_center">
				<p:commandButton icon="ui-icon-close" actionListener="#{salesCommConfigBean.handleSalesCommConfigSelect(configVO)}" oncomplete="varDelConfigDialog.show()"/>
			</p:column>
			<p:column styleClass="txt_center">
				<h:outputText value="#{configVO.groupName}"/>
			</p:column>
			<p:column styleClass="txt_center">
				<h:outputText value="#{configVO.department}"/>
			</p:column>
			<p:column styleClass="txt_left" style="width:150px" >
				<h:outputText value="#{configVO.fareRangeDetail}" escape="false"/>
			</p:column>
			<p:column styleClass="txt_left">
				<h:outputText value="#{configVO.remarks}" escape="false"/>
			</p:column>
			<p:column>
				<h:outputText value="#{configVO.updatedDate}">
					<f:convertDateTime pattern="dd-MMM-yyyy HH:mm:ss" />
				</h:outputText>
			</p:column>
			<p:column styleClass="txt_center">
				<h:outputText value="#{configVO.updatedBy}" />
			</p:column>
		</p:dataTable>
		
		<p:panelGrid columns="2" style="width:1px;">
			<p:commandButton value="#{msg['common.label.action.add']}" actionListener="#{salesCommConfigBean.handleAddSalesCommConfig}" 
				oncomplete="varSalesCommConfigDialog.show()" update=":idSalesCommConfigDialog"/>
		</p:panelGrid>
	</h:form>
</p:panel>

<p:dialog id="idSalesCommConfigDialog" widgetVar="varSalesCommConfigDialog" modal="true" resizable="false" dynamic="true" draggable="true" 
	hideEffect="fade" showEffect="fade" closable="false">
	<f:facet name="header">
		<h:outputFormat value="Sales Commission Config" />
	</f:facet>
	
	<h:form id="idSalesCommConfigForm">
		<ui:include src="add_sales_comm_config.xhtml" />
	</h:form>
</p:dialog>

<p:dialog id="idAddDetailDialog" widgetVar="varAddDetailDialog" modal="true" resizable="false" dynamic="true" draggable="true" 
	hideEffect="fade" showEffect="fade" closable="false">
	<f:facet name="header">
		<h:outputFormat value="Add Sales Commission Config Details" />
	</f:facet>
	
	<h:form id="idAddDetailForm">
		<ui:include src="add_sales_comm_config_detail.xhtml" />
	</h:form>
</p:dialog>

<p:confirmDialog header="Delete Sales Commission Configuration" widgetVar="varDelConfigDialog" message="Are you sure want to delete this record?" closable="false">
	<h:form>
		<p:growl id="msg"/>
		<p:commandButton value="#{msg['common.button.label.yes']}" actionListener="#{salesCommConfigBean.delSalesCommConfig}" update="@form,:idForm:idSalesCommConfigList" oncomplete="varDelConfigDialog.hide()"/>
		<p:commandButton value="#{msg['common.button.label.no']}" actionListener="#{salesCommConfigBean.resetForm}" oncomplete="varDelConfigDialog.hide()"/>
	</h:form>
</p:confirmDialog>

</ui:define>
</ui:composition>
