<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
				template="/WEB-INF/views/layouts/main.xhtml">

<ui:define name="content">
<p:panel header="Role-Funtion Mapping" toggleable="true" toggleSpeed="100">
	<h:form id="idDataForm">
		<p:growl id="idListMsg"/>
		
		<h:panelGrid columns="2" style="margin-bottom:5px; width:1px">
			<h:outputLabel for="idRole">Role</h:outputLabel>
			<h:selectOneMenu id="idRole" value="#{roleFunctionBean.roleVO.uuid}">
				<f:selectItem itemLabel="-- Select role --"/>
				<f:selectItems value="#{roleFunctionBean.roleList}" var="vo" itemValue="#{vo.uuid}" itemLabel="#{vo.roleName}"/>
				<p:ajax listener="#{roleFunctionBean.handleRoleChange}" update="idRolePickList"/>
			</h:selectOneMenu>
		</h:panelGrid>
		
		<p:pickList id="idRolePickList" value="#{roleFunctionBean.functionListModel}" var="vo" itemValue="#{vo}" itemLabel="#{vo.functionName}"
			converter="#{roleFunctionBean.functionConverter}" style="width:30%">
			<f:facet name="sourceCaption">Available Function(s)</f:facet>
			<f:facet name="targetCaption">Assigned Function(s)</f:facet>
		</p:pickList>
		
		<p:commandButton value="Save" update="idListMsg,idRolePickList" actionListener="#{roleFunctionBean.updateRoleFunction}"/>
	</h:form>
</p:panel>
</ui:define>
</ui:composition>
