<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<p:growl id="msg"/>

<p:dataTable widgetVar="varTableListingTableView" value="#{paymentBean.listingTableViewVO.listingTableViewColumnsVOList}" var="vo" paginator="true" rows="10"  rowIndexVar="rowIndex"
	paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
	rowsPerPageTemplate="10, 20, 30" style="width: 450px;">

	<p:column headerText="No" style="width: 60px;text-align:center;">
		<h:outputText value="#{rowIndex + 1}"/>
	</p:column>
	<p:column headerText="Columns Name">
		<h:outputText value="#{vo.columnsName}"/>
	</p:column>
	<p:column headerText="Visibility" style="width:70px;text-align:center;">
		<p:selectBooleanCheckbox value="#{vo.visible}"/>
	</p:column>
</p:dataTable>

<p:panelGrid>
	<p:row>
		<p:column>
			<p:commandButton value="Confirm" actionListener="#{paymentBean.updateListingTableView}" style="margin-right: 5px;" update=":idListingTableViewForm:msg"/>
			<p:commandButton value="Cancel" process="@this" oncomplete="varListingTableViewDialog.hide();" update=":idForm"/>
		</p:column>
	</p:row>
</p:panelGrid>

</ui:composition>
