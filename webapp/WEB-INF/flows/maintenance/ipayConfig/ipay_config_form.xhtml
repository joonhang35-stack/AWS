<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
				xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
				template="/WEB-INF/views/layouts/main.xhtml">

<ui:define name="content">
<p:panel header="Ipay88 Config" toggleable="true" toggleSpeed="500">
	<h:form id="idForm">
		<p:growl id="msg" />
		
		<h:panelGrid columns="2" style="width:1px;">
			<p:commandButton value="Add" oncomplete="varAddConfig.show()" actionListener="#{ipayConfigBean.navToDetail(null)}" update=":idAddConfig"/>
		</h:panelGrid>
		
		<p:dataTable id="idConfigList" widgetVar="varConfigList" value="#{ipayConfigBean.ipayConfigVOList}" var="vo" paginator="true" rows="20" 
			paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
			rowsPerPageTemplate="20, 30, 50" style="width: 1200px;">
			
			<p:column headerText="Edit" style="width:30px; text-align:center">
				<p:commandButton icon="ui-icon-pencil" update=":idAddConfig" actionListener="#{ipayConfigBean.navToDetail(vo)}" oncomplete="varAddConfig.show()"/>
			</p:column>
			<p:column headerText="Delete" style="width:30px; text-align:center">
				<p:commandButton icon="ui-icon-close" actionListener="#{ipayConfigBean.navToDetail(vo)}" oncomplete="varDelTmpMsg.show()"/>
			</p:column>
			<p:column headerText="Merchant Code" style="width:150px;">
				<h:outputText value="#{vo.merchantCode}"/>
			</p:column>
			<p:column headerText="Merchant Key" style="width:150px;">
				<h:outputText value="#{vo.merchantKey}"/>
			</p:column>
			<p:column headerText="Comment">
				<h:outputText value="#{vo.comment}" escape="false"/>
			</p:column>
			<p:column headerText="Remarks">
				<h:outputText value="#{vo.remarks}" escape="false"/>
			</p:column>
			<p:column headerText="Admin Charges Rate">
				<h:outputText value="#{vo.adminChargesPercentage}" escape="false"/>
			</p:column>
			<p:column headerText="Admin Charges Account">
				<h:outputText value="#{vo.acctCode} #{vo.acctDesc}" escape="false"/>
			</p:column>
		</p:dataTable>
		
		<p:panel header="Email Payment" style="margin-top: 15px;">
			<p:panelGrid>
				<p:row>
					<p:column style="width: 120px;;">
						<p:outputLabel value="Expiry Duration" for="idExpiryTime"/>
					</p:column>
					<p:column style="width: 10px;">
						<p:separator style="width:2px;height:20px"/>
					</p:column>
					<p:column style="width: 120px;">
						<p:inputText id="idExpiryTime" value="#{ipayConfigBean.appSettingVO.value}" 
							maxlength="3" required="true" size="5" style="margin-right: 5px;">
							<f:convertNumber pattern="0"/>
						</p:inputText>
						<p:outputLabel value="hours"/>
					</p:column>
					<p:column>
						<p:commandButton value="#{msg['common.button.label.save']}" actionListener="#{ipayConfigBean.saveDuration}" 
							update=":idForm"/>
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:panel>
	</h:form>
</p:panel>

<!--
	DIALOG - ADD Config
-->
<p:dialog id="idAddConfig" widgetVar="varAddConfig" modal="true" resizable="false" dynamic="true" draggable="true"
	hideEffect="fade" showEffect="fade" closable="false">
	<f:facet name="header">
		<h:outputFormat value="Ipay88 Config" />
	</f:facet>
	
	<h:form id="idAddForm">
		<ui:include src="add_config.xhtml" />
	</h:form>
</p:dialog>


<!-- 
	DIALOG - DELETE TMP MSG 
-->
<p:confirmDialog id="idDelTmpMsg" widgetVar="varDelTmpMsg" header="Delete" message="Are you sure want to delete this record?" closable="false">
	<h:form>
		<p:commandButton value="Yes" actionListener="#{ipayConfigBean.delete}" update=":idForm" oncomplete="varDelTmpMsg.hide()"/>
		<p:commandButton value="Cancel" oncomplete="varDelTmpMsg.hide()"/>
	</h:form>
</p:confirmDialog>

<!--
	DIALOG - ACCOUNT SUB CAT LIST
-->
<p:dialog id="idAcctListDialog" header="Account List" widgetVar="varAcctListDialog"
	modal="true" resizable="false" dynamic="true" draggable="true"
	closable="false">
	<h:form id="idAcctListForm">
		<p:dataTable widgetVar="varAcctListTable"
			value="#{ipayConfigBean.acctViewList}" var="vo" paginator="true"
			rows="20"
			paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}"
			rowsPerPageTemplate="10, 20, 30" rowKey="#{vo.id}"
			selectionMode="single" filterEvent="enter">
			<p:ajax event="rowSelect" listener="#{ipayConfigBean.handleAcctSelect}"
				update=":idAddForm" oncomplete="varAcctListDialog.hide()"/>

			<p:column headerText="Account" sortBy="#{vo.code}"
				filterBy="#{vo.code}" filterMatchMode="contains">
				<h:outputText value="#{vo.code}" rendered="#{empty vo.subCode}" />
				<h:outputText value="#{vo.code}-#{vo.subCode}"
					rendered="#{not empty vo.subCode}" />
			</p:column>
			<p:column headerText="Description" sortBy="#{vo.desc}"
				filterBy="#{vo.desc}" filterMatchMode="contains">
				<h:outputText value="#{vo.desc}" rendered="#{empty vo.subDesc}" />
				<h:outputText value="#{vo.desc}, #{vo.subDesc}"
					rendered="#{not empty vo.subDesc}" />
			</p:column>
		</p:dataTable>
		<h:panelGrid columns="1">
			<p:commandButton value="#{msg['common.button.label.cancel']}"
				onclick="varAcctListDialog.hide();varAcctListTable.clearFilters();" />
		</h:panelGrid>
	</h:form>
</p:dialog>
</ui:define>
</ui:composition>
