<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			template="/WEB-INF/views/layouts/main.xhtml">
	
<ui:define name="content">
<script type="text/javascript">
function onValidation(xhr, status, args) {
	if (args.validationFailed) {
		varEditAppSettingDialog.show();
	} else {
		varEditAppSettingDialog.hide();
	}
}
</script>
<p:panel header="App Setting">
   	<h:form id="idForm">
		<p:growl id="msg"/>
			
		<h:panelGrid columns="2" style="margin-bottom:10px;">  
			<p:dataTable id="idAppSettingTable" 
				value="#{appSettingBean.appSettingList}" 
				var="vo" filterEvent="enter">
				
				 <p:column headerText="Edit" style="width:30px; text-align:center">
					<p:commandButton icon="ui-icon-pencil" 
						update=":idEditAppSettingForm"
						actionListener="#{appSettingBean.setAppSettingVO(vo)}"
						oncomplete="varEditAppSettingDialog.show()"/>
				</p:column>
				<p:column filterBy="#{vo.code}" headerText="Code">
				  <h:outputText value="#{vo.code}"/>
				</p:column>
				<p:column filterBy="#{vo.description}" headerText="Description">
				  <h:outputText value="#{vo.description}"/>
				</p:column>
				<p:column filterBy="#{vo.value}" headerText="Value">
					  <h:outputText value="#{vo.value}"/>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
	</h:form>		
</p:panel>

<p:dialog id="idEditAppSettingDialog" header="Edit App Setting" widgetVar="varEditAppSettingDialog" modal="true" 
	resizable="false" dynamic="true" draggable="true" hideEffect="fade" showEffect="fade" closable="false">
	<h:form id="idEditAppSettingForm">
		<h:panelGrid columns="2" style="margin-bottom:10px; width:5px">
			<h:outputLabel for="idCode">Code</h:outputLabel>
			<p:inputText label="idCode" value="#{appSettingBean.appSettingVO.code}" readonly="true" size="50"/>
			
			<h:outputLabel for="idDescription">description</h:outputLabel>
			<p:inputText label="idDescription" value="#{appSettingBean.appSettingVO.description}" readonly="true" size="50"/>
			
			<h:outputLabel for="idValue">Value</h:outputLabel>
			<p:inputText label="idValue" value="#{appSettingBean.appSettingVO.value}" required="true" size="50"/>
		</h:panelGrid>
		<h:panelGrid id="idButtonGrid" columns="3" style="width: 1px;">
			<p:commandButton id="idBtnEditSubmit" actionListener="#{appSettingBean.save}" value="#{msg['common.button.label.save']}" update="@form,:idForm:idAppSettingTable" oncomplete="onValidation(xhr, status, args)"/>
			<p:commandButton id="idBtnEditCancel" value="#{msg['common.button.label.cancel']}" actionListener="#{appSettingBean.resetForm}" update="@form" process="@this" oncomplete="varEditAppSettingDialog.hide()" global="false">
				<pe:resetEditableValues for="idEditAppSettingForm"/>
			</p:commandButton>
	</h:panelGrid>
	</h:form>
</p:dialog>

</ui:define>
</ui:composition>
