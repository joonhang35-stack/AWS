<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
				xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
				template="/WEB-INF/views/layouts/main.xhtml">

<ui:define name="content">
	<p:panel header="POS Upload Sales" toggleable="true" toggleSpeed="500">
		<h:form id="idForm">
			<p:growl id="idMsg"/>
			<p:panel header="Upload">
				<p:panelGrid>
					<p:row>
						<p:column style="width: 150px;">
							<p:calendar id="idDtFromCustom" pattern="dd-MMM-yyyy" value="#{posUploadBean.uploadDate}" navigator="true" showButtonPanel="true" maxdate="#{posUploadBean.todayDate}"/>
						</p:column>
						<p:column style="width:10px;">
							<p:separator style="width:2px;height:20px"/>
						</p:column>
						<p:column style="width: 10px;">
							<p:commandButton value="Upload" actionListener="#{posUploadBean.upload}" update=":idForm"/>
						</p:column>
						<p:column>
							<p:commandButton value="Clear Test Data" actionListener="#{posUploadBean.clearTestData}" update=":idForm"/>
						</p:column>
					</p:row>
				</p:panelGrid>
			</p:panel>
			
			<p:panel header="Upload History" style="margin-top: 10px;">
				<p:dataTable id="idInvListTable" widgetVar="varInvoiceListTable" value="#{posUploadBean.lazyDMPOSUploadSalesVO}" var="vo" paginator="true" rows="20" rowIndexVar="rowIndex"
					paginatorTemplate="#{bterp:pageTemplate()}" 
					rowsPerPageTemplate="20, 30, 50" lazy="true" filterEvent="enter" style="width: 800px;">
					
					<p:column headerText="View" style="width: 40px; text-align:center;">
						<p:commandButton icon="ui-icon-pencil" actionListener="#{posUploadBean.onPOSUploadSalesSelected(vo.id)}" 
							update=":idFormSalesTrans" oncomplete="varDialogSalesTrans.show()"/>
					</p:column>
					
					 <p:column headerText="Upload Date" styleClass="txt_center">
						<h:outputText value="#{vo.uploadDate}">
							<f:convertDateTime pattern="dd-MMM-yyyy"/>  
						</h:outputText>
					</p:column>
					
					<p:column headerText="Uploaded By" styleClass="txt_center">
						<h:outputText value="#{vo.updatedBy}" />
					</p:column>
					
					<p:column headerText="Total Amount" styleClass="txt_center">
						<h:outputText value="#{vo.totalAmount}">
							<f:convertNumber pattern="#,##0.00"/>
						</h:outputText>
					</p:column>
					
					<p:column headerText="Upload Status" styleClass="txt_center">
						<h:outputText value="#{vo.uploadStatus}"/>
					</p:column>
					
					<p:column headerText="Is Test" style="width: 50px;pointer-events: none;" styleClass="txt_center">
					<p:selectBooleanCheckbox  value="#{vo.isTest}" />
				</p:column>
				</p:dataTable>
			</p:panel>
		</h:form>
	</p:panel>
	
	<p:dialog id="idDialogSalesTrans" widgetVar="varDialogSalesTrans" modal="true" resizable="false" dynamic="true" draggable="true"
		hideEffect="fade" showEffect="fade" closable="false" >
		<f:facet name="header">
			<h:outputFormat value="Sales Transaction" />
		</f:facet>
		
		<h:form id="idFormSalesTrans">
			<p:dataTable id="idSalesTransTable" widgetVar="varSalesTransTable" value="#{posUploadBean.lazyDMPOSUploadSalesTransVO}" var="vo" paginator="true" rows="20" rowIndexVar="rowIndex"
				paginatorTemplate="#{bterp:pageTemplate()}" 
				rowsPerPageTemplate="20, 30, 50" lazy="true" filterEvent="enter" style="width: 1200px">
				
				<p:column headerText="Invoice No" style="width: 120px;" styleClass="txt_center">
					<h:outputText value="#{vo.invoiceNo}" />
				</p:column>
				<p:column headerText="Invoice Date" style="width: 100px;" styleClass="txt_center">
					<h:outputText value="#{vo.invoiceDate}" />
				</p:column>
				<p:column headerText="Sub Total" style="width: 120px;" styleClass="txt_center">
					<h:outputText value="#{vo.subTotal}">
						<f:convertNumber pattern="#,##0.00"/>
					</h:outputText>
				</p:column>
		        <p:column headerText="Discount(%)" style="width: 120px;" styleClass="txt_center">
		        	<h:outputText value="#{vo.discountPercentage}">
						<f:convertNumber pattern="#,##0.00"/>
					</h:outputText>
				</p:column>
				<p:column headerText="Discount Amt" style="width: 120px;" styleClass="txt_center">
		        	<h:outputText value="#{vo.discountAmount}">
						<f:convertNumber pattern="#,##0.00"/>
					</h:outputText>
				</p:column>
				<p:column headerText="Tax Rate" style="width: 120px;" styleClass="txt_center">
		        	<h:outputText value="#{vo.taxRate}">
						<f:convertNumber pattern="#,##0.00"/>
					</h:outputText>
				</p:column>
				<p:column headerText="Tax Amt" style="width: 120px;" styleClass="txt_center">
		        	<h:outputText value="#{vo.taxAmount}">
						<f:convertNumber pattern="#,##0.00"/>
					</h:outputText>
				</p:column>
				<p:column headerText="Service&lt;br/&gt;Charge(%)" style="width: 120px;" styleClass="txt_center">
		        	<h:outputText value="#{vo.serviceChargePercentage}">
						<f:convertNumber pattern="#,##0.00"/>
					</h:outputText>
				</p:column>
				<p:column headerText="Service&lt;br/&gt;Charge Amt" style="width: 120px;" styleClass="txt_center">
		        	<h:outputText value="#{vo.serviceChargeAmount}">
						<f:convertNumber pattern="#,##0.00"/>
					</h:outputText>
				</p:column>
				<p:column headerText="Grand Total" style="width: 120px;" styleClass="txt_center">
		        	<h:outputText value="#{vo.grandTotal}">
						<f:convertNumber pattern="#,##0.00"/>
					</h:outputText>
				</p:column>
				<p:column headerText="Is Test" style="width: 50px;pointer-events: none;" styleClass="txt_center">
					<p:selectBooleanCheckbox  value="#{vo.isTest}" />
				</p:column>
				<p:column headerText="Is Void" style="width: 50px;pointer-events: none;" styleClass="txt_center">
					<p:selectBooleanCheckbox  value="#{vo.isVoid}" />
				</p:column>
			</p:dataTable>
			<p:panelGrid>
				<p:row>
					<p:column>
						<p:commandButton value="Cancel" oncomplete="varDialogSalesTrans.hide()"/>
					</p:column>
				</p:row>
			</p:panelGrid>
		</h:form>
	</p:dialog>
</ui:define>
</ui:composition>
