<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
				xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
				template="/WEB-INF/views/layouts/main.xhtml">

<ui:define name="content">
<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var filters = document.querySelectorAll('input.ui-column-filter');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    });
</script>
<p:panel header="Template Messages" toggleable="true" toggleSpeed="500">
	<h:form id="idForm">
		<h:panelGrid columns="2" style="width:1px;">
			<h:selectOneMenu id="idTypeCd" value="#{bterpBean.searchParamVO.obj1}" effect="fade">
				<!-- <f:selectItems value="#{zsg:referenceDataList('TMP_MSG_TOUR')}" var="n" itemLabel="#{n.value}" itemValue="#{n.code}"/> -->
				<f:selectItems value="#{bterp:lookupItemList('inv_cat')}" var="vo" itemValue="#{vo.code}" itemLabel="#{vo.description}"/>
				<p:ajax event="change" listener="#{bterpBean.onCategorySelected}" update="idTmpMsgList"/>
			</h:selectOneMenu>
		</h:panelGrid>
		<h:panelGrid columns="2" style="width:1px;">
			<p:commandButton value="Add" oncomplete="varAddTmpMsg.show()" actionListener="#{bterpBean.resetForm}" update=":idAddTmpMsg"/>
		</h:panelGrid>
		
		<p:dataTable id="idTmpMsgList" widgetVar="varTmpMsgList" value="#{bterpBean.tmpMsgList}" var="vo" paginator="true" rows="20" 
			paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
			rowsPerPageTemplate="20, 30, 50" filterEvent="enter" filteredValue="#{bterpBean.filteredObjList}">
			
			<p:column headerText="Edit" style="width:30px; text-align:center">
				<p:commandButton icon="ui-icon-pencil" update=":idAddTmpMsg" actionListener="#{bterpBean.onTmpMsgSelected(vo)}" oncomplete="varAddTmpMsg.show()"/>
			</p:column>
			<p:column headerText="Delete" style="width:30px; text-align:center">
				<p:commandButton icon="ui-icon-close" actionListener="#{bterpBean.onTmpMsgSelected(vo)}" oncomplete="varDelTmpMsg.show()"/>
			</p:column>
			<p:column headerText="Sequence Number" filterBy="#{vo.seqNo}" sortBy="#{vo.seqNo}">
				<h:outputText value="#{vo.seqNo}"/>
			</p:column>
			<p:column headerText="Code" filterBy="#{vo.code}" sortBy="#{vo.code}">
				<h:outputText value="#{vo.code}"/>
			</p:column>
			<p:column headerText="Description" filterBy="#{vo.desc}" sortBy="#{vo.desc}">
				<h:outputText value="#{vo.desc}"/>
			</p:column>
			<p:column headerText="Remarks" filterBy="#{vo.remarks}" sortBy="#{vo.remarks}" filterMatchMode="contains">
				<h:outputText value="#{fn:replace(vo.remarks, '\\n', '&lt;br/&gt;')}" escape="false"/>
			</p:column>
		</p:dataTable>
		
		<h:panelGrid columns="2" style="width:1px;">
			<p:commandButton value="Add" oncomplete="varAddTmpMsg.show()" actionListener="#{bterpBean.resetForm}" update=":idAddTmpMsg"/>
		</h:panelGrid>
	</h:form>
</p:panel>

<!--
	DIALOG - ADD TMP MSG
-->
<p:dialog id="idAddTmpMsg" widgetVar="varAddTmpMsg" modal="true" resizable="false" dynamic="true" draggable="true" 
	hideEffect="fade" showEffect="fade" closable="false">
	<f:facet name="header">
		<h:outputFormat value="Template Message" />
	</f:facet>
	
	<h:form id="idAddForm">
		<ui:include src="add_tmp_msg.xhtml" />
	</h:form>
</p:dialog>


<!-- 
	DIALOG - DELETE TMP MSG 
-->
<p:confirmDialog id="idDelTmpMsg" widgetVar="varDelTmpMsg" header="Delete" message="Are you sure want to delete this record?" closable="false">
	<h:form>
		<p:commandButton value="Yes" actionListener="#{bterpBean.delTmpMsg}" update=":idForm:idTmpMsgList" oncomplete="varDelTmpMsg.hide()"/>
		<p:commandButton value="Cancel" oncomplete="varDelTmpMsg.hide()"/>
	</h:form>
</p:confirmDialog>
</ui:define>
</ui:composition>
