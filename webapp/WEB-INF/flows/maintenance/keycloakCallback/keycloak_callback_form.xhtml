<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:zsg="http://www.bcs.com/zsg/jsf"
	template="/WEB-INF/views/layouts/main.xhtml"
	xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

	<script type="text/javascript"></script>

	<ui:define name="content">
		<p:panel header="Keycloak Config" toggleable="true" toggleSpeed="500">
			<h:form id="idForm">
				<p:growl id="msg" />
				<p:panel header="Keycloak Access Token Claim" toggleable="true"
					style="margin-top:10px">

					<p:panelGrid>

						<p:row>
							<p:column style="width:200px">
								<h:outputText value="Preferred Username" />
							</p:column>
							<p:column style="width:10px">
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.preferredUsername}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Name" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.name}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Email" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.email}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Email Verified" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.emailVerified ? 'Yes' : 'No'}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Audience" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.aud}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Client (azp)" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.azp}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Scope" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.scope}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Token Type" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.typ}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Issuer" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.iss}" />
							</p:column>
						</p:row>

						<p:row>
							<p:column>
								<h:outputText value="Expiration" />
							</p:column>
							<p:column>
								<p:separator style="width:2px;height:20px" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{configBean.keycloakAccessTokenClaimVO.exp}">
									<f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" />
								</h:outputText>
							</p:column>
						</p:row>

					</p:panelGrid>

				</p:panel>
			</h:form>
		</p:panel>



	</ui:define>
</ui:composition>
