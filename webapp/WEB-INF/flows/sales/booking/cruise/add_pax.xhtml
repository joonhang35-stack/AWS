<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<script type="text/javascript">
	function onAddPaxValidation(xhr, status, args) {
		if (!args.validationFailed) {
			varAddPaxDialog.hide();
		}
	}
</script>

<p:growl id="msg"/>
<p:panelGrid>
	<p:row>
		<p:column><h:outputLabel for="idPaxTye">Pax Type <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
			<h:selectOneMenu id="idPaxTye" value="#{cruiseBookingBean.bookingItemVO.typeCd}" effect="fade">
				<f:selectItems value="#{zsg:referenceDataList('BOOK_PAX_TYPE')}" var="vo" itemLabel="#{vo.value}" itemValue="#{vo.code}"/>
			</h:selectOneMenu>
		</p:column>
		<p:column><h:outputLabel for="idQuantity">Quantity <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idQuantity" label="Quantity" value="#{cruiseBookingBean.bookingItemVO.quantity}"/></p:column>
	</p:row>
</p:panelGrid>
<h:panelGrid columns="2" style="width:1px;">
	<p:commandButton value="#{msg['common.button.label.save']}" actionListener="#{cruiseBookingBean.addPax}" update="@form,:idAddInvoiceForm:idShowBookingPax" rendered="#{not cruiseBookingBean.itemBoolean.upd}"/>
	<p:commandButton value="#{msg['common.button.label.update']}" actionListener="#{cruiseBookingBean.updPax}" update="@form,:idAddInvoiceForm:idShowBookingPax" oncomplete="onAddPaxValidation(xhr, status, args)" rendered="#{cruiseBookingBean.itemBoolean.upd}"/>
	<p:commandButton value="#{msg['common.button.label.cancel']}" actionListener="#{cruiseBookingBean.resetBookItemForm}" update="@form" process="@this" oncomplete="varAddPaxDialog.hide(),varEditPaxDialog.hide()">
		<pe:resetEditableValues for="idAddPaxForm,idEditPaxForm"/>
	</p:commandButton>
</h:panelGrid>
</ui:composition>
