<ui:define name="content">
<style>
	.center-column {
	    text-align: center;
	}
</style>
<script type="text/javascript">
	function onCruiseCabinValidation(xhr, status, args) {
		if (!args.validationFailed) {
			varAddCruiseCabinDialog.hide();
		}
	}

	function onTransferValidation(xhr, status, args) {
		if (!args.validationFailed) {
			varAvailableTourDepListDialog.hide();
			varTransferConfirmationDialog.hide();
			varAddBookingDialog.hide();
		}
	}
	
	function handleComplete(tourDepId) {
		var ftTwnPax = $("#idAddInvoiceForm\\:idFtTwn").val();
		var ftSglPax = $("#idAddInvoiceForm\\:idFtSgl").val();
		var ftCtwPax = $("#idAddInvoiceForm\\:idFtCtw").val();
		var ftCwbPax = $("#idAddInvoiceForm\\:idFtCwb").val();
		var ftCnbPax = $("#idAddInvoiceForm\\:idFtCnb").val();
		var ftInftPax = $("#idAddInvoiceForm\\:idFtInft").val();
		var gaTwnPax = $("#idAddInvoiceForm\\:idGaTwn").val();
		var gaSglPax = $("#idAddInvoiceForm\\:idGaSgl").val();
		var gaCtwPax = $("#idAddInvoiceForm\\:idGaCtw").val();
		var gaCwbPax = $("#idAddInvoiceForm\\:idGaCwb").val();
		var gaCnbPax = $("#idAddInvoiceForm\\:idGaCnb").val();
		var gaInftPax = $("#idAddInvoiceForm\\:idGaInft").val();
		
		var params = "&amp;ftTwnPax=" + ftTwnPax;
		params += "&amp;ftSglPax=" + ftSglPax;
		params += "&amp;ftCtwPax=" + ftCtwPax;
		params += "&amp;ftCwbPax=" + ftCwbPax;
		params += "&amp;ftCnbPax=" + ftCnbPax;
		params += "&amp;ftInftPax=" + ftInftPax;
		params += "&amp;gaTwnPax=" + gaTwnPax;
		params += "&amp;gaSglPax=" + gaSglPax;
		params += "&amp;gaCtwPax=" + gaCtwPax;
		params += "&amp;gaCwbPax=" + gaCwbPax;
		params += "&amp;gaCnbPax=" + gaCnbPax;
		params += "&amp;gaInftPax=" + gaInftPax;
		/* alert('#{request.contextPath}/app/emailtmp/bookingemailtmp?tourDepId=' + tourDepId + params); */
		window.open('#{request.contextPath}/app/emailtmp/cruisebookingemailtmp?tourDepId=' + tourDepId + params);
	}
	
	document.addEventListener('DOMContentLoaded', function() {
		var filters = document.querySelectorAll('input.ui-inputtext');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    });
	
	function setEnterKeyHint() {
        var filters = document.querySelectorAll('input.ui-inputtext');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    }
</script>
<p:panel header="All Cruise Packages" toggleable="true" toggleSpeed="500">
	<h:form id="idTourPkgForm">
		<p:tabView id="idTab" activeIndex="#{cruiseBookingBean.activeIndex}">
			<p:tab id="idTabList" title="Package List">
				<p:panelGrid>
					<p:row>
						<p:column style="width:50px;">
							<h:outputLabel for="idTourCat">Category</h:outputLabel>
						</p:column>
						<p:column id="idTourCatList">
							<h:selectOneMenu id="idTourCat"
								value="#{cruiseBookingBean.searchParamVO.obj2}" effect="fade">
								<f:selectItem itemLabel="Select One" />
								<f:selectItems value="#{cruiseBookingBean.tourCatViewList}" var="vo"
									itemLabel="#{vo.desc}" itemValue="#{vo.id}" />
								<p:ajax event="change"
									listener="#{cruiseBookingBean.handleTourCatSelect}"
									update="@form,idTourPkgList" />
							</h:selectOneMenu>
						</p:column>
					</p:row>
				</p:panelGrid>

				<p:panel rendered="#{empty cruiseBookingBean.searchParamVO.obj2}">
					<h:outputText value="Please select category." />
				</p:panel>

				<p:panel
					rendered="#{not empty cruiseBookingBean.searchParamVO.obj2 and empty cruiseBookingBean.tourThemeList}">
					<h:outputText value="No records found." />
				</p:panel>

				<p:accordionPanel id="idTourPkgList"
					value="#{cruiseBookingBean.tourThemeList}" var="vo" activeIndex="null">
					<p:tab
						title="#{vo.desc} #{empty vo.countriesName ? '' : ' - '} #{vo.countriesName}"
						titleStyle="font-size: 13px;">
						<div style="font-size: 1.1em !important;">
							<h:inputHidden value="#{cruiseBookingBean.beginNumber}" />
							
							<ui:repeat value="#{vo.tourThemeMapList}" var="themeYearVO" varStatus="varStatus">
								<h:panelGrid columns="1"
									rendered="#{varStatus.index gt 0}"
									style="background:#cccccc;font-size:1.3em;color:red;font-weight:bold;">
									<h:outputText value="#{themeYearVO.key}" />
									<h:inputHidden value="#{cruiseBookingBean.beginNumber}" />
								</h:panelGrid>
								
								<ui:repeat value="#{themeYearVO.value}" var="child">
									<p:panelGrid rendered="#{not empty child.tourPkgList}">
										<p:row>
											<p:column
												style="background:#dcdcdc; font-weight:bold;font-size: 1.07em !important">
												<h:outputText
													value="#{child.desc} #{empty child.countriesName ? '' : ' - '} #{child.countriesName}" />
											</p:column>
										</p:row>
									</p:panelGrid>
									
									<p:dataTable value="#{child.tourPkgList}" var="tourPkgVO"
										rowIndexVar="rowIndex"
										rendered="#{not empty child.tourPkgList}">
										<p:column headerText="No."
											style="width:50px; text-align:center;">
											<h:outputText value="#{cruiseBookingBean.runningNumber}" />
										</p:column>
										<p:column headerText="Description 1">
											<p:commandLink
												actionListener="#{cruiseBookingBean.handleTourPkgSelect(tourPkgVO)}"
												update=":idTourDepListDialog"
												oncomplete="varTourDepListDialog.show()"
												style="color:#000000; margin-right:5px;">
												<h:outputText
													value="#{tourPkgVO.numDays}D/#{tourPkgVO.numNights}N #{tourPkgVO.nameEn} #{tourPkgVO.nameOther}" />
												<h:outputText value="-Theme Tour" style="color:#FF0000;"
													rendered="#{tourPkgVO.isThemeTour}" />
											</p:commandLink>
											<ui:repeat value="#{tourPkgVO.tourBadgeDescList}"
												var="tourBadgeVO">
												<h:outputText value="#{tourBadgeVO}"
													style="display:inline-block; background:white; color:black; border:1px solid grey; border-radius: 5px; padding:2px; margin:2px;"
													rendered="#{not empty tourPkgVO.tourBadgeTagList}" />
											</ui:repeat>
											<ui:repeat value="#{tourPkgVO.travelStyleDescList}"
												var="travelBadgeVO">
												<h:outputText value="#{travelBadgeVO}"
													style="display:inline-block; background:white; color:red; border:1px solid red; border-radius: 5px; padding:2px; margin:2px;"
													rendered="#{not empty tourPkgVO.travelStyleList}" />
											</ui:repeat>
										</p:column>
									</p:dataTable>
								</ui:repeat>					
							</ui:repeat>
							
							<ui:repeat value="#{vo.tourPkgMapList}" var="pkgYearVO" varStatus="varTourPkgStatus">
								<h:panelGrid columns="1"
									rendered="#{varTourPkgStatus.index gt 0}"
									style="background:#cccccc;font-size:1.3em;color:red;font-weight:bold;">
									<h:outputText value="#{pkgYearVO.key}" />
								</h:panelGrid>
								<p:dataTable value="#{pkgYearVO.value}" var="tourPkgVO"
									style="margin-top:10px;"
									rendered="#{not empty vo.tourPkgList}" rowIndexVar="rowIndex">
									<p:column headerText="No."
										style="width:50px; text-align:center;">
										<h:outputText value="#{cruiseBookingBean.runningNumber}" />
									</p:column>
									<!--p:column headerText="Days" style="width:80px; text-align:center;"><h:outputText value="#{tourPkgVO.numDays}"/></p:column-->
									<p:column headerText="Description 2">
										<p:commandLink
											actionListener="#{cruiseBookingBean.handleTourPkgSelect(tourPkgVO)}"
											update=":idTourDepListDialog"
											oncomplete="varTourDepListDialog.show()"
											style="color:#000000;">
											<h:outputText
												value="#{tourPkgVO.numDays}D/#{tourPkgVO.numNights}N " />
											<h:outputText
												value="#{tourPkgVO.nameEn} #{tourPkgVO.nameOther} #{tourPkgVO.nameZh}" />
											<h:outputText value="-Theme Tour" style="color:#FF0000;"
												rendered="#{tourPkgVO.isThemeTour}" />
										</p:commandLink>
									</p:column>
								</p:dataTable>
							</ui:repeat>
						</div>
					</p:tab>
				</p:accordionPanel>
			</p:tab>
			<p:tab id="idTabSearchList" title="Find Tour List">

						<p:column style="width: 10px;">
							<p:outputLabel value="To" for="idValidTo"/>
						</p:column>

							<p:outputLabel value="Price From" for="idPriceFrom"/>
						</p:column>
						<p:column style="width: 10px;">
							<p:outputLabel value="To" for="idPriceTo"/>
						</p:column> -->
						<p:column style="width: 130px">

						</p:column>
					</p:row>
					<p:row>
						<p:column>

						<p:column>
							<p:inputText id="idPkgTitle" value="#{cruiseBookingBean.searchTourDepFilter.packageDesc}" size="30" />

								<p:ajax event="dateSelect" update=":idTourPkgForm:idTab:idValidFrom, :idTourPkgForm:idTab:idValidTo" global="false"/>
							</p:calendar>
							<p:watermark for="idValidFrom" value="dd-mmm-yyyy" />
						</p:column>
						<p:column>
							<p:calendar id="idValidTo" navigator="true" showButtonPanel="true" size="15" pattern="dd-MMM-yyyy"
								value="#{cruiseBookingBean.searchTourDepFilter.toDate}" mindate="#{cruiseBookingBean.searchTourDepFilter.fromDate}">

							</p:calendar>

							<p:inputText id="idPriceFrom" value="#{cruiseBookingBean.searchTourDepFilter.priceFrom}" size="10" maxlength="10"> -->
								<!-- <f:convertNumber pattern="#,##0.00" /> -->
								<!-- <pe:keyFilter regEx="/[\d\.\s,]/" />
							</p:inputText>
						</p:column>
						<p:column>
							<p:inputText id="idPriceTo" value="#{cruiseBookingBean.searchTourDepFilter.priceTo}" size="10" maxlength="10">
								<pe:keyFilter regEx="/[\d\.\s,]/" />
							</p:inputText>
						</p:column> -->
						<p:column>
							<p:inputText id="idBalCabin" value="#{cruiseBookingBean.searchTourDepFilter.balanceCabin}" size="6" maxlength="3">
								<pe:keyFilter regEx="/[\d]/"/>
							</p:inputText>
						</p:column>
						<p:column>
							<p:spacer width="250" height="10"/>
						</p:column>
					</p:row>
					<p:row>
						<p:column colspan="8">
							<p:panelGrid style="width: 10px;">
								<p:row>
									<p:column>
										<p:selectCheckboxMenu value="#{cruiseBookingBean.searchTourDepFilter.tourStatusList}" label="Tour Status" style="width:100px; display:block;">
											<f:selectItems value="#{bterp:lookupItemList('tour_status')}" var="statusVO" itemLabel="#{statusVO.description}" itemValue="#{statusVO.code}" />
										</p:selectCheckboxMenu>
									</p:column>
									<p:column>
										<p:selectCheckboxMenu value="#{cruiseBookingBean.searchTourDepFilter.departDateBadgeList}" label="Depart date badge" style="width:150px; display:block;" >
										<f:selectItems value="#{bterp:lookupItemList('depart_date_badge')}" var="badgeVO" itemValue="#{badgeVO.code}" itemLabel="#{badgeVO.description}"/>
									</p:selectCheckboxMenu>
									</p:column>
									<p:column>
										<p:selectCheckboxMenu value="#{cruiseBookingBean.searchTourDepFilter.selectedSeason}" label="Season" style="width:100px; display:block;" >
											<f:selectItems value="#{cruiseBookingBean.refDataListSeason}" var="seasonVO" itemLabel="#{seasonVO.value}" itemValue="#{seasonVO.code}" />
										</p:selectCheckboxMenu>
									</p:column>
									<p:column>
										<p:selectCheckboxMenu value="#{cruiseBookingBean.searchTourDepFilter.tourLangList}" label="Tour Languages" style="width:150px; display:block;">
											<f:selectItems value="#{bterp:lookupItemList('product_lang')}" var="langVO" itemLabel="#{langVO.description}" itemValue="#{langVO.code}" />
										</p:selectCheckboxMenu>
									</p:column>
									<p:column>
										<p:selectCheckboxMenu id="idSectorType" label="Sector Type" filter="true" filterMatchMode="contains" style="width:100px; display:block;"
											value="#{cruiseBookingBean.searchTourDepFilter.sectorTypeList}" onHide="executeOnContinentOnhide();">
											<f:selectItems value="#{cruiseBookingBean.filterFullRegionList}" var="rgnVO" itemValue="#{rgnVO.id}" itemLabel="#{rgnVO.regionname}" />
										</p:selectCheckboxMenu>
										<p:remoteCommand name="executeOnContinentOnhide" actionListener="#{cruiseBookingBean.handleSectorTypeChange}" global="false"
							       			update=":idTourPkgForm:idTab:idSector" process="@this :idTourPkgForm:idTab:idSectorType" />
									</p:column>
									<p:column>
										<p:selectCheckboxMenu id="idSector" label="Sector" filter="true" filterMatchMode="contains" style="width:100px; display:block;"
											disabled="#{empty cruiseBookingBean.searchTourDepFilter.sectorTypeList}"
											value="#{cruiseBookingBean.searchTourDepFilter.sectorList}">
											<f:selectItems value="#{cruiseBookingBean.filterFullCountryList}" var="ctryVO" itemValue="#{ctryVO.id}" itemLabel="#{ctryVO.country}" />
										</p:selectCheckboxMenu>
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{cruiseBookingBean.searchTourDepFilter.inactiveRecord}"
											itemLabel="Inactive Records" style="width:120px; display:block;"/>
									</p:column>
									<p:column>
										<p:commandButton value="Search"
											actionListener="#{cruiseBookingBean.handleFilterBookingTourDepList}"
											oncomplete="setEnterKeyHint();"
											update=":idTourPkgForm:idTab:idTourFilterBookingDepList" />
									</p:column>
									<p:column>
										<p:commandButton value="Clear All" style="width:70px;"
											actionListener="#{cruiseBookingBean.handleFilterClearAll}"
											update=":idTourPkgForm:idTab:idSearchFilter" process="@this"/>
									</p:column>
									<p:column>
										<p:spacer width="10" height="10"/>
									</p:column>
								</p:row>
							</p:panelGrid>
						</p:column>
					</p:row>
				</p:panelGrid>

							<p:column styleClass="center-column">
								<h:outputText value="#{cabinVO.totalConfirmedCabin}" style="text-align:center;"/>

							<p:column styleClass="center-column">

								<h:outputText value="#{cabinVO.priceTwn}">
									<f:convertNumber pattern="#,##0"/>
								</h:outputText>
							</p:column>
							<p:column styleClass="center-column">
								<h:outputText value="#{cabinVO.price3}">
									<f:convertNumber pattern="#,##0"/>
								</h:outputText>
							</p:column>
							<p:column styleClass="center-column">
								<h:outputText value="#{cabinVO.price4}">
									<f:convertNumber pattern="#,##0"/>
								</h:outputText>
							</p:column>
							<p:column styleClass="center-column">
								<h:outputText value="#{cabinVO.priceSgl}">
									<f:convertNumber pattern="#,##0"/>
								</h:outputText>
							</p:column>

								<h:outputText value="#{cabinVO.price3Chd}">
									<f:convertNumber pattern="#,##0"/>

								<h:outputText value="#{cabinVO.priceInf}">
									<f:convertNumber pattern="#,##0"/>
								</h:outputText>
							</p:column>
							<p:columnGroup type="footer">
								<p:row>
									<p:column colspan="3" style="font-weight: bold;">Total</p:column>
									<p:column style="font-weight: bold;">#{filterVO.totalCabinAllotment}</p:column>
									<p:column style="font-weight: bold;">#{filterVO.totalConfirmedCabin}</p:column>
									<p:column style="font-weight: bold;">#{filterVO.totalKivCabin}</p:column>
									<p:column style="font-weight: bold;">#{filterVO.totalBalanceCabin}</p:column>
									<p:column colspan="7" style="font-weight: bold;"/>
								</p:row>
							</p:columnGroup>
						</p:dataTable>
					</p:rowExpansion>
				</p:dataTable>
			</p:tab>
		</p:tabView>
	</h:form>
</p:panel>
