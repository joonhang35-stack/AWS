<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
					template="/WEB-INF/views/layouts/main.xhtml"
					xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<ui:define name="content">
<p:panel header="Sales Summary By Months" toggleable="true" toggleSpeed="500">
<h:form id="salesSmmryForm">

<p:dataTable id="idSalesSmmryTable" value="#{salesSmmryBean.salesSmmryList}" widgetVar="varSalesSmmryTable" var="vo"  paginator="true" rows="20" 
	paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
	rowsPerPageTemplate="20, 30, 50" filteredValue="#{salesSmmryBean.filteredObjList}" filterEvent="enter">
	
	<p:column filterBy="#{vo.years}" sortBy="#{vo.years}" filterMatchMode="contains">
        <f:facet name="header">
            <h:outputText value="Years" />  
        </f:facet> 
		<h:outputText value="#{vo.years}"/>
	</p:column>
	
	<p:column filterBy="#{vo.months}" sortBy="#{vo.months}" filterMatchMode="contains">
        <f:facet name="header">
            <h:outputText value="Months" />  
        </f:facet> 
		<h:outputText value="#{vo.months}"/>
	</p:column>
	
	<p:column>
		<f:facet name="header"><h:outputText value="Total Invoiced"/></f:facet>
		<h:outputText value="#{vo.invCount}" />
	</p:column>
	
	<p:column sortBy="#{vo.invAmt}" styleClass="txt_right">
		<f:facet name="header"><h:outputText value="Invoice Amount" /></f:facet>
		<h:outputText value="#{vo.invAmt}">
			<f:convertNumber pattern="#,##0.00" />
		</h:outputText>
	</p:column>
	
	<p:column sortBy="#{vo.invPaid}" styleClass="txt_right">
		<f:facet name="header"><h:outputText value="Amount Paid" /></f:facet>
		<h:outputText value="#{vo.invPaid}">
			<f:convertNumber pattern="#,##0.00" />
		</h:outputText>
	</p:column>
	
	<p:column sortBy="#{vo.balance}" styleClass="txt_right">
		<f:facet name="header"><h:outputText value="Amount Due" /></f:facet>
		<h:outputText value="#{vo.balance}">
			<f:convertNumber pattern="#,##0.00" />
		</h:outputText>
	</p:column>

</p:dataTable>
</h:form>
</p:panel>

</ui:define>
</ui:composition>
