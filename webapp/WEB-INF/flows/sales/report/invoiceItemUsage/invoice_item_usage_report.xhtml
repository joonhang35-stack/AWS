<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:p="http://primefaces.org/ui"
				xmlns:pe="http://primefaces.org/ui/extensions"
				template="/WEB-INF/views/layouts/main.xhtml"
				xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<ui:define name="content">

<p:panel header="Invoice Item Usage Report" toggleable="true" toggleSpeed="500">
	<h:form id="idFormInvoiceItemReportUsage">
		<p:growl id="msg"/>
		<p:panelGrid style="width:850px; margin-top:5px;">
			<p:row>
				<p:column style="width:120px;"><h:outputLabel for="idDateFrom">Used Date From</h:outputLabel></p:column>
				<p:column style="width:110px;">
					<p:calendar id="idDateFrom" value="#{invoiceItemReportUsageBean.searchParamVO.fromDate}" navigator="true" showButtonPanel="true" size="12" pattern="dd-MMM-yyyy">
					</p:calendar>
				</p:column>
				<p:column style="width:10px;"><p:separator style="width:2px;height:20px"/></p:column>
				<p:column style="width:120px;"><h:outputLabel for="idDateTo">Used Date To</h:outputLabel></p:column>
				<p:column style="width:110px;">
					<p:calendar id="idDateTo" value="#{invoiceItemReportUsageBean.searchParamVO.toDate}" navigator="true" showButtonPanel="true" size="12" pattern="dd-MMM-yyyy">
					</p:calendar>
				</p:column>
				<p:column style="width:10px;"><p:separator style="width:2px;height:20px"/></p:column>
				<p:column style="width:120px;">
					<h:outputText value="Invoice Item" />
				</p:column>
				<p:column style="width:140px;">
					<p:selectCheckboxMenu id="idInvoiceItem" value="#{invoiceItemReportUsageBean.selectedItemCodes}" label="Invoice Item" style="width:140px; display:block;" filter="true" filterMatchMode="contains">
						<f:selectItems value="#{invoiceItemReportUsageBean.invoiceItemList}" var="itemVO" itemLabel="#{itemVO.code} - #{itemVO.description}" itemValue="#{itemVO.code}" />
					</p:selectCheckboxMenu>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<h:outputLabel for="idStatus">Pax Statement / Invoice Status</h:outputLabel>
				</p:column>
				<p:column>
					<p:selectCheckboxMenu id="idStatus" value="#{invoiceItemReportUsageBean.selectedStatusCds}" label="Status" style="width:140px; display:block;" filter="true" filterMatchMode="startsWith">
						<f:selectItems value="#{invoiceItemReportUsageBean.statusList}" var="vo" itemValue="#{vo.value}" itemLabel="#{vo.label}"/>
					</p:selectCheckboxMenu>
				</p:column>
				<p:column><p:separator style="width:2px;height:20px"/></p:column>
				<p:column>
					<h:outputLabel for="idCategory">Pax Statement / Invoice Category</h:outputLabel>
				</p:column>
				<p:column>
					<p:selectCheckboxMenu id="idCategory" value="#{invoiceItemReportUsageBean.selectedInvCatCds}" label="Category" style="width:140px; display:block;" filter="true" filterMatchMode="startsWith">
						<f:selectItems value="#{bterp:lookupItemList('inv_cat')}" var="vo" itemValue="#{vo.code}" itemLabel="#{vo.description}"/>
					</p:selectCheckboxMenu>
				</p:column>
				<p:column><p:separator style="width:2px;height:20px"/></p:column>
				<p:column>
					<h:outputLabel for="idOrderSource">Order Source</h:outputLabel>
				</p:column>
				<p:column>
					<p:selectCheckboxMenu id="idOrderSource" value="#{invoiceItemReportUsageBean.selectedOrderSourceCds}" label="Order Source" style="width:140px; display:block;" filter="true" filterMatchMode="startsWith">
						<f:selectItems value="#{bterp:lookupItemList('ordr_sorc')}" var="vo" itemValue="#{vo.code}" itemLabel="#{vo.description}"/>
					</p:selectCheckboxMenu>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<h:outputLabel for="idRegion">Region</h:outputLabel>
				</p:column>
				<p:column>
					<p:selectCheckboxMenu id="idRegion" value="#{invoiceItemReportUsageBean.selectedRegionIds}" label="Region" style="width:140px; display:block;" filter="true" filterMatchMode="startsWith">
						<f:selectItems value="#{invoiceItemReportUsageBean.tourCatViewVOList}" var="vo" itemValue="#{vo.id}" itemLabel="#{vo.desc}"/>
					</p:selectCheckboxMenu>
				</p:column>
				<p:column><p:separator style="width:2px;height:20px"/></p:column>
				<p:column>
					<h:outputLabel for="idCountry">Country</h:outputLabel>
				</p:column>
				<p:column>
					<p:selectCheckboxMenu id="idCountry" value="#{invoiceItemReportUsageBean.selectedCountryIds}" label="Country" style="width:140px; display:block;" filter="true" filterMatchMode="startsWith">
						<f:selectItems value="#{invoiceItemReportUsageBean.tourCountryVOList}" var="vo" itemValue="#{vo.id}" itemLabel="#{vo.desc}"/>
					</p:selectCheckboxMenu>
				</p:column>
				<p:column><p:separator style="width:2px;height:20px"/></p:column>
				<p:column></p:column>
				<p:column></p:column>
			</p:row>
			<p:row>
				<p:column colspan="8" style="text-align:center;">
					<p:commandButton icon="ui-icon-print" value="#{msg['common.button.label.print']} Excel" actionListener="#{invoiceItemReportUsageBean.printReportExcel()}" ajax="false"/>
					<p:spacer width="10"/>
					<p:commandButton icon="ui-icon-refresh" value="Reset" actionListener="#{invoiceItemReportUsageBean.resetForm()}" update="idFormInvoiceItemReportUsage" process="@this"/>
				</p:column>
			</p:row>
		</p:panelGrid>
	</h:form>
</p:panel>

</ui:define>
</ui:composition>
