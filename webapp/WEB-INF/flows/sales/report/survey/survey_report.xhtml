<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
					template="/WEB-INF/views/layouts/main.xhtml"
					xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<ui:define name="content">
<style>
	.hide-calendar .ui-datepicker-calendar {
	    display: none;
	}
	.ui-selectonemenu-item .ui-selectonemenu-list-item:hover {
		
	}
</style>

<p:dialog modal="true" widgetVar="statusDialog" header="Report Loading"
        draggable="false" closable="false" resizable="false">
	<p:panelGrid columns="1">
		<h:outputLabel>Please wait while the report is being prepared...</h:outputLabel>
		<p:graphicImage value="/img/ajaxloadingbar.gif" />
	</p:panelGrid>
</p:dialog>

<p:panel header="Survey Report" toggleable="true" toggleSpeed="500">
	<h:form id="idForm">
		<p:growl id="msg"/>
		
		<p:panelGrid id="idPanelFilter">
			<p:row>
				<p:column style="width:100px;">
					<h:outputLabel>Booking Date <span class="required">*</span></h:outputLabel>
				</p:column>
				<p:column style="width:10px;">
					<p:separator style="width:2px;height:20px"/>
				</p:column>
				<p:column style="width:80px;">
				 	<p:calendar id="idDateFr" label="Date From" pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" value="#{surveyReportBean.searchParamVO.obj1}"/>
					<p:watermark for="idDateFr" value="Date From" />
				</p:column>
				<p:column style="width:80px;">
					<p:calendar id="idDateTo" label="Date To" pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" value="#{surveyReportBean.searchParamVO.obj2}"/>
					<p:watermark for="idDateTo" value="Date To" />
				</p:column>
				<p:column>
					<p:commandButton icon="ui-icon-print" value="Print [PDF]" actionListener="#{surveyReportBean.print('PDF')}" ajax="false" style="margin-right: 20px;"/>
					<p:commandButton icon="ui-icon-print" value="Print [EXCEL]" actionListener="#{surveyReportBean.print('XLSX')}" ajax="false" style="margin-right: 20px;"/>
				</p:column>
			</p:row>
		</p:panelGrid>
	</h:form>
</p:panel>

</ui:define>
</ui:composition>
