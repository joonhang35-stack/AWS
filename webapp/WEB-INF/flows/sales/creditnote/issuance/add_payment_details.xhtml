<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<h:panelGrid columns="2">
	<h:outputLabel for="idPaymentDatePaid">Date Paid</h:outputLabel>
	<p:calendar id="idPaymentDatePaid" navigator="true" showButtonPanel="true"/>
	<h:outputLabel for="idPaymentCK">CK</h:outputLabel>
	<p:selectBooleanCheckbox id="idPaymentCK" label="CK"/>
	<h:outputLabel for="idPaymentOrNo">Or No.</h:outputLabel>
	<p:inputText id="idPaymentOrNo" label="Or No."/>
	<h:outputLabel for="idPaymentDocNo">Doc/Card No.</h:outputLabel>
	<p:inputText id="idPaymentDocNo" label="Doc/Card No."/>
	<h:outputLabel for="idPaymentAmtPaid">Amount Paid</h:outputLabel>
	<p:inputText id="idPaymentAmtPaid" label="Amount Paid"/>
	<h:outputLabel for="idPaymentAmtAlloc">Amount Alloc</h:outputLabel>
	<p:inputText id="idPaymentAmtAlloc" label="Amount Alloc"/>
	<h:outputLabel for="idPaymentAuth">Autorization</h:outputLabel>
	<p:inputText id="idPaymentAuth" label="Autorization"/>
	<h:outputLabel for="idPaymentCustNo">Customer No.</h:outputLabel>
	<p:inputText id="idPaymentCustNo" label="Customer No."/>
	<h:outputLabel for="idPaymentRecFrom">Received From</h:outputLabel>
	<p:inputText id="idPaymentRecFrom" label="Received From"/>
	<h:outputLabel for="idPaymentRemarks">Remarks</h:outputLabel>
	<p:inputText id="idPaymentRemarks" label="Remarks"/>
</h:panelGrid>

<h:panelGrid columns="2" style="width:1px">
	<p:commandButton value="Add"/>
	<p:commandButton value="Cancel" onclick="varAddPaymentDetailsDialog.hide()"/>
</h:panelGrid>

</ui:composition>
