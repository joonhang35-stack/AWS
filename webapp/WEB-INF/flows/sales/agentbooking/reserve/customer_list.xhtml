<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

<!--p:growl id="msg"/-->
<p:dataTable widgetVar="varCustListTable" value="#{salesBean.custDetailsList}" var="vo" paginator="true" rows="10" 
	paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
	rowKey="#{vo.custId}" selectionMode="single" filterEvent="enter">
	<p:ajax event="rowSelect" listener="#{salesBean.handleCustSelect}" update=":idAddInvoiceForm:idCustDetails,:idAddInvoiceForm:idAttTo" oncomplete="varCustListTable.clearFilters();varCustListDialog.hide();"/>
	
	<p:column headerText="Customer Id" sortBy="#{vo.codeLong}" filterBy="#{vo.codeLong}">
		<h:outputText value="#{vo.codeLong}"/>
	</p:column>
	<p:column headerText="Name" sortBy="#{vo.lastName} #{vo.firstName}" filterBy="#{vo.lastName} #{vo.firstName}" filterMatchMode="contains">
		<h:outputText value="#{vo.contPersonName}"/>
	</p:column>
	<p:column headerText="Company Name" sortBy="#{vo.companyName}" filterBy="#{vo.companyName}" filterMatchMode="contains">
		<h:outputText value="#{vo.companyName}"/>
	</p:column>
</p:dataTable>
<h:panelGrid columns="1">
	<p:commandButton value="#{msg['common.button.label.cancel']}" oncomplete="varCustListDialog.hide();varCustListTable.clearFilters();"/>
</h:panelGrid>
</ui:composition>
