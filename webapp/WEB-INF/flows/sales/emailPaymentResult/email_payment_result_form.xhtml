<!DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:zsg="http://www.bcs.com/zsg/jsf"
	xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<f:view contentType="text/html" locale="#{localeBean.locale}">
    <h:head>
    	<link rel="shortcut icon" href="#{contextPath}/img/apple_logo_v2.ico" />
    	<f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="EmulateIE8" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
            <title><h:outputFormat value="#{msg['common.title']}"/></title>
        </f:facet>
    	
    	<link type="text/css" rel="stylesheet" href="#{request.contextPath}/css/default.css" />
        <link type="text/css" rel="stylesheet" href="#{request.contextPath}/css/syntaxhighlighter.css" />
        <link type="text/css" rel="stylesheet" href="#{request.contextPath}/css/style.css" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
        <script type="text/javascript">
	        function preventBackspace(e) {
				var evt = e || window.event;
				if (evt) {
					var keyCode = evt.charCode || evt.keyCode;
					if (keyCode === 8) {
						if (evt.preventDefault) {
							evt.preventDefault();
						} else {
							evt.returnValue = false;
						}
					}
				}
			}
		</script>
    </h:head>
    <h:body>
    	<table cellpadding="0" cellspacing="0">
    		<colgroup>
    			<col width="1%"/>
    			<col width="98%"/>
    			<col width="1%"/>
    		</colgroup>
			<tr>
				<td style="padding-top:10px">
					<script>
						$(function() {
			    			if (document.getElementById('idForm:idHiddenSuccess').value === 'true')
			    				window.location.replace("https://applevacations.my/payment/");
			    			else
			    				window.location.replace("https://applevacations.my/payment/unsuccessful.php");
						});
					</script>
					<h:form id="idForm">
						<p:panelGrid style="text-align:center;">
							<p:row>
								<p:column>
									<h:inputHidden id="idHiddenSuccess" value="#{emailPaymentBean.isSuccess}"/>
								</p:column>
							</p:row>
						</p:panelGrid>
					</h:form>
				</td>
			</tr>
		</table> 
    </h:body>
</f:view>
</html>
