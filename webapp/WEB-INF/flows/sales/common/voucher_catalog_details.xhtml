<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:zsg="http://www.bcs.com/zsg/jsf">

	<p:growl id="msg" />
        <h:panelGrid columns="1" cellpadding="5">
        	<p:row>
        		<h:outputText value="Name:" />
        		<h:outputText value="#{salesBean.crmVoucherVO.name}" />
        	</p:row>
			<p:row>
            	<h:outputText value="Redemption ID:" />
           		<h:outputText value="#{salesBean.crmVoucherVO.redemptionId}" />
			</p:row>
			<p:row>
	            <h:outputText value="Category:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.categoryName}" />
            </p:row>
			<p:row>
	            <h:outputText value="Category Type:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.categoryType}" />
            </p:row>
            <p:row>
	            <h:outputText value="Category Desc:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.categoryDesc}" />
            </p:row>
            <p:row>
	            <h:outputText value="Description:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.description}" />
            </p:row>
            <p:row>
	            <h:outputText value="Min Points:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.minPoints}" />
            </p:row>
            <p:row>
	            <h:outputText value="Max Points:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.maxPoints}" />
            </p:row>
            <p:row>
	            <h:outputText value="Min Sales:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.minSales}" />
            </p:row>
            <p:row>
	            <h:outputText value="Max Sales:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.maxSales}" />
            </p:row>
            <p:row>
	            <h:outputText value="Conversion Points:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.conversionPoints}" />
            </p:row>
            <p:row>
	            <h:outputText value="Conversion Rebate Amt:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.conversionRebateAmt}" />
            </p:row>
            <p:row>
	            <h:outputText value="Discount Amt:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.discountAmt}" />
            </p:row>
            <p:row>
	            <h:outputText value="Percentage:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.percentage}" />
            </p:row>
            <p:row>
	            <h:outputText value="Max Discount Capped:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.maxDiscountCapped}" />
            </p:row>
            <p:row>
	            <h:outputText value="Expiry Days:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.expiryDays}" />
			</p:row>
            <p:row>
	            <h:outputText value="Expiry End Of Month:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.isExpiryEndOfMonth ? 'Yes' : 'No'}" />
			</p:row>
            <p:row>
	            <h:outputText value="Effective From:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.effectiveFrom}">
                <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:outputText>
        	</p:row>
            <p:row>
	            <h:outputText value="Effective Until:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.effectiveUntil}">
                <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:outputText>
            </p:row>
            <p:row>
	            <h:outputText value="Currency:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.currency}" />
            </p:row>
            <p:row>
	            <h:outputText value="Active:" />
	            <h:outputText value="#{salesBean.crmVoucherVO.isActive ? 'Yes' : 'No'}" />
            </p:row>
        </h:panelGrid>
    <h:panelGrid columns="1">
    	<p:commandButton value="Close" type="button" onclick="varVoucherDetailsDialog.hide();" />
    </h:panelGrid>
</ui:composition>
