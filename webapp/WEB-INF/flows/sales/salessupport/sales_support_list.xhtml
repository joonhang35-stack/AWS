<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp"
	  			template="/WEB-INF/views/layouts/main.xhtml">

<ui:define name="headIncludes">
<style>
	table.column-button td {
		border:0 !important;
	}
	td.group-color-0 {
		background: #FFFFFF;
	}
	td.group-color-1 {
		background: #FCFCD6;
	}
	td.group-color-2 {
		background: #FDE7BF;
	}
	td.group-color-3 {
		background: #FFCCCC;
	}
	td.group-color-4 {
		background: #d6d6f5;
	}
</style>

<script type="text/javascript">
	function copyTextFromInput(paramValue) {
		var textToCopy = paramValue.split('[BR]').join('\n'); 
		//copy the text to the clipboard 
		navigator.clipboard.writeText(textToCopy);
	}
	
	document.addEventListener('DOMContentLoaded', function() {
		var filters = document.querySelectorAll('input.ui-inputtext');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    });
	
	function setEnterKeyHint() {
        var filters = document.querySelectorAll('input.ui-inputtext');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    }
</script>
</ui:define>

<ui:define name="content">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
<p:panel header="Sales Support">
<h:form id="idForm">
    <p:growl id="msg"/>
    <p:panelGrid style="width: 10px; margin-bottom:5px;" id="idSearchFilter">
		<p:row>
			<p:column style="width: 80px;">
				<p:outputLabel value="Tour Code" />
			</p:column>
			<p:column style="width: 80px;">
				<p:outputLabel value="Package Name" />
			</p:column>
			<p:column style="width: 100px;">
				<p:outputLabel for="idValidFrom" value="Dep. Date from " />
			</p:column>
			<p:column style="width: 10px;">
				<p:outputLabel value="Date To" for="idValidTo" />
			</p:column>
			<p:column style="width: 10px !important;">
				<p:outputLabel value="SS PIC" for="idPic" />
			</p:column>
			<p:column style="width: 10px !important;" colspan="4">
			</p:column>
		</p:row>
		<p:row>
			<p:column>
				<p:inputText id="idTourCode" value="#{salesSuppBean.searchTourDepFilter.code}"/>
				<p:watermark for="idTourCode" value="Tour Code" />
			</p:column>
			<p:column>
				<p:inputText id="idPkgName" value="#{salesSuppBean.searchTourDepFilter.packageDesc}" size="30"/>
				<p:watermark for="idPkgName" value="Package Name" />
			</p:column>
			<p:column>
				<p:calendar id="idValidFrom" navigator="true" showButtonPanel="true" size="15"
					pattern="dd-MMM-yyyy" value="#{salesSuppBean.searchTourDepFilter.fromDate}"
					maxdate="#{salesSuppBean.searchTourDepFilter.toDate}">
					<p:ajax event="dateSelect" update=":idForm:idValidFrom, :idForm:idValidTo" global="false" />
				</p:calendar>
				<p:watermark for="idValidFrom" value="dd-mmm-yyyy" />
			</p:column>
			<p:column>
				<p:calendar id="idValidTo" navigator="true" showButtonPanel="true" size="15"
					pattern="dd-MMM-yyyy" value="#{salesSuppBean.searchTourDepFilter.toDate}"
					mindate="#{salesSuppBean.searchTourDepFilter.fromDate}">
					<p:ajax event="dateSelect" update=":idForm:idValidFrom" global="false" />
					<p:ajax event="change" update=":idForm:idValidFrom" global="false" />
				</p:calendar>
				<p:watermark for="idValidTo" value="dd-mmm-yyyy" />
			</p:column>
			<p:column>
				<p:selectOneMenu id="idPic" value="#{salesSuppBean.searchTourDepFilter.idPicSearch}" filter="true" style="width:150px;">
					<f:selectItem itemLabel="Select SS PIC"/>
					<f:selectItems value="#{salesSuppBean.employeeList}" var="picVO" itemValue="#{picVO.id}" itemLabel="#{picVO.userVO.name}"/>
				</p:selectOneMenu>
			</p:column>
			<p:column colspan="3" style="padding:1px;">
				<p:panelGrid columns="4" cellpadding="0" cellspacing="0">
					<p:selectBooleanCheckbox value="#{salesSuppBean.searchTourDepFilter.personalRecord}" itemLabel="Personal" style="width:90px; display:block;"/>
					<p:commandButton value="Search" actionListener="#{salesSuppBean.loadTourDepartureList}" oncomplete="setEnterKeyHint();" update="@form" />
					<p:commandButton value="Clear All" actionListener="#{salesSuppBean.handleFilterClearAll}" update=":idForm:idSearchFilter" process="@this" style="width: 80px;"/>
					<p:commandButton id="toggler" value="Columns" style="float:left"
						icon="ui-icon-calculator"
						actionListener="#{salesSuppBean.handleChangeColumnsViewClick}"
						oncomplete="varListingTableViewDialog.show();" process="@this"
						update=":idListingTableViewDialog" />
				</p:panelGrid>
			</p:column>
			<p:column>
				<p:spacer width="220" height="10"/>
			</p:column>
		</p:row>
		<p:row>
			<p:column>
				<p:selectCheckboxMenu id="idCategory" label="Category" value="#{salesSuppBean.searchTourDepFilter.idTourCatList}"
					filter="true" filterMatchMode="contains" style="width:150px; display:block;"
					onHide="executeSelectChangesOnhide();" >
					<f:selectItems value="#{salesSuppBean.tourCatViewList}" var="catVO" itemLabel="#{catVO.desc}" itemValue="#{catVO.id}"/>
				</p:selectCheckboxMenu>
				<p:remoteCommand name="executeSelectChangesOnhide" actionListener="#{salesSuppBean.handleTourCatSelect}"
					update=":idForm:idTourTheme" global="false" process="@this :idForm:idCategory"/>
			</p:column>
			<p:column>
				<p:selectCheckboxMenu id="idTourTheme" value="#{salesSuppBean.searchTourDepFilter.sectorList}" label="Tour Theme"
					filter="true" filterMatchMode="contains" style="width:200px; display:block;"
					disabled="#{empty salesSuppBean.searchTourDepFilter.idTourCatList}">
					<f:selectItems value="#{salesSuppBean.tourThemeList}" var="themeVO" itemLabel="#{themeVO.desc}" itemValue="#{themeVO.id}" />
				</p:selectCheckboxMenu>
			</p:column>
			<p:column>
				<p:selectCheckboxMenu id="idTourStatus" value="#{salesSuppBean.searchTourDepFilter.tourStatusList}" label="Tour Status" style="width:100px; display:block;">
					<f:selectItems value="#{bterp:lookupItemList('tour_status')}" var="statusVO" itemLabel="#{statusVO.description}" itemValue="#{statusVO.code}" />
				</p:selectCheckboxMenu>
			</p:column>
			<p:column>
				<h:selectOneMenu id="idDaysTillDep" label="Days till Departure" value="#{salesSuppBean.searchTourDepFilter.numDays}" style="width:120px;">
					<f:selectItem itemLabel="Select &le; Days"/>
					<f:selectItem itemLabel="&le; 30 Days" itemValue="30"/>
					<f:selectItem itemLabel="&le; 45 Days" itemValue="45"/>
					<f:selectItem itemLabel="&le; 60 Days" itemValue="60"/>
				</h:selectOneMenu>
			</p:column>
			<p:column>
				<h:selectOneMenu id="idMoreThenSold" label="Sold Pax" value="#{salesSuppBean.searchTourDepFilter.quantity}">
					<f:selectItem itemLabel="Select &ge; Sold"/>
					<!-- <f:selectItem itemLabel="&ge; 10" itemValue="10"/> -->
					<f:selectItem itemLabel="&ge; 15" itemValue="15"/>
					<f:selectItem itemLabel="&ge; 20" itemValue="20"/>
				</h:selectOneMenu>
			</p:column>
			<p:column>
				<h:selectOneMenu id="idFullPmnt" label="Full Payment" value="#{salesSuppBean.searchTourDepFilter.fullPmntStatus}">
					<f:selectItem itemLabel="Select Full Payment"/>
					<f:selectItem itemLabel="Pending" itemValue="PE"/>
					<f:selectItem itemLabel="Completed" itemValue="CP"/>
				</h:selectOneMenu>
			</p:column>
			<p:column>
				<h:selectOneMenu id="idPassport" label="Passport" value="#{salesSuppBean.searchTourDepFilter.passportStatus}">
					<f:selectItem itemLabel="Select Passport"/>
					<f:selectItem itemLabel="Pending" itemValue="PE"/>
					<f:selectItem itemLabel="Completed" itemValue="CP"/>
				</h:selectOneMenu>
			</p:column>
			<p:column>
				<h:selectOneMenu id="idVisa" label="Visa" value="#{salesSuppBean.searchTourDepFilter.visaStatus}">
					<f:selectItem itemLabel="Select Visa"/>
					<f:selectItem itemLabel="Pending" itemValue="PE"/>
					<f:selectItem itemLabel="Completed" itemValue="CP"/>
				</h:selectOneMenu>
			</p:column>
			<p:column>
				<p:selectBooleanCheckbox value="#{salesSuppBean.searchTourDepFilter.inactiveRecord}" itemLabel="Show Archive" style="width:110px; display:block;"/>
			</p:column>
		</p:row>
	</p:panelGrid>
	
	<p:dataTable id="idFilterTourDepList" value="#{salesSuppBean.tourDepList}" var="vo" paginator="true" rows="500" 
		paginatorTemplate="#{bterp:pageTemplate()}" rowsPerPageTemplate="500, 1000, 1500" rowIndexVar="rowIndex">
		
		<p:column headerText="No." style="width:30px;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(1)}">
			<h:outputText value="#{rowIndex+1}" />
		</p:column>
		
		<p:column headerText="Dep. Date" style="width:130px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(2)}">
			<h:outputText value="#{vo.dtDep}">
				<!-- <f:convertDateTime pattern="#{config['date.display.pattern']}" /> -->
				<f:convertDateTime pattern="#{config['date.display.pattern2']}" />
			</h:outputText>
		</p:column>
		<p:column headerText="Package Name" style="text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(3)}">
			<h:outputText value="#{vo.nameEn}"/> 
		</p:column>
		<p:column headerText="Tour Code" style="width:180px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(4)}">
			<p:commandLink actionListener="#{salesSuppBean.handleShowBookingListFromSearch(vo)}" oncomplete="varBookingListDialog.show()" update=":idBookingListDialog" style="color:#0040FF;" process="@this">
				<h:outputText value="#{vo.code}"/> 
			</p:commandLink>
		</p:column>
		<p:column headerText="Tour Status" style="width:80px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(5)}">
			<h:outputText value="#{bterp:lookupItemDesc('tour_status', vo.tourStatusCd)}"/>
			<h:outputText value="Full" rendered="#{vo.tourStatusCd eq 'F'}" />
		</p:column>
		<p:column headerText="Seat" style="width:30px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(6)}">
			<h:outputText value="#{vo.seatAllot}"/> 
		</p:column>
		<p:column headerText="Sold" style="width:30px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(7)}">
			<h:outputText value="#{vo.quantity}"/> 
		</p:column>
		<p:column headerText="GA" style="width:30px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(8)}">
			<h:outputText value="#{vo.totalGA}"/>
			<!-- <p:commandLink onclick="copyTextFromInput('#{vo.copyPasteDetails}');" global="false" layout="block">
				<h:outputText value="#{vo.totalGA}"/>
			</p:commandLink> -->
		</p:column>
		<p:column headerText="Full Payment" style="width:80px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(9)}">
			<p:commandLink id="idTTFullPayment" onclick="navigator.clipboard.writeText('#{vo.totalUnpaidInvNo}');" global="false" layout="block" >
				<h:outputText value="#{vo.totalInvPaid} / #{vo.totalInv}"/>
			</p:commandLink>
			<pe:tooltip for="idTTFullPayment" shared="true" showDelay="0" myPosition="left center" atPosition="right center"
				rendered="#{not empty vo.totalUnpaidInvNo}">
				<h:outputText value="#{vo.totalUnpaidInvNo}" escape="true" style="white-space: pre-wrap"/>
			</pe:tooltip>
			<p:commandLink onclick="copyTextFromInput('#{vo.copyPasteDetails}');" global="false" actionListener="#{salesSuppBean.onCopyClick}" update="@form" process="@this">
				<i class="fa fa-clipboard" />
			</p:commandLink>
			
		</p:column>
		<p:column headerText="In-Review" style="width:90px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(10)}">
			<p:commandLink id="idTTInReview" onclick="navigator.clipboard.writeText('#{vo.totalOpenedDocNo}');" global="false" layout="block" >
				<h:outputText value="#{vo.totalInv - vo.totalOpenedDoc} / #{vo.totalInv}"/>
			</p:commandLink>
			<pe:tooltip for="idTTInReview" shared="true" showDelay="0" myPosition="left center" atPosition="right center"
				rendered="#{not empty vo.totalOpenedDocNo}">
				<h:outputText value="#{vo.totalOpenedDocNo}" escape="true" style="white-space: pre-wrap"/>
			</pe:tooltip>
		</p:column>
		<p:column headerText="Passport" style="width:90px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(10)}">
			<p:commandLink id="idTTPassport" onclick="navigator.clipboard.writeText('#{vo.validPassInvNo}');" global="false" layout="block">
				<!-- <h:outputText value="#{vo.passportStatus eq 'PE' ? 'PENDING' : 'DONE'}"/> -->
				<h:outputText value="#{vo.totalValidPassport}"/>
			</p:commandLink>
			<pe:tooltip for="idTTPassport" shared="true" showDelay="0" myPosition="left center" atPosition="right center"
				rendered="#{not empty vo.validPassInvNo}">
				<h:outputText value="#{vo.validPassInvNo}" escape="true" style="white-space: pre-wrap"/>
			</pe:tooltip>
		</p:column>
		<p:column headerText="Visa" style="width:90px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(11)}">
			<p:commandLink id="idTTVisa" onclick="navigator.clipboard.writeText('#{vo.visaCopiesInvNo}');" global="false" layout="block">
				<!-- <h:outputText value="#{vo.visaStatus eq 'PE' ? 'PENDING' : 'DONE'}"/> -->
				<h:outputText value="#{vo.isVisaRequired ? vo.totalVisaCopies : 'NA'}"/>
			</p:commandLink>
			<pe:tooltip for="idTTVisa" shared="true" showDelay="0" myPosition="left center" atPosition="right center"
				rendered="#{not empty vo.visaCopiesInvNo and vo.isVisaRequired}">
				<h:outputText value="#{vo.visaCopiesInvNo}" escape="true" style="white-space: pre-wrap"/>
			</pe:tooltip>
		</p:column>
		<p:column headerText="Deadline" style="width:100px; text-align:center;" styleClass="group-color-#{vo.groupColor}" sortBy="#{vo.dtDeadline}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(12)}">
			<h:outputText value="#{vo.dtDeadline}">
				<f:convertDateTime pattern="#{config['date.display.pattern']}" />
			</h:outputText>
		</p:column>
		<p:column headerText="OP PIC" style="width:180px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(13)}">
			<p:commandLink id="idTTOpPic" global="false" layout="block">
				<h:outputText value="#{vo.opPicName.length() gt 25 ? vo.opPicName.substring(0,22).concat('...') : vo.opPicName}"/>
			</p:commandLink>
			<pe:tooltip for="idTTOpPic" shared="true" showDelay="0" myPosition="left center" atPosition="right center"
				rendered="#{not empty vo.opPicName}">
				<h:outputText value="#{vo.opPicName}" escape="true" style="white-space: pre-wrap"/>
			</pe:tooltip>
		</p:column>
		<p:column headerText="SS PIC" style="width:180px; text-align:center;" styleClass="group-color-#{vo.groupColor}"
			rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(14)}">
			<p:selectOneMenu value="#{vo.idPicUser}" filter="true" rendered="#{vo.addEdit}" style="width:95%">
				<f:selectItems value="#{salesSuppBean.employeeList}" var="empVO" itemValue="#{empVO.id}" itemLabel="#{empVO.userVO.name}"/>
			</p:selectOneMenu>
			<h:outputText value="#{vo.picName}" rendered="#{!vo.addEdit}"/>
		</p:column>
		<p:column headerText="Edit" style="width:80px;" styleClass="group-color-#{vo.groupColor}" rendered="#{salesSuppBean.listingTableViewVO.verifyVisibility(15)}">
			<h:panelGrid columns="2" id="idColumnButton" style="border:0 !important;" styleClass="column-button">
				<p:commandButton icon="ui-icon-pencil" actionListener="#{salesSuppBean.editTourDep(vo)}" rendered="#{!vo.addEdit and vo.statusCode eq 'AC'}"
					update=":idForm:idFilterTourDepList"/>
				<p:commandButton icon="ui-icon-disk" actionListener="#{salesSuppBean.saveTourDepartureSalesSupp(vo)}" rendered="#{vo.addEdit}"
					update=":idForm:idFilterTourDepList"/>
				<p:commandButton icon="ui-icon-close" actionListener="#{salesSuppBean.cancelTourDep(vo)}" rendered="#{vo.addEdit}"
					update=":idForm:idFilterTourDepList"/>
			</h:panelGrid>
		</p:column>
	</p:dataTable>
</h:form>
</p:panel>

	DIALOG - BOOKING LIST
-->
<p:dialog id="idBookingListDialog" header="Booking Made"
	widgetVar="varBookingListDialog" modal="true" resizable="false"
	dynamic="true" draggable="true" hideEffect="fade" showEffect="fade"
	closable="false">
	<h:form id="idBookingListForm">
		<ui:include src="booking_list.xhtml" />
	</h:form>
</p:dialog>


<!--
	DIALOG - BOOKING DETAILS
-->
<p:dialog id="idBookingDetailsDialog" header="Booking Details"
	widgetVar="varBookingDetailsDialog" modal="true" resizable="false"
	dynamic="true" draggable="true" closable="false">
	<h:form id="idBookingDetailsForm">
		<ui:include src="booking_details.xhtml" />
	</h:form>
</p:dialog>

<p:dialog id="idListingTableViewDialog" header="Listing Table View"
	widgetVar="varListingTableViewDialog" modal="true" resizable="false"
	dynamic="true" draggable="true" closable="false">
	<h:form id="idListingTableViewForm">
		<ui:include
			src="../../maintenance/listingtableview/listing_sales_supp_table_view.xhtml" />
	</h:form>
</p:dialog>
