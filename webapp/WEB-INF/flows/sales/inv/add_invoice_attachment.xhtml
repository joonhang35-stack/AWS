<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:zsg="http://www.bcs.com/zsg/jsf"
	xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

	<p:growl id="msg" />

	<script type="text/javascript">
		function onValidation(xhr, status, args) {
			if (args.validationFailed) {
				varAddInvoiceAttachmentDialog.show();
			} else {
				varAddInvoiceAttachmentDialog.hide();
			}
		}
	</script>

	<p:panelGrid>
		<p:row>
			<p:column style="width: 120px;">
				<p:outputLabel for="idSelAttachmentType" value="Attachment Type" />
			</p:column>
			<p:column>
				<h:selectOneMenu id="idSelAttachmentType" label="Attachment Type"
					value="#{salesBean.invoiceAttachmentVO.typeCd}" required="true">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems value="#{bterp:lookupItemList('attachment_type')}"
						var="vo" itemValue="#{vo.code}" itemLabel="#{vo.description}" />
				</h:selectOneMenu>
			</p:column>
		</p:row>
		<p:row>
			<p:column>
				<h:outputLabel>Scanned Copy</h:outputLabel>
			</p:column>
			<p:column>
				<p:panelGrid id="idPanelAttachmentScannedCopy" style="border:0">
					<p:row rendered="#{empty salesBean.invoiceAttachmentVO.scannedPath}">
						<p:column>
							<p:fileUpload id="idAttachmentScannedCopy"
								fileUploadListener="#{salesBean.handleAttachmentFileUpload}"
								mode="advanced" auto="true" sizeLimit="10000000"
								allowTypes="/(\.|\/)(pdf|jpg|jpeg|png)$/"
								description="*.pdf;*.jpg;*.jpeg,*.png"
								update="msg, :idAddInvoiceAttachmentForm:idPanelAttachmentScannedCopy" oncomplete="varStatusDialog.hide()" />
						</p:column>
					</p:row>
	
					<p:row rendered="#{not empty salesBean.invoiceAttachmentVO.scannedPath}">
						<p:column style="width:15px;">
							<p:commandLink styleClass="ui-icon ui-icon-close"
								onclick="varDelAttachmentScannedCopyDialog.show()" />
						</p:column>
						<p:column>
							<h:outputText
								value="#{salesBean.invoiceAttachmentVO.scannedPath}"
								rendered="#{empty salesBean.invoiceAttachmentVO.id}" />
							<h:outputText
								value="#{salesBean.invoiceAttachmentVO.scannedPath}"
								rendered="#{not empty salesBean.invoiceAttachmentVO.id}" />
						</p:column>
					</p:row>
				</p:panelGrid>
			</p:column>
		</p:row>
	</p:panelGrid>

	<h:panelGrid columns="2" style="width: 1px;">
		<p:commandButton value="#{msg['common.button.label.save']}"
			actionListener="#{salesBean.addInvoiceAttachment}"
			update=":idAddInvoiceAttachmentForm, :idAddInvoiceForm:idInvAttachmentListPanel" />
		<p:commandButton value="#{msg['common.button.label.cancel']}"
			actionListener="#{salesBean.cancelAttachmentChange}" process="@this"
			update=":idAddInvoiceAttachmentForm"
			oncomplete="varAddInvoiceAttachmentDialog.hide();" />
	</h:panelGrid>
</ui:composition>
