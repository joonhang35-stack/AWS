<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:zsg="http://www.bcs.com/zsg/jsf">
	
	<p:dataTable widgetVar="varVoucherHistoryListTable"
		value="#{custBean.voucherList}" var="voucherVO" paginator="true"
		rows="10"
		paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}"
		filterEvent="enter">

		<p:column headerText="Code">
			<h:outputText value="#{voucherVO.redemptionCode}" />
		</p:column>
		<p:column headerText="Redeemed Date">
			<h:outputText value="#{voucherVO.redeemedDateTime}" />
		</p:column>
	</p:dataTable>

	<h:panelGrid columns="1">
		<p:commandButton value="#{msg['common.button.label.cancel']}"
			oncomplete="varVoucherHistoryDialog.hide();" />
	</h:panelGrid>
</ui:composition>
