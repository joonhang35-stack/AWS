<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
					template="/WEB-INF/views/layouts/main.xhtml"
					xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<ui:define name="content">

<script type="text/javascript">
function monitorExporting(start, complete) {
	if (start) {
		start();
	}

	window.pdfExportingMonitor = setInterval(function() {
		var exportingComplete = $.cookie('cookie.pdf.exporting');

		if (exportingComplete === 'true') {
			if (complete) {
				complete();
			}
			$.cookie('cookie.pdf.exporting', null);
			clearInterval(window.pdfExportingMonitor);
		}
	}, 500);
}

function start() {
	statusDialog.show();
}

function stop() {
	statusDialog.hide();
}
</script>

<p:dialog modal="true" widgetVar="statusDialog" header="Report Loading"
        draggable="false" closable="false" resizable="false">
	<p:panelGrid columns="1">
		<h:outputLabel>Please wait while the report is being prepared...</h:outputLabel>
		<p:graphicImage value="/img/ajaxloadingbar.gif" />
	</p:panelGrid>
</p:dialog>

<p:panel header="GST Report" toggleable="true" toggleSpeed="500">
	<h:form id="idFormGSTReport">
		<p:growl id="msg"/>
		<p:panelGrid style="width:700px;">
			<p:row>
				<p:column style="width:100px;">
					<h:outputLabel for="idReportType">Report Type <span class="required">*</span></h:outputLabel>
				</p:column>
				<p:column>
					<h:selectOneMenu id="idReportType" label="Report Type" value="#{gstReportBean.reportType}" effect="fade">
						<p:ajax event="change" listener="#{gstReportBean.handleSelectReportType}" update="idFormGSTReport" />
						<f:selectItem itemLabel="Select One" itemValue=""/>
						<f:selectItem itemLabel="GST Output Tax Summary Report" itemValue="A"/>
						<f:selectItem itemLabel="GST Input Tax Summary Report" itemValue="B"/>
						<f:selectItem itemLabel="GST Output Tax Summary Report - All" itemValue="C"/>
						<f:selectItem itemLabel="GST Input Tax Summary Report - All" itemValue="D"/>
						<f:selectItem itemLabel="GST Summary For Acquisition &amp; Input Tax" itemValue="E"/>
						<f:selectItem itemLabel="GST Yearly Report" itemValue="F"/>
					</h:selectOneMenu>
				</p:column>
				<p:column>
					<p:commandButton icon="ui-icon-print" value="Print [PDF]" actionListener="#{gstReportBean.printGSTOutputTaxSummaryRpt('PDF')}" ajax="false" rendered="#{gstReportBean.reportType == 'A'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [Excel]" actionListener="#{gstReportBean.printGSTOutputTaxSummaryRpt('XLS')}" ajax="false" rendered="#{gstReportBean.reportType == 'A'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [PDF]" actionListener="#{gstReportBean.printGSTInputTaxSummaryRpt('PDF')}" ajax="false" rendered="#{gstReportBean.reportType == 'B'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [Excel]" actionListener="#{gstReportBean.printGSTInputTaxSummaryRpt('XLS')}" ajax="false" rendered="#{gstReportBean.reportType == 'B'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [PDF]" actionListener="#{gstReportBean.printGSTOutputTaxSummaryAllRpt('PDF')}" ajax="false" rendered="#{gstReportBean.reportType == 'C'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [Excel]" actionListener="#{gstReportBean.printGSTOutputTaxSummaryAllRpt('XLS')}" ajax="false" rendered="#{gstReportBean.reportType == 'C'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [PDF]" actionListener="#{gstReportBean.printGSTInputTaxSummaryAllRpt('PDF')}" ajax="false" rendered="#{gstReportBean.reportType == 'D'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [Excel]" actionListener="#{gstReportBean.printGSTInputTaxSummaryAllRpt('XLS')}" ajax="false" rendered="#{gstReportBean.reportType == 'D'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [PDF]" actionListener="#{gstReportBean.printGSTSmmryAcquisitionInputTaxRpt('PDF')}" ajax="false" rendered="#{gstReportBean.reportType == 'E'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [Excel]" actionListener="#{gstReportBean.printGSTSmmryAcquisitionInputTaxRpt('XLS')}" ajax="false" rendered="#{gstReportBean.reportType == 'E'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [PDF]" actionListener="#{gstReportBean.printGSTYearlyRpt('PDF')}" ajax="false" rendered="#{gstReportBean.reportType == 'F'}" onclick="monitorExporting(start,stop)"/>
					<p:commandButton icon="ui-icon-print" value="Print [Excel]" actionListener="#{gstReportBean.printGSTYearlyRpt('XLS')}" ajax="false" rendered="#{gstReportBean.reportType == 'F'}" onclick="monitorExporting(start,stop)"/>
				</p:column>
			</p:row>
		</p:panelGrid>
		
		<p:panelGrid id="idSearchTypeA" style="width:750px;">
			<p:row rendered="#{gstReportBean.reportType == 'A' ||
				gstReportBean.reportType == 'B' ||
				gstReportBean.reportType == 'C' ||
				gstReportBean.reportType == 'D' ||
				gstReportBean.reportType == 'E' ||
				gstReportBean.reportType == 'F'}">
				<p:column style="width:110px;">
					<h:outputLabel>Report Date <span class="required">*</span></h:outputLabel>
				</p:column>
				<p:column style="width:10px;">
					<p:separator style="width:2px;height:20px"/>
				</p:column>
				<p:column style="width:80px;">
					<p:calendar id="idReportDateFr" label="Date From" pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" value="#{gstReportBean.searchParamVO.obj2}" required="true"/>
					<p:watermark for="idReportDateFr" value="Date From" />
				</p:column>
				<p:column style="width:80px;">
					<p:calendar id="idReportDateTo" label="Date To" pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" value="#{gstReportBean.searchParamVO.obj3}" required="true"/>
					<p:watermark for="idReportDateTo" value="Date To" />
				</p:column>
				<p:column style="width:150px;">&nbsp;</p:column>
			</p:row>
			<p:row rendered="#{gstReportBean.reportType == 'A' ||
				gstReportBean.reportType == 'B' ||
				gstReportBean.reportType == 'C' ||
				gstReportBean.reportType == 'D'}">
				<p:column>
					<h:outputLabel>Tax Code</h:outputLabel>
				</p:column>
				<p:column>
					<p:separator style="width:2px;height:20px"/>
				</p:column>
				<p:column>
					<h:selectOneMenu Label="Tax Code" value="#{gstReportBean.searchParamVO.obj1}">                 
						<f:selectItem itemLabel="All" itemValue="" />   
			            <f:selectItems value="#{gstReportBean.inputOutputTaxCodeList}" var="vo" itemLabel="#{vo.code}" itemValue="#{vo.code}" /> 
				    </h:selectOneMenu>
				</p:column>
			</p:row>
		</p:panelGrid>
	</h:form>
</p:panel>

</ui:define>
</ui:composition>
