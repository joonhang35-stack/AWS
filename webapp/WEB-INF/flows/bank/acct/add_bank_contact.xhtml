<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<p:growl id="msg"/>
<p:panelGrid>
	<p:row>
		<p:column><h:outputLabel for="idContactType">Contact Type <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
			<h:selectOneMenu id="idContactType" value="#{bankAcctBean.bankContactVO.typeCd}" effect="fade" required="true">  
				<f:selectItems value="#{bterp:lookupItemList('cntc_type')}" var="vo" itemValue="#{vo.code}" itemLabel="#{vo.description}"/>
			</h:selectOneMenu>
		</p:column>
		<p:column><h:outputLabel for="idContactNo">Contact Number <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idContactNo" label="Contact No" value="#{bankAcctBean.bankContactVO.number}" required="true"/></p:column>
	</p:row>
</p:panelGrid>
<h:panelGrid columns="2" style="width:1px;">
	<p:commandButton value="#{msg['common.button.label.ok']}" actionListener="#{bankAcctBean.addContact}" update="@form,:idAddBankForm:idContactList,:idEditBankForm:idContactList" rendered="#{not bankAcctBean.upd}"/>
	<p:commandButton value="#{msg['common.button.label.ok']}" actionListener="#{bankAcctBean.updContact}" update="@form,:idEditBankForm:idContactList" oncomplete="varEditContactDialog.hide()" rendered="#{bankAcctBean.upd}"/>
	<p:commandButton value="#{msg['common.button.label.cancel']}" actionListener="#{bankAcctBean.resetContactForm}" onclick="varAddContactDialog.hide(),varEditContactDialog.hide()" process="@this" update="@form" />
</h:panelGrid>
</ui:composition>
