<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">


<p:growl id="msg"/>
<script type="text/javascript">
	function onValidation(xhr, status, args) {
		if (args.validationFailed) {
			varAddRefundDialog.show();
		} else {
			varAddRefundDialog.hide();
		}
	}
	window.onload = function() {
		document.getElementById(':idAddRefund:idPayee').focus();
	}
	</script>
<div style="height:500px;width:900px;overflow:auto;">
<p:panelGrid>
	<p:row>
		<p:column><h:outputLabel for="idBankAcct">Bank Account </h:outputLabel></p:column>
		<p:column>
			<!-- <h:outputText id="idBankAcct" label="idBankAcct" value="#{refundBean.cashBookVO.temp}"/> -->
			<h:selectOneMenu id="idBankAcct" label="Bank Account" value="#{refundBean.cashBookVO.idBank}">
				<f:selectItems value="#{refundBean.bankAcctViewList}" var="bankVO" itemLabel="#{bankVO.name}" itemValue="#{bankVO.id}"/>
			</h:selectOneMenu>
		</p:column>
	
		 <p:column><h:outputLabel for="idCompanyCode">Company Code</h:outputLabel></p:column>
		<p:column><h:outputText id="idCompanyCode" label="idCompanyCode" value="#{refundBean.sessionInfoBean.companyVO.name}"/></p:column>
	</p:row>
	
	<p:row>
		<p:column><h:outputLabel for="idAddEODt">Date <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:calendar pattern="dd-MMM-yyyy" id="idAddEODt" value="#{refundBean.cashBookVO.dtTrans}" navigator="true" showButtonPanel="true" mindate="#{refundBean.dateFormat(bterp:finPeriodLockVO(sessionInfoBean.companyVO.id).dtStart, 'dd-MMM-yyyy')}" maxdate="#{refundBean.dateFormat(bterp:finPeriodLockVO(sessionInfoBean.companyVO.id).dtEnd, 'dd-MMM-yyyy')}" required="true"/><span style="font-style:italic; font-size:9px; color:#333333;">(dd-MMM-yyyy)</span></p:column>
		
		<p:column><h:outputLabel for="idPayee">Pay<span class="required">*</span></h:outputLabel></p:column>
		<p:column>
			<p:inputText id="idPayee" label="Payee" value="#{refundBean.cashBookVO.payee}" required="true" readonly="#{not empty refundBean.cashBookVO.idCustomer}"/>&nbsp;
			<!--<p:commandButton icon="ui-icon-search" oncomplete="varCustListDialog.show()" update=":idCustListForm" immediate="true"/>-->
			<p:commandButton icon="ui-icon-search" actionListener="#{refundBean.passangerSearch}" update=":idCustListDialog" oncomplete="varCustListDialog.show()" process="@this" rendered="#{empty refundBean.cashBookVO.payee}"/>
			<p:commandButton icon="ui-icon-close" actionListener="#{refundBean.handlePassangerClear}" update="idAddRefund:idPayee,:idAddRefund:idCustomerNumber" process="@this"/>
		</p:column>
	</p:row>
	
	<p:row>
		<p:column><h:outputLabel for="idAmount">Amount <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idAmount" label="Amount" value="#{refundBean.cashBookVO.credit}" required="true"><f:convertNumber pattern="#,##0.00"/>
	 	<p:ajax update=":idAddRefund:idAddTrans"/>
		</p:inputText></p:column>
		
		<p:column><h:outputLabel for="idCustomerNumber">Customer Number</h:outputLabel></p:column>
		<p:column><h:outputText id="idCustomerNumber" label="CustomerNumber" value="#{refundBean.cashBookVO.custCode}"></h:outputText></p:column>
	</p:row>
	<p:row>
		<p:column><h:outputLabel for="idChequeNo">Cheque No<span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idChequeNo" label="Cheque No" value="#{refundBean.cashBookVO.refNo}" required="true" maxlength="30" style="width:230px"/></p:column>
		<p:column><h:outputLabel>Tour Code </h:outputLabel></p:column>
		<p:column>
	        <p:inputText id="idTourCd" label="Tour Code" value="#{refundBean.cashBookVO.tourCd}" readonly="true" size="30"/>&nbsp;
	        <p:commandButton icon="ui-icon-search" actionListener="#{refundBean.loadTour}" update=":idTourCodeList" oncomplete="varTourCodeList.show()" process="@this"/>
			<p:commandButton icon="ui-icon-close" actionListener="#{refundBean.clearTourCode}" update="idTourCd" process="@this"/>
		</p:column>
	</p:row>
	</p:panelGrid>
	<p:panelGrid>
	<p:row>
		<p:column><h:outputLabel for="idMemo">Memo<span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputTextarea id="idMemo" label="Memo" value="#{refundBean.cashBookVO.remarks}" required="true"  rows="7" cols="90"/></p:column>
	</p:row>
	</p:panelGrid>
	<p:panelGrid>
	<p:row>
		<p:column>
			<p:commandButton  id="idAddTrans" value="Add Account Transaction" oncomplete="varAccountTransactionDialog.show()" immediate="true" actionListener="#{refundBean.onAddAcctTrans(refundBean.cashBookVO.credit,0)}" update=":idAcctTransDialog" />
		</p:column>
	</p:row>
	<p:row>
		<p:column>
		<p:panel id ="idShowAcctTrans" style="border:none">
		<p:dataTable id="idShowAcctTransList" value="#{refundBean.cashBookVO.acctTransList}" var="acctTransViewVO" style="width:250px">
				<p:column headerText="Edit" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-pencil" actionListener="#{refundBean.onAcctTransSelected(acctTransViewVO)}" oncomplete="varEditAcctTransDialog.show()" process="@this" update=":idEditAcctTransDialog"/>
				</p:column>
				<p:column headerText="Delete" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-close" actionListener="#{refundBean.delAcctTransList(acctTransViewVO)}" update=":idAddRefund" process="@this"/>
				</p:column>
				<p:column headerText="Account">
					 <h:outputText value="#{acctTransViewVO.acctViewVO.code}" rendered="#{empty acctTransViewVO.acctViewVO.subCode}"/>
					 <h:outputText value="#{acctTransViewVO.acctViewVO.code}-#{acctTransViewVO.acctViewVO.subCode}" rendered="#{not empty acctTransViewVO.acctViewVO.subCode}"/>
				</p:column>
				<p:column headerText="Description">
					<h:outputText value="#{acctTransViewVO.acctViewVO.desc}" rendered="#{empty acctTransViewVO.acctViewVO.subCode}"/>
					<h:outputText value="#{acctTransViewVO.acctViewVO.desc}-#{acctTransViewVO.acctViewVO.subDesc}" rendered="#{not empty acctTransViewVO.acctViewVO.subCode}"/>
				</p:column>
				<p:column headerText="Amount">
					<h:outputText value="#{refundBean.getDoubleDecimalFormat('#,##0.00',acctTransViewVO.credit)}"/>
				</p:column>
				<p:columnGroup type="footer">
					<p:row>
						<p:column colspan="4" footerText="Totals:" style="text-align:right"/>
						<p:column colspan="5" footerText="#{refundBean.getDoubleDecimalFormat('#,##0.00', refundBean.totalBal)}"/>
					</p:row>
				</p:columnGroup>
		   </p:dataTable>
		</p:panel>
		</p:column>
	</p:row>
	<p:row>
		<p:column><p:commandButton id="idAddTrans3" value="Add Invoice Payment" oncomplete="varInvTransDialog.show()" immediate="true" actionListener="#{refundBean.loadInvoicePayment}" update=":idInvTransDialog,:idInvListForm:idInvListTable"/></p:column>
	</p:row>
	<p:row>
		<p:column>
			<p:panel id ="idShowInv" style="border:none">
				<p:dataTable id="idShowInvList" value="#{refundBean.cashBookVO.invPymtList}" var="invTransViewVO">
					<p:column headerText="Delete" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-close"  actionListener="#{refundBean.delInvPmnt(invTransViewVO)}" update=":idAddRefund:idShowInvList" process="@this"/>
					</p:column> 
					<p:column headerText="Document No" style="width:80px; text-align:center;">
						<h:outputText rendered="#{invTransViewVO.invoiceDocTypeCd eq 'I'}" value="#{bterp:sysNumGenVO(sessionInfoBean.companyVO.id, 'invc').prefixid} #{invTransViewVO.invoiceNo}"  />
						<h:outputText rendered="#{invTransViewVO.invoiceDocTypeCd eq 'P'}" value="#{bterp:sysNumGenVO(sessionInfoBean.companyVO.id, 'pax_statement').prefixid} #{invTransViewVO.psNo}"  />
					</p:column>  
					<p:column headerText="Tour Code" style="width:150px; text-align:center;">
						<h:outputText value="#{invTransViewVO.tourCode}"/>  
					</p:column>
					<p:column headerText="Payment Date" style="width:100px; text-align:center;">
					  <h:outputText value="#{invTransViewVO.pmntDt}"   >
					<f:convertDateTime pattern="dd-MMM-yyyy"/>  
					</h:outputText>
					  </p:column> 
					<p:column headerText="Payment Ref No" style="width:100px; text-align:center;">
					  <h:outputText value="#{invTransViewVO.refNo}"  />
					  </p:column> 
					<p:column headerText="Received From" style="width:300px; text-align:center;">
					  <h:outputText value="#{invTransViewVO.recievedFr}"  />
					  </p:column> 
					<p:column headerText="Amount" style="width:100px; text-align:center;">
					  <h:outputText value="#{invTransViewVO.amount}"  />
					</p:column> 
				</p:dataTable>
			</p:panel>
		</p:column>
	</p:row>
</p:panelGrid>	
</div>
<h:panelGrid id="idButtonGrid" columns="2" style="width:1px;margin:5px 0 0 6px;">
	<p:commandButton value="#{msg['common.button.label.save']}" type="submit" actionListener="#{refundBean.addRefund}" update="@form,:idForm:idPaymentTable"/>
	 <p:commandButton id="idBtnAddCancel" value="#{msg['common.button.label.cancel']}" actionListener="#{refundBean.resetForm}" update="@form" process="@this" oncomplete="varAddRefundDialog.hide()">
		<pe:resetEditableValues for="idAddRefund"/>
	</p:commandButton>
</h:panelGrid>
</ui:composition>
