<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			template="/WEB-INF/views/layouts/main.xhtml">
	
<ui:define name="content">
<script type="text/javascript">
	document.addEventListener('DOMContentLoaded', function() {
		var filters = document.querySelectorAll('input.ui-inputtext');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    });
	
	document.addEventListener('DOMContentLoaded', function() {
        var filters = document.querySelectorAll('input.ui-column-filter');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    });
	
	function setEnterKeyHint() {
        var filters = document.querySelectorAll('input.ui-inputtext');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
        filters = document.querySelectorAll('input.ui-column-filter');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    }
</script>
	<p:panel header="Refund">
		<h:form id="idForm">
   	<p:growl id="msg"/>
    
	 	<!-- <h:panelGrid columns="3" cellpadding="0" cellspacing="2" style="margin-bottom:10px; width:400px">
			<h:outputLabel for="idBankSearch">Bank Account</h:outputLabel>
				 	<h:selectOneMenu id="idBankSearch" label="Bank Account" value="#{refundBean.bankId}">
					<f:selectItems value="#{refundBean.bankAcctViewList}" var="bankVO" itemLabel="#{bankVO.name}" itemValue="#{bankVO.id}"/>
					<p:ajax update="@form"  listener="#{refundBean.search}" oncomplete="varRefundList.clearFilters()"/> 
			</h:selectOneMenu>
		</h:panelGrid> -->
		
		<h:panelGrid columns="12" cellpadding="0" cellspacing="2" style="margin-bottom:10px; width:1200px">
			<h:outputLabel>Date From</h:outputLabel>
			<p:calendar value="#{refundBean.searchParamVO.fromDate}" id="idFromDate" pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" display="inline"></p:calendar>
			<h:outputLabel>Date To</h:outputLabel>
			<p:calendar value="#{refundBean.searchParamVO.toDate}" id="idToDate" pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" display="inline"></p:calendar>
			<h:outputLabel for="idBankSearch">Bank Account</h:outputLabel>
			<h:selectOneMenu id="idBankSearch" label="Bank Account" value="#{refundBean.searchParamVO.obj1}">
				<f:selectItem itemLabel="All" itemValue="SEARCH_ALL_BANKS"/>
				<f:selectItems value="#{refundBean.bankAcctViewList}" var="bankVO" itemLabel="#{bankVO.name}" itemValue="#{bankVO.id}"/>
			</h:selectOneMenu>
			<h:outputLabel>Refund Number</h:outputLabel><h:outputText value="#{refundBean.prefixValue}"/>
			<p:inputText value="#{refundBean.searchParamVO.obj3}"/>
			<p:commandButton value="Search" actionListener="#{refundBean.search}" oncomplete="varRefundList.clearFilters(); setEnterKeyHint();" update="@form"/>
			<p:commandButton value="All Dates" actionListener="#{refundBean.searchAll}" oncomplete="varRefundList.clearFilters(); setEnterKeyHint();" update="@form"/>
		</h:panelGrid>
		
		<h:panelGrid columns="3" style="margin-bottom:10px;width:400px">  
				<p:commandButton id="idPayment" 
				value="Add Refund" 
				oncomplete="varAddRefundDialog.show()" actionListener="#{refundBean.onAddRefund}" 
				update=":idAddRefundDialog,:idAddRefund:idBankAcct"/>
				<p:commandButton value="#{msg['common.button.label.print']} [PDF]" icon="ui-icon-print"
						actionListener="#{refundBean.printRefundReport('PDF')}" ajax="false" rendered="#{not empty refundBean.cashBookRefundList}"/>
				<p:commandButton value="#{msg['common.button.label.print']} [Excel]" icon="ui-icon-print"
						actionListener="#{refundBean.printRefundReport('XLS')}" ajax="false" rendered="#{not empty refundBean.cashBookRefundList}"/>
		</h:panelGrid>
		
		<p:dataTable id="idPaymentTable" value="#{refundBean.cashBookRefundList}" widgetVar="varRefundList"
				var="cashBookVO" filteredValue="#{refundBean.filteredObjList}" scrollRows="20" scrollable="true" liveScroll="true" scrollHeight="500" filterEvent="enter">
				<p:column headerText="Print" width="60" style="text-align:center; ">
					<p:commandButton icon="ui-icon-print" value="RF" actionListener="#{refundBean.printRF(cashBookVO)}" process="@this" ajax="false" />
					
				</p:column>
				   <p:column headerText="Edit" width="30" style="text-align:center">
					<p:commandButton icon="ui-icon-pencil" 
						update="@form,:idEditRefundDialog"
						actionListener="#{refundBean.onRefundSelected(cashBookVO)}"
						oncomplete="varEditRefundDialog.show()"/>
				</p:column>
				
				<p:column headerText="Delete" width="30" style="text-align:center">
					<p:commandButton icon="ui-icon-close" 
						actionListener="#{refundBean.onRefundSelected(cashBookVO)}"
						oncomplete="varDelPaymentDialog.show()" disabled="#{not refundBean.invPmntAuthVO.pmntDel}"/>
				</p:column>
			  
			  	<p:column sortBy="#{cashBookVO.bankName}" filterBy="#{cashBookVO.bankName}" filterMatchMode="contains" headerText="Bank Account" width="120">
					<h:outputText value="#{cashBookVO.bankName}"/>
				</p:column>
			   <p:column sortBy="#{cashBookVO.longSysNo}" filterBy="#{cashBookVO.longSysNo}" filterMatchMode="contains" headerText="Refund Number" width="120">
					  <h:outputText value="#{refundBean.prefixValue}-#{cashBookVO.longSysNo}"/>
					  </p:column>
				<p:column filterBy="#{refundBean.dateFormat(cashBookVO.dtTrans, 'dd-MMM-yyyy')}" filterMatchMode="contains" headerText="Refund Date" width="120">
					  <h:outputText value="#{cashBookVO.dtTrans}"><f:convertDateTime pattern="dd-MMM-yyyy"/></h:outputText>
				</p:column>
				<p:column filterBy="#{cashBookVO.payee}" filterMatchMode="contains" headerText="Pay To" width="200">
					  <h:outputText value="#{cashBookVO.payee}"/>
				</p:column>
				<p:column filterBy="#{cashBookVO.tourCd}" filterMatchMode="contains" headerText="Tour Code" width="200">
					  <h:outputText value="#{cashBookVO.tourCd}"/>
				</p:column>
				<p:column filterBy="#{cashBookVO.credit}" filterMatchMode="contains" headerText="Amount" width="120">
					  <h:outputText value="#{cashBookVO.credit}"><f:convertNumber pattern="#,##0.00"/></h:outputText>
				</p:column>
				<p:column filterBy="#{cashBookVO.refNo}" filterMatchMode="contains" headerText="Cheque No" width="120">
					  <h:outputText value="#{cashBookVO.refNo}"/>
				</p:column>
				<p:column filterBy="#{cashBookVO.remarks}" filterMatchMode="contains" headerText="Memo" width="200" style="word-wrap:break-word;">
					  <h:outputText value="#{cashBookVO.remarks}"/>
				</p:column>
			</p:dataTable>
		
		<h:panelGrid columns="2" style="margin-bottom:10px;width:200px">  
			<p:commandButton id="idPayment1" 
				value="Add Refund" 
				onclick="varAddRefundDialog.show()" actionListener="#{refundBean.onAddRefund}"
				update=":idAddRefundDialog,:idAddRefund:idBankAcct"/>
		</h:panelGrid>	
	</h:form>		
</p:panel>

	<h:form id="idAddAccount">
	<p:dataTable id="idAddAcctTable" widgetVar="varAddAcctTable" value="#{refundBean.acctViewList}" var="vo" paginator="true" rows="20" 
		paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
		rowsPerPageTemplate="10, 20, 30" rowKey="#{vo.id}" selectionMode="single" filterEvent="enter">
		<p:ajax event="rowSelect" listener="#{refundBean.handleAcctSelect}" 
			update=":idAddAcctTrans:idAcct,:idAddAcctTrans:idAddDescription,:idAddAccount:idAddAcctTable" 
			oncomplete="varAcctListDialog.hide(),varAddAcctTable.clearFilters()"/>
		
		<p:column headerText="Account" sortBy="#{vo.code}-#{vo.subCode}" filterBy="#{vo.code}-#{vo.subCode}" filterMatchMode="contains">
			<h:outputText value="#{vo.code}" rendered="#{empty vo.subCode}"/>

		</p:column>
		<p:column headerText="Description" sortBy="#{vo.desc}, #{vo.subDesc}" filterBy="#{vo.desc}, #{vo.subDesc}" filterMatchMode="contains">
			<h:outputText value="#{vo.desc}" rendered="#{empty vo.subDesc}"/>

		</p:column>
	</p:dataTable>
	</h:form>

<p:dialog id="idInvTransDialog" header="Invoice Payment List" widgetVar="varInvTransDialog" modal="true"
	resizable="false" dynamic="true" draggable="true" 
	hideEffect="fade" showEffect="fade" closable="true">
	<h:form id="idInvListForm">
	<p:growl id="msg"/>
	<p:dataTable id="idInvListTable" widgetVar="varInvListTable" value="#{refundBean.invPaymentList}" var="vo" paginator="true" rows="20" 
		paginatorTemplate="#{bterp:pageTemplate()}" 
		rowsPerPageTemplate="10, 20, 30" rowKey="#{vo.id}" selectionMode="single" filteredValue="#{refundBean.filteredObjList}" filterEvent="enter">
	  	<p:ajax event="rowSelect" listener="#{refundBean.handleInvSelect}" update="@form,:idAddRefund:idShowInv,:idEditRefund:idShowInv" oncomplete="varInvTransDialog.hide()"/>
		<p:column headerText="Document No" sortBy="#{vo.invoiceDocTypeCd eq 'P' ? vo.psNo : vo.invoiceNo}" filterBy="#{vo.invoiceDocTypeCd eq 'P' ? vo.psNo : vo.invoiceNo}" filterMatchMode="contains">
			<h:outputText rendered="#{vo.invoiceDocTypeCd eq 'I'}" value="#{bterp:sysNumGenVO(sessionInfoBean.companyVO.id, 'invc').prefixid} #{vo.invoiceNo}"  />
			<h:outputText rendered="#{vo.invoiceDocTypeCd eq 'P'}" value="#{bterp:sysNumGenVO(sessionInfoBean.companyVO.id, 'pax_statement').prefixid} #{vo.psNo}"  />
		</p:column>
		<p:column headerText="Tour Code" sortBy="#{vo.tourCode}" filterBy="#{vo.tourCode}" filterMatchMode="contains">
			<h:outputText value="#{vo.tourCode}"/>  
		</p:column>
		<p:column headerText="Date" sortBy="#{vo.pmntDt}" filterBy="#{refundBean.dateFormat(vo.pmntDt, config['date.display.pattern'])})" filterMatchMode="contains">
				<h:outputText value="#{vo.pmntDt}">
				<f:convertDateTime pattern="#{config['date.display.pattern']}" />
				</h:outputText>
		</p:column>
		<p:column headerText="Payment Type" sortBy="#{bterp:lookupItemDesc('pymt_type', vo.pmntTypeCd)}" filterBy="#{bterp:lookupItemDesc('pymt_type', vo.pmntTypeCd)}" filterMatchMode="contains">
			<h:outputText value="#{bterp:lookupItemDesc('pymt_type', vo.pmntTypeCd)}"/>  
		</p:column>
		<p:column headerText="Reference No" sortBy="#{vo.refNo}" filterBy="#{vo.refNo}" filterMatchMode="contains">
			<h:outputText value="#{vo.refNo}" /> 
		</p:column>
		<p:column headerText="Received From" sortBy="#{vo.recievedFr}" filterBy="#{vo.recievedFr}" filterMatchMode="contains">
			<h:outputText value="#{vo.recievedFr}" /> 
		</p:column>
		<p:column headerText="Amount" sortBy="#{vo.amount}" filterBy="#{vo.amount}" filterMatchMode="contains">
			<h:outputText value="#{vo.amount}" /> 
		</p:column>
	</p:dataTable>
	</h:form> 
</p:dialog>

<p:dialog id="idTourCodeList" widgetVar="varTourCodeList" modal="true" resizable="false" dynamic="true" draggable="true" closable="true">

	</div>
</p:dialog>
