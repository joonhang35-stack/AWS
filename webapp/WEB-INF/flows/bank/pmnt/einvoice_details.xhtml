<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:zsg="http://www.bcs.com/zsg/jsf"
	xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

	<p:growl id="msg" />

	<script type="text/javascript">
		function onValidation(xhr, status, args) {
			if (args.validationFailed) {
				varEInvoiceDialog.show();
			} else {
				varEInvoiceDialog.hide();
			}
		}
	</script>

	<style>
.custom-scroll-panel {
	overflow: auto;
}

.light-yellow {
	background: #fbf7df !important;
}

input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button
	{
	-webkit-appearance: none;
	margin: 0;
}
</style>

	<p:panelGrid>
		<p:row>
			<p:column>Document UUID</p:column>
			<p:column>
				<p:outputLabel value="#{paymentBean.cashBookVO.eInvoiceDocumentUuid}"></p:outputLabel>
			</p:column>
		</p:row>
		<p:row>
			<p:column>Submission ID</p:column>
			<p:column>
				<p:outputLabel value="#{paymentBean.cashBookVO.eInvoiceSubmissionUid}"></p:outputLabel>
			</p:column>
		</p:row>
		<p:row>
			<p:column>Status</p:column>
			<p:column>
				<p:outputLabel value="#{paymentBean.cashBookVO.eInvoiceStatus}"></p:outputLabel>
			</p:column>
		</p:row>
		<p:row rendered="#{paymentBean.cashBookVO.eInvoiceStatus eq 'Invalid'}">
			<p:column>Error</p:column>
			<p:column>
				<p:panelGrid>
					<c:forEach
						items="#{paymentBean.cashBookVO.eInvoiceDocument.validationResults.validationSteps}"
						var="step">
						<p:row rendered="#{step.status eq 'Invalid'}">
							<p:column style="padding-left: 0; text-decoration: underline;">
								<p:outputLabel>#{step.name}</p:outputLabel>
							</p:column>
						</p:row>
						<c:forEach items="#{step.error.innerError}" var="innerErr">
							<p:row>
								<p:column style="padding-left: 0; max-width: 200px">#{innerErr.error}</p:column>
							</p:row>
						</c:forEach>
					</c:forEach>
				</p:panelGrid>
			</p:column>
		</p:row>
		<p:row rendered="#{paymentBean.cashBookVO.eInvoiceDocument ne null}">
			<p:column colspan="2">
				Copy validation link <p:commandLink id="idCopyButton"
					onclick="navigator.clipboard.writeText('#{paymentBean.cashBookVO.eInvoiceValidationLink}');"
					update="@form" styleClass="ui-icon ui-icon-copy" global="false" style="display: inline-block;"
					process="@this">
				</p:commandLink>
				<p:tooltip for="idCopyButton">Click to Copy</p:tooltip>
			</p:column>
		</p:row>
		<p:row rendered="#{not empty paymentBean.cashBookVO.eInvoiceErr}">
			<p:column>Error</p:column>
			<p:column>
				<p:outputLabel value="#{paymentBean.cashBookVO.eInvoiceErr}" rendered="#{not empty paymentBean.cashBookVO.eInvoiceErr}"></p:outputLabel>
			</p:column>
		</p:row>
		<!-- <p:row rendered="#{billPymtBean.qrCodeStream ne null}">
			<p:column>
				<p:graphicImage value="#{billPymtBean.qrCodeStream}" />
			</p:column>
		</p:row> -->
	</p:panelGrid>

	<!-- <h:panelGrid columns="2" style="width: 1px; margin-top: 15px" rendered="#{billPymtBean.invPmntAuthVO.eInvoice}"> -->
	<h:panelGrid columns="2" style="width: 1px; margin-top: 15px">
		<p:commandButton styleClass="nowrap" value="Submit Document" style="width: 140px;"
			actionListener="#{paymentBean.submitEInvoice}" process="@this"
			update=":idEInvoiceForm :idAddPayment"
			disabled="#{paymentBean.cashBookVO.eInvoiceStatus eq 'Valid' or paymentBean.cashBookVO.eInvoiceStatus eq 'Submitted'}" />
		<p:commandButton styleClass="nowrap" value="Cancel Document" style="width: 140px;"
			actionListener="#{paymentBean.onCancelEInvoice}" process="@this"
			update=":idCancelEInvoiceDialog :idEInvoiceForm:msg"
			disabled="#{paymentBean.cashBookVO.eInvoiceStatus eq 'Cancelled' or paymentBean.cashBookVO.eInvoiceStatus eq 'Submitted' or paymentBean.cashBookVO.eInvoiceStatus eq 'Not Submitted'}"
			oncomplete="varCancelEInvoiceDialog.show()"/>
		<p:commandButton styleClass="nowrap" value="Refresh Status" style="width: 140px;"
			actionListener="#{paymentBean.getEInvoiceDocStatus}" process="@this"
			disabled="#{paymentBean.cashBookVO.eInvoiceStatus eq 'Not Submitted'}"
			update=":idEInvoiceForm :idAddPayment" />
		<p:commandButton styleClass="nowrap" value="Print" ajax="false"
			actionListener="#{paymentBean.printEInvoice}" 
			disabled="#{paymentBean.cashBookVO.eInvoiceStatus ne 'Valid'}"
			style="width: 140px;" />
			
		<p:commandButton value="Close" style="margin-top: 20px;" oncomplete="varEInvoiceDialog.hide();" />
	</h:panelGrid>

</ui:composition>
