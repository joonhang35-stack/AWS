<ui:define name="content">
<style>
	.debit-background {
		background-color:#FFF8DC;
	}
	.credit-background {
		background-color:#E0FFFF;
	}
	
    .ui-datatable-scrollable .ui-datatable-scrollable-header {
        position: sticky !important;
        top: 0 !important;
        z-index: 1000 !important;
    }
    
    .ui-datatable-scrollable .ui-paginator-bottom {
	    table-layout: fixed;
    	display: table;
	    width: 100% !important;
	}

</style>
<script type="text/javascript">
	// When open the page, load all the input text box and set the keyboard next button to enter button
	document.addEventListener('DOMContentLoaded', function() {
		var filters = document.querySelectorAll('input.ui-inputtext');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    });
	
	// When open the page, load all the filter input text box in the datatable and set the keybaord next button to enter button
	document.addEventListener('DOMContentLoaded', function() {
        var filters = document.querySelectorAll('input.ui-column-filter');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    });
	
	// When press search button, need to rerun again for the keyboard enter setting to prevent getting back next button
	function setEnterKeyHint() {
        var filters = document.querySelectorAll('input.ui-inputtext');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
        filters = document.querySelectorAll('input.ui-column-filter');
        filters.forEach(function(filter) {
            filter.setAttribute('enterkeyhint', 'enter');
        });
    }
</script>
<p:panel header="Bank Adjustment">
   	<h:form id="idForm">
    	<p:growl id="msg"/>
    	<h:panelGrid columns="11" cellpadding="0" cellspacing="2" style="margin-bottom:10px; width:1250px">

			<h:outputLabel>Date To</h:outputLabel>
			<p:calendar value="#{bankAdjustmentBean.searchParamVO.toDate}" id="idToDate" pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" display="inline"></p:calendar>

			<h:outputLabel>Adjustment Number</h:outputLabel><h:outputText value="#{bankAdjustmentBean.prefixValue}"/>
			<p:inputText value="#{bankAdjustmentBean.searchParamVO.obj3}"/>
			<p:commandButton value="Search" actionListener="#{bankAdjustmentBean.search}" oncomplete="varAdjustList.clearFilters(); setEnterKeyHint();" update="@form"/>
			<p:commandButton value="All Dates" actionListener="#{bankAdjustmentBean.searchAll}" oncomplete="varAdjustList.clearFilters(); setEnterKeyHint();" update="@form"/>

		</h:panelGrid>

			rowsPerPageTemplate="20, 30, 50, 100, 300, 500, 1000, 1500" filterEvent="enter">

			
			<p:column headerText="Print" width="60" style="text-align:center; " rendered="#{bankAdjustmentBean.listingTableViewVO.verifyVisibility(1)}">
				<p:commandButton icon="ui-icon-print" value="PA" actionListener="#{bankAdjustmentBean.printPV(cashBookVO)}" process="@this" ajax="false" />
			</p:column>

			</p:column>

				  <h:outputText value="#{cashBookVO.dtTrans}"><f:convertDateTime pattern="dd-MMM-yyyy"/></h:outputText>
			</p:column>
			<!-- <p:column filterBy="#{cashBookVO.taxAmount}" filterMatchMode="contains" headerText="GST Amount" width="120">
				<h:outputText value="#{cashBookVO.taxAmount}">
				<f:convertNumber pattern="#,##0.00"/></h:outputText>
			</p:column> -->

				  <h:outputText value="#{cashBookVO.credit}"><f:convertNumber pattern="#,##0.00"/></h:outputText>
			</p:column>
			<p:column filterBy="#{cashBookVO.refNo}" filterMatchMode="contains" headerText="Cheque No" width="200" filterStyle="width:90%" rendered="#{bankAdjustmentBean.listingTableViewVO.verifyVisibility(10)}">
				  <h:outputText value="#{cashBookVO.refNo}"/>
			</p:column>
