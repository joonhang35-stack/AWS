<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<p:growl id="msg"/>
<p:panelGrid>
	<p:row>
		<p:column style="width:80px;"><h:outputText value="Account"/></p:column>
		<p:column>
			<h:outputText value="#{chartOfAcctBean.acctVO.code}" rendered="#{empty chartOfAcctBean.acctVO.subCode}"/>
			<h:outputText value="#{chartOfAcctBean.acctVO.code}-#{chartOfAcctBean.acctVO.subCode}" rendered="#{not empty chartOfAcctBean.acctVO.subCode}"/>
		</p:column>
	</p:row>
	<p:row>
		<p:column style="width:80px;"><h:outputText value="Description"/></p:column>
		<p:column>
			<h:outputText value="#{chartOfAcctBean.acctVO.desc}" rendered="#{empty chartOfAcctBean.acctVO.subDesc}"/>
			<h:outputText value="#{chartOfAcctBean.acctVO.desc}, #{chartOfAcctBean.acctVO.subDesc}" rendered="#{not empty chartOfAcctBean.acctVO.subDesc}"/>
		</p:column>
	</p:row>
</p:panelGrid>
<br/>
<p:fieldset legend="Begining Balance">
	<p:panelGrid id="idEditBeginBalField">
		<p:row>
			<p:column style="width:50px"><h:outputLabel>Debit<span class="required">*</span></h:outputLabel></p:column>
			<p:column style="width:150px">
				<p:inputText label="Debit" value="#{chartOfAcctBean.acctBalVO.debitBeginBal}" style="width:130px" rendered="#{chartOfAcctBean.option ne -1 and not chartOfAcctBean.isClosedAcct}">
					<!--f:convertNumber maxFractionDigits="2" groupingUsed="true" type="number"/-->
					<f:convertNumber type="number" pattern="#,##0.00"/>
					<p:ajax listener="#{chartOfAcctBean.handleDebitCreditInput}" event="blur" update="idEditBeginBalField"/>
				</p:inputText>
				<p:inputText label="Debit" value="#{chartOfAcctBean.acctBalVO.debitBeginBal}" style="width:130px" disabled="true" rendered="#{chartOfAcctBean.option eq -1 or chartOfAcctBean.isClosedAcct}">
					<f:convertNumber type="number" pattern="#,##0.00"/>
				</p:inputText>
			</p:column>
			<p:column style="width:50px"><h:outputLabel>Credit<span class="required">*</span></h:outputLabel></p:column>
			<p:column>
				<p:inputText label="Credit" value="#{chartOfAcctBean.acctBalVO.creditBeginBal}" style="width:130px" rendered="#{chartOfAcctBean.option ne 1 and not chartOfAcctBean.isClosedAcct}">
					<!-- f:convertNumber maxFractionDigits="2" groupingUsed="true" type="number"/-->
					<f:convertNumber type="number" pattern="#,##0.00"/>
					<p:ajax listener="#{chartOfAcctBean.handleDebitCreditInput}" event="blur" update="idEditBeginBalField"/>
				</p:inputText>
				<p:inputText label="Credit" value="#{chartOfAcctBean.acctBalVO.creditBeginBal}" style="width:130px" disabled="true" rendered="#{chartOfAcctBean.option eq 1 or chartOfAcctBean.isClosedAcct}">
					<f:convertNumber type="number" pattern="#,##0.00"/>
				</p:inputText>
			</p:column>
		</p:row>
	</p:panelGrid>
</p:fieldset>

<h:panelGrid columns="2" style="width: 1px;">
	<p:commandButton value="#{msg['common.button.label.update']}" actionListener="#{chartOfAcctBean.updBeginBal}" update="@form,:idBeginBalForm,:idChartOfAcctForm" oncomplete="varEditBeginBalDialog.hide()"
	rendered="#{not chartOfAcctBean.isClosedAcct}"/>
	<p:commandButton value="#{msg['common.button.label.cancel']}" actionListener="#{chartOfAcctBean.resetForm}" onclick="varEditBeginBalDialog.hide()" process="@this" update="@form">
		<pe:resetEditableValues for="idEditBeginBalForm"/>
	</p:commandButton>
</h:panelGrid>
</ui:composition>
