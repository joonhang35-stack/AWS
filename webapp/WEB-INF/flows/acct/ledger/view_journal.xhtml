<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">

		<p:dataTable id="idJournalTable" value="#{glBean.generalLedgerTransList}" var="vo" paginator="true" rows="20" 
			paginatorTemplate="#{bterp:pageTemplate()}" 
			rowsPerPageTemplate="5, 10, 15" >
			
			<f:facet name="header">
				<h:outputFormat value="GL ID: #{glBean.generalLedgerTransList.get(0).sysNo}"/>
			</f:facet>
			
			<p:column headerText="Date" sortBy="#{vo.transDt}" styleClass="txt_center" filterBy="#{vo.transDt}">  
				<h:outputText value="#{vo.transDt}"><f:convertDateTime pattern="#{config['date.display.pattern']}"/></h:outputText>  
			</p:column>
			<p:column headerText="Acct/Sub" sortBy="#{vo.acctViewVO.code}" filterBy="#{vo.acctViewVO.code}" style="width:100px;">
				<h:outputText value="#{vo.acctViewVO.code}#{(not empty vo.acctViewVO.subCode ? '-' : '')}#{vo.acctViewVO.subCode}" />
			</p:column> 
			<p:column headerText="Acct/Sub Description" sortBy="#{vo.acctViewVO.desc}" filterBy="#{vo.acctViewVO.desc}" style="width:200px;">  
				<h:outputText value="#{vo.acctViewVO.desc}#{(not empty vo.acctViewVO.subDesc ? ', ' : '')}#{vo.acctViewVO.subDesc}" />
			</p:column>
			<p:column headerText="Source" sortBy="#{vo.source}" filterBy="#{vo.source}" style="width:200px;">  
				<h:outputText value="#{vo.source}" />  
			</p:column>
			<p:column headerText="Operation" sortBy="#{vo.destination}" filterBy="#{vo.destination}" style="width:200px;">  
				<h:outputText value="#{vo.destination}" />  
			</p:column>
			<p:column headerText="Tax Code" sortBy="#{vo.taxCode}" filterBy="#{vo.taxCode}">
	            <h:outputText value="#{vo.taxCode}"/>
	        </p:column>
			<p:column headerText="Debit Amount" sortBy="#{vo.debit}" styleClass="txt_center" filterBy="#{vo.debit}">  
				<h:outputText value="#{vo.debit}"><f:convertNumber pattern="#{config['amount.format.pattern']}"/></h:outputText>
			</p:column>
			<p:column headerText="Credit Amount" sortBy="#{vo.credit}" styleClass="txt_center" filterBy="#{vo.credit}">  
				<h:outputText value="#{vo.credit}"><f:convertNumber pattern="#{config['amount.format.pattern']}"/></h:outputText>
			</p:column>
			<p:columnGroup type="footer">  
				<p:row>  
					<p:column footerText="Totals:" colspan="6" style="text-align:right"/>
					<p:column footerText="#{glBean.getDoubleDecimalFormat(config['amount.format.pattern'], glBean.generalLedgerTransList.get(0).totDebit)}"/>
					<p:column footerText="#{glBean.getDoubleDecimalFormat(config['amount.format.pattern'], glBean.generalLedgerTransList.get(0).totCredit)}"/>
				</p:row>  
			</p:columnGroup>
		</p:dataTable>
		<h:panelGrid columns="2" style="width:1px;">
			<p:commandButton value="#{msg['common.button.label.print']}" icon="ui-icon-print" type="button">
				<p:printer target="idJournalTable"/>
			</p:commandButton>
			<p:commandButton value="#{msg['common.button.label.cancel']}" onclick="varJournalListDialog.hide()"/>
		</h:panelGrid>
	
</ui:composition>
