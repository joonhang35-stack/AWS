<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"

	xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

	<p:growl id="msg" />

	<script type="text/javascript">
		function onValidation(xhr, status, args) {
			if (args.validationFailed) {
				varMultipleEInvSubmitRespDialog.show();
			} else {
				varMultipleEInvSubmitRespDialog.hide();
			}
		}
	</script>

	<p:dataTable id="idResultListTable" value="#{salesBean.mulpInvSubmRespList}" var="vo"
		rows="20" paginator="true"
		paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}"
		rowsPerPageTemplate="20, 30, 50" filterEvent="enter"
		rowKey="#{vo.id}">
		
		<p:column>
			<f:facet name="header">
				<h:outputText value="Code" />
			</f:facet>
			<h:outputText value="#{vo.prefix} #{vo.code}"></h:outputText>
		</p:column>
		<p:column>
			<f:facet name="header">
				<h:outputText value="Document No." />
			</f:facet>
			<h:outputText
				rendered="#{vo.cnInvNo ne null and vo.cnPsNo eq null}"
				value="#{salesBean.invPrefixVal} #{vo.cnInvNo}" />
			<h:outputText
				rendered="#{vo.cnInvNo ne null and vo.cnPsNo ne null}"
				value="#{salesBean.invPrefixVal} #{vo.cnInvNo} / #{salesBean.psPrefixVal} #{vo.cnPsNo}" />
			<h:outputText
				rendered="#{vo.cnInvNo eq null and vo.cnPsNo ne null}"
				value="#{salesBean.psPrefixVal} #{vo.cnPsNo}" />
		</p:column>
		<p:column>
			<f:facet name="header">
				<h:outputText value="Tour Code" />
			</f:facet>
			<h:outputText value="#{vo.tourCd}"></h:outputText>
		</p:column>
		<p:column>
			<f:facet name="header">
				<h:outputText value="Departure Date" />
			</f:facet>
			<h:outputText value="#{vo.departureDt}">
				<f:convertDateTime pattern="dd-MMM-yyyy" />
			</h:outputText>
		</p:column>
		<p:column headerText="Status">
			<f:facet name="header">
				<h:outputText value="Status" />
			</f:facet>
			<h:outputText value="#{vo.eInvoiceDocument.status}"></h:outputText>
		</p:column>
		<p:column headerText="Reason">
			<f:facet name="header">
				<h:outputText value="Reason" />
			</f:facet>
			<h:outputText value="#{vo.eInvoiceDocument.documentStatusReason}"></h:outputText>
		</p:column>
		<p:column headerText="Sales Person">
			<f:facet name="header">
				<h:outputText value="Sales Person" />
			</f:facet>
			<h:outputText value="#{vo.salerName}"></h:outputText>
		</p:column>
		<p:column>
			<f:facet name="header">
				<h:outputText value="Action By" />
			</f:facet>
			<h:outputText value="#{vo.createdBy}"/>
		</p:column>
		<p:column>
			<f:facet name="header">
				<h:outputText value="Action Date" />
			</f:facet>
			<h:outputText value="#{vo.createdDate}">
				<f:convertDateTime pattern="dd-MMM-yyyy HH:mm:ss" />
			</h:outputText>
		</p:column>
		
		<!-- <p:column headerText="Code">

		</p:column>

			<h:outputText value="#{vo.amount}"></h:outputText>
		</p:column> -->
	</p:dataTable>
	
	<br/><br/>
	<h:commandLink>
		<p:graphicImage value="/img/excel.png" />
		<p:dataExporter type="csv" target="idResultListTable" exportHeader="true"
			fileName="#{salesBean.generateReportFileName('Credit_Note_E_Invoice_Submission_List')}"/>
	</h:commandLink>
