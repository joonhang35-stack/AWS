<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">
	  			
<p:growl id="msg"/>
<div style="height:500px;overflow:auto;">
	<p:panelGrid id="idSupplierDetail">
<!-- 	<p:row>
			<p:column style="width:150px;">
				<h:outputLabel for="idSuppType">Supplier Type <span class="required">*</span></h:outputLabel>
			</p:column>
			<p:column>
				<h:selectOneMenu id="idSuppType" label="Supplier Type  Type" value="#{billPymtBean.supplierVO.code}" required="true"> 
		            <f:selectItem itemLabel="Individual" itemValue="P"/> 
		            <f:selectItem itemLabel="Corporate" itemValue="C"/>
		            <p:ajax event="change" update="idSupplierDetail"/>
	        	</h:selectOneMenu> 
	        </p:column>
		</p:row> -->	
		
		<p:row>
		<p:column><h:outputLabel for="idAddTypeVen">Type of Vendor <span class="required">*</span></h:outputLabel></p:column>
		<p:column colspan="3">
		<h:selectOneMenu id="idAddTypeVen" label="Type of Vendor" value="#{billPymtBean.supplierVO.supplierType}" required="true">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Trade Creditors" itemValue="TC" /> 
            <f:selectItem itemLabel="Sundry Creditors" itemValue="SC" />
        </h:selectOneMenu> 
        </p:column>
		</p:row>
		
		<p:row rendered="#{billPymtBean.supplierVO.code == 'C'}">
			<p:column><h:outputLabel for="idAddCompName">Company Name <span class="required">*</span></h:outputLabel></p:column>
			<p:column colspan="3">
			<p:autoComplete id="idAddCompName" label="Company Name" value="#{billPymtBean.supplierVO.companyName}" completeMethod="#{billPymtBean.loadCorpList}" required="true" size="50"/>
			</p:column>
		</p:row>
		
		<p:row>
			<p:column><h:outputLabel for="idAddDesignation">Designation </h:outputLabel></p:column>
			<p:column colspan="3">
			<p:inputText id="idAddDesignation" label="Designation" value="#{purchaseBean.supplierVO.designation}" size="50"/>
			</p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddSalutate">Salutation <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
		<h:selectOneMenu id="idAddSalutate" label="Salutation" value="#{billPymtBean.supplierVO.salutation}" required="true">  
            <f:selectItems value="#{bterp:lookupItemList('salutatn')}" var="vo" itemValue="#{vo.code}" itemLabel="#{vo.description}"/>
        </h:selectOneMenu>
        </p:column>
        <p:column><h:outputLabel for="idAddLastName">Last Name <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idAddLastName" label="Last Name" value="#{billPymtBean.supplierVO.lastName}" required="true"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddGivenName">Given Name <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idAddGivenName" label="Given Name" value="#{billPymtBean.supplierVO.givenName}" required="true"/></p:column>
		</p:row>
		
		<p:row rendered="#{billPymtBean.supplierVO.code != 'C'}">
			<p:column><p:commandButton value="Add ID" actionListener="#{billPymtBean.resetIdentityForm}" oncomplete="varIDDialog.show()" immediate="true" /><span class="required">*</span></p:column>
			<p:column colspan="3">
			<p:panel id ="idShowID" style="border:none">
				<p:dataTable id="idShowIDList" value="#{billPymtBean.supplierVO.identityList}" var="identityVO" rowKey="#{identityVO.idNo}" selectionMode="single" style="width:250px" rendered="#{not empty billPymtBean.supplierVO.identityList}">
		
					<p:column headerText="Edit" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-pencil" actionListener="#{billPymtBean.onIdentitySelected(identityVO)}" oncomplete="varEditIDDialog.show()" process="@this" update=":idEditIDDialog"/>
					</p:column>
					<p:column headerText="Delete" style="width:50px; text-align:center;">
						<p:commandButton icon="ui-icon-close" actionListener="#{billPymtBean.delIdentityList(identityVO)}" update=":idIDDialog,:idEditIDDialog,:idAddSupplierForm:idShowID" process="@this"/>
					</p:column>
					<p:column headerText="ID Type">
						<h:outputText value="#{bterp:lookupItemDesc('id_type', identityVO.idType)}"/>
					</p:column>
					<p:column headerText="ID No">
						<h:outputText value="#{identityVO.idNo}"/>
					</p:column>
					
				</p:dataTable>
				</p:panel>
			</p:column>
		</p:row>
		
 		<p:row>
			<p:column><p:commandButton value="Add Contact" onclick="varContactDialog.show()" immediate="true"/></p:column>
			<p:column colspan="3">
			<p:panel id ="idShowContact" style="border:none">
				<p:dataTable id="idShowContactList" value="#{billPymtBean.supplierVO.contactList}" var="contactVO" rowKey="#{contactVO.contactNo}" selectionMode="single" style="width:250px" rendered="#{not empty billPymtBean.supplierVO.contactList}">
				
					<p:column headerText="Edit" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-pencil" actionListener="#{billPymtBean.onContactSelected(contactVO)}" oncomplete="varEditContactDialog.show()" process="@this" update=":idEditContactDialog"/>
					</p:column>
					<p:column headerText="Delete" style="width:50px; text-align:center;">
						<p:commandButton icon="ui-icon-close" actionListener="#{billPymtBean.delContactList(contactVO)}" update="@form,:idContactDialog,:idEditContactDialog,:idAddSupplierForm:idShowContact" process="@this"/>
					</p:column>
					<p:column headerText="Contact Type">
						<h:outputText value="#{bterp:lookupItemDesc('cntc_type', contactVO.contactType)}"/>
					</p:column>
					<p:column headerText="Contact No">
						<h:outputText value="#{contactVO.contactNo}"/>
					</p:column>
					
				</p:dataTable>
			</p:panel>
			</p:column>
		</p:row>

		<p:row rendered="#{billPymtBean.supplierVO.code == 'C'}">
			<p:column><h:outputLabel for="idAddCEmail">Email </h:outputLabel></p:column>
			<p:column><p:inputText id="idAddCEmail" label="Email ID" value="#{billPymtBean.supplierVO.email}" /></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddAdd1">Address Line 1 <span class="required">*</span></h:outputLabel></p:column>
		<p:column colspan="3"><p:inputText id="idAddAdd1" label="Address Line 1" value="#{billPymtBean.supplierVO.add1}" size="50" required="true"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddAdd2">Address Line 2 </h:outputLabel></p:column>
		<p:column colspan="3"><p:inputText id="idAddAdd2" label="Street" value="#{billPymtBean.supplierVO.add2}" size="50"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddAdd3">Address Line 3 </h:outputLabel></p:column>
		<p:column colspan="3"><p:inputText id="idAddAdd3" label="Street" value="#{billPymtBean.supplierVO.add3}" size="50"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddCity">City </h:outputLabel></p:column>
		<p:column><p:inputText id="idAddCity" label="City" value="#{billPymtBean.supplierVO.city}" /></p:column>
		
		<p:column><h:outputLabel for="idAddState">State/ Province </h:outputLabel></p:column>
		<p:column><p:inputText id="idAddState" label="State/ Province" value="#{billPymtBean.supplierVO.state}" /></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddPostcode">Postcode </h:outputLabel></p:column>
		<p:column><p:inputText id="idAddPostcode" label="Postcode" value="#{billPymtBean.supplierVO.postcode}" /></p:column>
		
		<p:column><h:outputLabel for="idAddCountry">Country <span class="required">*</span></h:outputLabel></p:column>
		<p:column><h:selectOneMenu id="idAddCountry" value="#{billPymtBean.supplierVO.countryId}" required="true">  
                <f:selectItems value="#{billPymtBean.countryList}" var="vo" itemLabel="#{vo.country}" itemValue="#{vo.id}" />  
            </h:selectOneMenu>  
        </p:column>
		</p:row>
		
		<p:row  rendered="#{billPymtBean.supplierVO.code != 'C'}">
		<p:column><h:outputLabel for="idAddEmail">Email </h:outputLabel></p:column>
		<p:column><p:inputText id="idAddEmail" label="Email ID" value="#{billPymtBean.supplierVO.email}" /></p:column>
		</p:row>
		
		<p:row>
			<p:column><p:commandButton value="Add Remarks" onclick="varRemarksDialog.show()" immediate="true"/></p:column>
			<p:column colspan="3">
			<p:panel id ="idShowRemarks" style="border:none">
				<p:dataTable id="idShowRemarksList" value="#{billPymtBean.supplierVO.remarksList}" var="remarksVO" rowKey="#{remarksVO.strTimestamp}" selectionMode="single" style="width:250px" rendered="#{not empty billPymtBean.supplierVO.remarksList}">
				
					<p:column headerText="Edit" style="width:50px; text-align:center;">
					<p:commandButton icon="ui-icon-pencil" actionListener="#{billPymtBean.onRemarksSelected(remarksVO)}" oncomplete="varEditRemarksDialog.show()" process="@this" update=":idEditRemarksDialog"/>
					</p:column>
					<p:column headerText="Delete" style="width:50px; text-align:center;">
						<p:commandButton icon="ui-icon-close" actionListener="#{billPymtBean.delRemarksList(remarksVO)}" update="@form,:idRemarksDialog,:idEditRemarksDialog,:idAddSupplierForm:idShowRemarksList" process="@this"/>
					</p:column>
					<p:column headerText="Remarks Details">
						<h:outputText value="#{remarksVO.remarksDetails}"/>
					</p:column>
					<p:column headerText="Time Stamp" style="width:200px; text-align:center;">
						<h:outputText value="#{remarksVO.strTimestamp}"/>
					</p:column>
					
				</p:dataTable>
			</p:panel>
			</p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddAccName">Bank Account Name </h:outputLabel></p:column>
		<p:column><p:inputText id="idAddAccName" label="Bank Account Name" value="#{billPymtBean.supplierVO.bankName}" /></p:column>

		<p:column><h:outputLabel for="idAddAccNo">Account Number </h:outputLabel></p:column>
		<p:column><p:inputText id="idAddAccNo" label="Account Number" value="#{billPymtBean.supplierVO.accountNo}" /></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddPymtTerms">Payment Terms </h:outputLabel></p:column>
		<p:column>
		<h:selectOneMenu id="idAddPymtTerms" value="#{billPymtBean.supplierVO.paymentTerm}">  
            <f:selectItems value="#{billPymtBean.pymtTermList}" var="vo" itemLabel="#{vo.description}" itemValue="#{vo.description}" />  
        </h:selectOneMenu>  
		</p:column>

		<p:column><h:outputLabel for="idAddCrdtLmt">Credit Limit </h:outputLabel></p:column>
		<p:column><p:inputText id="idAddCrdtLmt" label="Credit Limit" value="#{billPymtBean.supplierVO.creditLimit}">
				  <f:convertNumber pattern="#,##0.00"/>
				  </p:inputText>
		</p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idAddBenefiName">Beneficiary Name </h:outputLabel></p:column>
		<p:column><p:inputText id="idAddBenefiName" label="Beneficiary Name" value="#{purchaseBean.supplierVO.beneficiaryName}" /></p:column>
		</p:row>
		
	</p:panelGrid>
</div>
	<p:panelGrid columns="3" style="width: 1px;">
		<p:commandButton value="Save" actionListener="#{billPymtBean.addPersonalSuppl}" update="@form,:idAddFuncForm:idShowSuppName" process="@form"/>
		<p:commandButton value="Cancel" actionListener="#{billPymtBean.resetSupplierForm}" onclick="varSuppOptDialog.hide()" update="@form" process="@this" />
	</p:panelGrid>
</ui:composition>
