<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:zsg="http://www.bcs.com/zsg/jsf"
	template="/WEB-INF/views/layouts/main.xhtml"
	xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

	<ui:define name="content">
		<h:form id="idDocumentForm">
			<p:panel header="E-Invoice" toggleable="true" toggleSpeed="500">
				<p:panelGrid id="idSearchPanel" style="width:550px;">
					<p:row>
						<p:column style="width:100px;">
							<h:outputLabel>Submission Date</h:outputLabel>
						</p:column>
						<p:column style="width:10px;">
							<p:separator style="width:2px;height:20px" />
						</p:column>
						<p:column style="width:80px;">
							<p:calendar id="idInvoiceDateFr" label="Submission Date From"
								pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" />
							<p:watermark for="idInvoiceDateFr" value="Submission Date From" />
						</p:column>
						<p:column style="width:80px;">
							<p:calendar id="idInvoiceDateTo" label="Submission Date To"
								pattern="dd-MMM-yyyy" navigator="true" showButtonPanel="true" />
							<p:watermark for="idInvoiceDateTo" value="Submission Date To" />
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<p:commandButton value="Search"
								actionListener="#{salesBean.searchDocuments}" update="@form"></p:commandButton>
						</p:column>
					</p:row>
				</p:panelGrid>

				<!-- <p:panelGrid> -->
				<p:dataTable id="idDocumentTable" widgetVar="varDocumentTable"
					value="#{salesBean.eInvoiceDocumentList}" var="vo" paginator="true"
					rows="20" rowIndexVar="rowIndex"
					paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}"
					rowsPerPageTemplate="20, 30, 50" filterEvent="enter"
					rowKey="#{vo.uuid}">
					<p:column headerText="UUID">
						<h:outputText value="#{vo.uuid}"></h:outputText>
					</p:column>
					<p:column headerText="e-Invoice Code">
						<h:outputText value="#{vo.internalId}"></h:outputText>
					</p:column>
					<p:column headerText="Status">
						<h:outputText value="#{vo.status}"></h:outputText>
					</p:column>
					<p:column headerText="Date And Time Received">
						<h:outputText value="#{vo.dateTimeReceivedDt}">
							<f:convertDateTime pattern="dd-MMM-yyyy HH:mm:ss" />
						</h:outputText>
					</p:column>
					<p:column headerText="Issuance Date">
						<h:outputText value="#{vo.dateTimeIssuedDt}">
							<f:convertDateTime pattern="dd-MMM-yyyy HH:mm:ss" />
						</h:outputText>
					</p:column>
					<p:column headerText="Type">
						<h:outputText value="#{vo.typeName}"></h:outputText>
					</p:column>
				</p:dataTable>
				<!-- </p:panelGrid> -->
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
