<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:zsg="http://www.bcs.com/zsg/jsf"
	xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

	<p:growl id="msg" />
	<h:panelGrid columns="3" style="width:1px; margin-bottom: 4px">
		<p:commandButton value="Cancel" oncomplete="varRecentDocListDialog.hide()" process="@this" />
	</h:panelGrid>

	<p:dataTable id="idDocList" value="#{salesBean.apiDocumentQueryResponseVO.result}" paginator="true"
		rows="20" rowIndexVar="rowIndex"
		paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}"
		rowsPerPageTemplate="20, 30, 50, 100, 300, 500, 1000, 1500" filterEvent="enter"
		var="vo" rowKey="#{vo.uuid}">
		
		<p:column headerText="UUID" sortBy="#{vo.uuid}" filterBy="#{vo.uuid}" filterMatchMode="contains">
			<h:outputText value="#{vo.uuid}"></h:outputText>
		</p:column>
		<p:column headerText="Internal ID" sortBy="#{vo.internalId}" filterBy="#{vo.internalId}" filterMatchMode="contains">
			<h:outputText value="#{vo.internalId}"></h:outputText>
		</p:column>
		<p:column headerText="Total" sortBy="#{vo.total}" filterBy="#{vo.total}" filterMatchMode="contains">
			<h:outputText value="#{vo.total}"><f:convertNumber pattern="#,##0.00"/></h:outputText>
		</p:column>
		<p:column headerText="Status" sortBy="#{vo.status}" filterBy="#{vo.status}" filterMatchMode="contains">
			<h:outputText value="#{vo.status}"></h:outputText>
		</p:column>
		<p:column headerText="E-Invoice Document Type" sortBy="#{vo.typeName}" filterBy="#{vo.typeName}" filterMatchMode="contains">
			<h:outputText value="#{vo.typeName}"></h:outputText>
		</p:column>
		<p:column headerText="Time">
			<h:outputText value="#{vo.dateTimeReceived}">
				<f:convertDateTime pattern="dd-MMM-yyyy HH:mm:ss" />
			</h:outputText>
		</p:column>
	</p:dataTable>

	<h:panelGrid columns="3" style="width:1px; margin-top: 4px">
		<p:commandButton value="Cancel" oncomplete="varRecentDocListDialog.hide()" process="@this" />
	</h:panelGrid>

</ui:composition>
