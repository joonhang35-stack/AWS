<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:pe="http://primefaces.org/ui/extensions"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">
	  			
	<p:panelGrid>
		<p:row>
		<p:column><h:outputLabel for="idEditRemarksType">Remarks Details <span class="required">*</span></h:outputLabel></p:column>
		<p:column>
		<p:inputTextarea rows="10" cols="50" id="idEditRemarks" value="#{purchaseBean.remarksVO.remarksDetails}"></p:inputTextarea>
        </p:column>
		</p:row>
		
	</p:panelGrid>
	<p:panelGrid columns="3" style="width: 1px;">
		<p:commandButton value="#{msg['common.button.label.ok']}" actionListener="#{purchaseBean.editRemarks}" update="@form,:idAddSupplierForm:idShowRemarks,:idAddPCustomerForm,:idEditCSupplierForm:idShowRemarks,:idEditRemarksForm,:idEditPCustomerForm" oncomplete="varEditRemarksDialog.hide()" rendered="#{empty billPymtBean}"/>
		<p:commandButton value="#{msg['common.button.label.ok']}" actionListener="#{purchaseBean.editRemarks}" update="@form,:idAddSupplierForm:idShowRemarks,:idEditRemarksForm" oncomplete="varEditRemarksDialog.hide()" rendered="#{not empty billPymtBean}"/>
		<p:commandButton value="Cancel" actionListener="#{purchaseBean.resetRemarksForm}" onclick="varEditRemarksDialog.hide()" process="@this">
			<pe:resetEditableValues for="idAddSupplierForm"/>
		</p:commandButton>
	</p:panelGrid>
</ui:composition>
