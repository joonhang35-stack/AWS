<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf">
	<p:growl id="msg"/>
	<p:panelGrid>
	<!-- 
		<p:row>
		<p:column><h:outputLabel for="idEditNo">No </h:outputLabel></p:column>
		<p:column colspan="3"><p:inputText id="idEditNo" colspan="3" label="No" value="#{purchaseEOBean.airLineVO.airLineNo}" /></p:column>
		</p:row>
		 -->
		<p:row>
		<p:column><h:outputLabel for="idEditPoint">Sector <span class="required">*</span></h:outputLabel></p:column>
		<p:column colspan="3"><p:inputText id="idEditPoint" colspan="3" label="Sector" value="#{purchaseEOBean.airLineVO.point}" required="true"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idEditFlightNo">Flight No <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idEditFlightNo" label="Flight No" value="#{purchaseEOBean.airLineVO.flightNo}" required="true"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idEditDate">Date <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:calendar pattern="dd-MMM-yyyy" id="idEditDate" value="#{purchaseEOBean.airLineVO.airLineDt}" navigator="true" showButtonPanel="true" required="true"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idEditTime">Time <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idEditTime" label="Time" value="#{purchaseEOBean.airLineVO.time}" required="true"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idEditClass">Class <span class="required">*</span></h:outputLabel></p:column>
		<p:column colspan="3"><p:inputText id="idEditClass" label="Class" value="#{purchaseEOBean.airLineVO.airClass}" required="true"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idEditStatus">Status <span class="required">*</span></h:outputLabel></p:column>
		<p:column><p:inputText id="idEditStatus" label="Status" value="#{purchaseEOBean.airLineVO.status}" required="true"/></p:column>
		</p:row>
		
		<p:row>
		<p:column><h:outputLabel for="idEditPNR">PNR </h:outputLabel></p:column>
		<p:column colspan="3"><p:inputText id="idEditPNR" label="PNR" value="#{purchaseEOBean.airLineVO.airLinePnr}" maxlength="50"/></p:column>
		</p:row>
		
	</p:panelGrid>

	<p:panelGrid columns="3" style="width: 1px;">
		<p:commandButton value="#{msg['common.button.label.ok']}" actionListener="#{purchaseEOBean.editAirLine}" update="@form,:idEditExOrderForm:idTabExOrder:idShowAirLine,:idAddExOrderForm:idTabExOrder:idShowAirLine" oncomplete="varEditAirlineDialog.hide()"/>
		<p:commandButton value="Cancel" actionListener="#{purchaseEOBean.resetAirLineForm}" oncomplete="varEditAirlineDialog.hide()" process="@this" />
	</p:panelGrid>
</ui:composition>
