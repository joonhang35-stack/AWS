<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<p:scrollPanel mode="native" scrollMode="native" style="height:470px;">  
<p:dataTable value="#{historyBean.tourDepHistoryViewAllList}" var="vo" paginator="true" rows="20" 
	paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
	rowsPerPageTemplate="5, 10">
	
	<p:columnGroup type="header">
		<p:row>
			<p:column headerText="Update Date" rowspan="2" width="100"/>
			<p:column headerText="Update By" rowspan="2" width="120"/>
			<p:column headerText="Number Of" colspan="2"/>
			<p:column headerText="Departure" rowspan="2"/>
			<p:column headerText="Tour Code" rowspan="2"/>
			<p:column headerText="Desc" rowspan="2"/>
			<p:column headerText="Full Tour" colspan="5"/>
			<p:column headerText="Ground Only" colspan="5"/>
			<p:column headerText="Full Tour Remarks" rowspan="2"/>
			<p:column headerText="Ground Remarks" rowspan="2"/>
			<p:column headerText="Airline" rowspan="2"/>
			<p:column headerText="Is Show Airline" rowspan="2"/>
			<p:column headerText="PNR" rowspan="2"/>
			<p:column headerText="Seat Allotment" rowspan="2"/>
			<p:column headerText="Reserved Seat" rowspan="2"/>
			<p:column headerText="Tour Manager Pax" rowspan="2"/>
			<p:column headerText="TFair Discount" rowspan="2"/>
			<p:column headerText="Trvl Ins Policy(S)" rowspan="2"/>
			<p:column headerText="Issued(S)" rowspan="2"/>
			<p:column headerText="Trvl Ins Policy(F)" rowspan="2"/>
			<p:column headerText="Issued(F)" rowspan="2"/>
			<p:column headerText="Tour Status" rowspan="2"/>
			<p:column headerText="Deposit Paid" rowspan="2"/>
			<p:column headerText="Is Push" rowspan="2"/>
			<p:column headerText="Is Hot Deal" rowspan="2"/>
			<p:column headerText="Commision (RM)" colspan="3"/>
			<p:column headerText="Invoice Remarks" rowspan="2"/>
			<p:column headerText="Reason" rowspan="2"/>
			<p:column headerText="Action" rowspan="2" style="width:50px;"/>
		</p:row>
		<p:row>
			<p:column headerText="Days"/>
			<p:column headerText="Nights"/>
			<p:column headerText="TWN"/>
			<p:column headerText="SGL"/>
			<p:column headerText="CTW"/>
			<p:column headerText="CEB"/>
			<p:column headerText="CNB"/>
			<p:column headerText="TWN"/>
			<p:column headerText="SGL"/>
			<p:column headerText="CTW"/>
			<p:column headerText="CEB"/>
			<p:column headerText="CNB"/>
			<p:column headerText="ADT/NA"/>
			<p:column headerText="ADT/PA"/>
			<p:column headerText="ADT/SI"/>
		</p:row>
	</p:columnGroup>
	
	<p:column styleClass="txt_center"><h:outputText value="#{vo.updatedDate}"><f:convertDateTime pattern="dd-MMM-yyyy hh:mm:ss a"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.updatedBy}"/></p:column>
	<p:column><h:outputText value="#{vo.numDays}"/></p:column>
	<p:column><h:outputText value="#{vo.numNights}"/></p:column>
	<p:column><h:outputText value="#{vo.dtDep}"><f:convertDateTime pattern="dd-MMM-yyyy"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.code}"/></p:column>
	<p:column><h:outputText value="#{vo.desc}"/></p:column>
	<p:column><h:outputText value="#{vo.fullTwn}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.fullSgl}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.fullCtw}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.fullCeb}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.fullCnb}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.grndTwn}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.grndSgl}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.grndCtw}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.grndCeb}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.grndCnb}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column>
		<h:outputText id="idRemarks" value="Details" style="color:#0000FF;"/>
		<p:tooltip for="idRemarks" value="#{vo.fullRemarks}" showEffect="fade" hideEffect="fade" style="max-width:600px;"/>
	</p:column>
	<p:column>
		<h:outputText id="idGrndRemarks" value="Details" style="color:#0000FF;"/>
		<p:tooltip for="idGrndRemarks" value="#{vo.grndRemarks}" showEffect="fade" hideEffect="fade" style="max-width:600px;"/>
	</p:column>
	<p:column><h:outputText value="#{vo.airlineCd}"/></p:column>
	<p:column styleClass="txt_center">
		<h:outputText value="Yes" rendered="#{vo.isShowAirline}"/>
		<h:outputText value="No" rendered="#{not vo.isShowAirline}"/>
	</p:column>
	<p:column><h:outputText value="#{vo.prn}"/></p:column>
	<p:column><h:outputText value="#{vo.seatAllot}"/></p:column>
	<p:column><h:outputText value="#{vo.reservedSeat}"/></p:column>
	<p:column><h:outputText value="#{vo.tourManagerPax}"/></p:column>
	<p:column><h:outputText value="#{vo.tfairDiscount}"/></p:column>
	<p:column><h:outputText value="#{vo.travelInsPolicyS}"/></p:column>
	<p:column styleClass="txt_center">
		<h:outputText value="Yes" rendered="#{vo.isIssuedS}"/>
		<h:outputText value="No" rendered="#{not vo.isIssuedS}"/>
	</p:column>
	<p:column><h:outputText value="#{vo.travelInsPolicyF}"/></p:column>
	<p:column styleClass="txt_center">
		<h:outputText value="Yes" rendered="#{vo.isIssuedF}"/>
		<h:outputText value="No" rendered="#{not vo.isIssuedF}"/>
	</p:column>
	<p:column styleClass="txt_center"><h:outputText value="#{bterp:lookupItemDesc('tour_status', vo.tourStatusCd)}"/></p:column>
	<p:column styleClass="txt_center">
		<h:outputText value="Yes" rendered="#{vo.isDepositPaid}"/>
		<h:outputText value="No" rendered="#{not vo.isDepositPaid}"/>
	</p:column>
	<p:column styleClass="txt_center">
		<h:outputText value="Yes" rendered="#{vo.isPush}"/>
		<h:outputText value="No" rendered="#{not vo.isPush}"/>
	</p:column>
	<p:column styleClass="txt_center">
		<h:outputText value="Yes" rendered="#{vo.isHotDeal}"/>
		<h:outputText value="No" rendered="#{not vo.isHotDeal}"/>
	</p:column>
	<p:column><h:outputText value="#{vo.cnaAdt}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.cpaAdt}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column><h:outputText value="#{vo.csiAdt}"><f:convertNumber pattern="#,##0.00"/></h:outputText></p:column>
	<p:column>
		<h:outputText id="idInvRemarks" value="Details" style="color:#0000FF;"/>
		<p:tooltip for="idInvRemarks" value="#{vo.invRemarks}" showEffect="fade" hideEffect="fade" style="max-width:600px;"/>
	</p:column>
	<p:column><h:outputText value="#{vo.reason}"/></p:column>
	<p:column styleClass="txt_center"><h:outputText value="#{zsg:referenceDataValue('ACT_TYPE_CD', vo.actionCd)}"/></p:column>
</p:dataTable>
</p:scrollPanel>
</ui:composition>
