<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:c="http://java.sun.com/jsp/jstl/core"
	    		xmlns:ui="http://java.sun.com/jsf/facelets"
	  			xmlns:h="http://java.sun.com/jsf/html"
	  			xmlns:f="http://java.sun.com/jsf/core"
	  			xmlns:p="http://primefaces.org/ui"
	  			xmlns:zsg="http://www.bcs.com/zsg/jsf"
	  			xmlns:bterp="http://www.bcs.com/zsg/jsf/bterp">

<p:dataTable value="#{historyBean.tourPkgHistorySelectList}" var="vo" paginator="true" rows="20" 
	paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  Page: {JumpToPageDropdown} {RowsPerPageDropdown}" 
	rowsPerPageTemplate="5, 10">
	
	<p:columnGroup type="header">
		<p:row>
			<p:column headerText="Date" rowspan="2" style="width:120px;"/>
			<p:column headerText="Theme/Country" rowspan="2" style="width:50px;"/>
			<p:column headerText="Type" rowspan="2" style="width:50px;"/>
			<p:column headerText="Number Of" colspan="2"/>
			<p:column headerText="Package Name" colspan="3"/>
			<p:column headerText="Muslim Package" rowspan="2"/>
			<p:column headerText="Is Theme Package" rowspan="2"/>
			<p:column headerText="Season" rowspan="2"/>
			<p:column headerText="Year" rowspan="2"/>
			<p:column headerText="Deposit" rowspan="2"/>
			<p:column headerText="Bag Deduction" rowspan="2"/>
			<p:column headerText="TFair Discount" rowspan="2"/>
			<p:column headerText="Price Diff" colspan="4"/>
			<p:column headerText="Ground Only" colspan="4"/>
			<p:column headerText="Commission" colspan="3"/>
			<p:column headerText="High Light" rowspan="2"/>
			<p:column headerText="Reason" rowspan="2"/>
			<p:column headerText="Action" rowspan="2" style="width:50px;"/>
		</p:row>
		<p:row>
			<p:column headerText="Days"/>
			<p:column headerText="Nights"/>
			<p:column headerText="English"/>
			<p:column headerText="Chinese"/>
			<p:column headerText="Other"/>
			<p:column headerText="SGL $"/>
			<p:column headerText="CTW %"/>
			<p:column headerText="CWB %"/>
			<p:column headerText="CNB %"/>
			<p:column headerText="SGL $"/>
			<p:column headerText="CTW %"/>
			<p:column headerText="CWB %"/>
			<p:column headerText="CNB %"/>
			<p:column headerText="ADT/NA"/>
			<p:column headerText="ADT/PA"/>
			<p:column headerText="ADT/SI"/>
		</p:row>
	</p:columnGroup>
	
	<p:column styleClass="txt_center"><h:outputLabel value="#{vo.createdDate}"><f:convertDateTime pattern="dd-MMM-yyyy"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.themeDesc}"/></p:column>
	<p:column styleClass="txt_center"><h:outputLabel value="#{zsg:referenceDataValue('TOUR_TYPE', vo.typeCd)}"/></p:column>
	<p:column><h:outputLabel value="#{vo.numDays}"/></p:column>
	<p:column><h:outputLabel value="#{vo.numNights}"/></p:column>
	<p:column><h:outputLabel value="#{vo.nameEn}"/></p:column>
	<p:column><h:outputLabel value="#{vo.nameZh}"/></p:column>
	<p:column><h:outputLabel value="#{vo.nameOther}"/></p:column>
	<p:column styleClass="txt_center">
		<h:outputLabel value="Yes" rendered="#{vo.isMuslimPkg}"/>
		<h:outputLabel value="No" rendered="#{not vo.isMuslimPkg}"/>
	</p:column>
	<p:column styleClass="txt_center">
		<h:outputLabel value="Yes" rendered="#{vo.isThemeTour}"/>
		<h:outputLabel value="No" rendered="#{not vo.isThemeTour}"/>
	</p:column>
	<p:column styleClass="txt_center"><h:outputLabel value="#{zsg:referenceDataValue('SEASON', vo.seasonCd)}"/></p:column>
	<p:column><h:outputLabel value="#{vo.year}"/></p:column>
	<p:column><h:outputLabel value="#{vo.deposit}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.bagDeduction}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.tfairDiscount}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.priceDiffSgl}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.priceDiffCtw}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.priceDiffCwb}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.priceDiffCnb}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.grndSgl}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.grndCtw}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.grndCwb}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.grndCnb}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.cnaAdt}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.cpaAdt}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.csiAdt}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></p:column>
	<p:column><h:outputLabel value="#{vo.highLight}"/></p:column>
	<p:column><h:outputLabel value="#{vo.reason}"/></p:column>
	<p:column styleClass="txt_center"><h:outputLabel value="#{zsg:referenceDataValue('ACT_TYPE_CD', vo.actionCd)}"/></p:column>
</p:dataTable>
</ui:composition>
